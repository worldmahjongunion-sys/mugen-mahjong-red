<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>一人麻雀</title>
<style>
  :root{
    --felt:#0F5C3E;
    --felt-dark:#0B4530;
    --tile-bg:#FAF6ED;
    --tile-border:#C9BFA5;
    --tile-shadow:rgba(0,0,0,0.35);
    --man:#2C2C2C;
    --pin:#2A6FB0;
    --sou:#2E8B4E;
    --honor-wind:#2C2C2C;
    --honor-red:#C23B3B;
    --honor-green:#2E8B4E;
    --gold:#D8B45A;
    --text-light:#F3EFE3;
    --discard-frame:red; /* 捨て牌エリアの外周線。ここ1箇所で色を変えられる */

    /* 牌サイズは山も含めて全部この1変数に統一する。ここでの初期値はJS実行前の仮の値で、
       ページ読み込み時にfitTileSize()が画面の縦横から逆算した最大サイズに書き換える
       （--tile-wは常に--tile-hの0.73倍で連動する） */
    --tile-h: clamp(22px, 3.8dvh, 38px);
    --tile-w: calc(var(--tile-h) * 0.73);
    /* 相手の伏せ手牌を「上から見た薄い帯」で表示するための厚み(.tile-top用) */
    --tile-thick: calc(var(--tile-h) * 0.5);
    /* 鳴き面子の行(4方向とも)の縮小率。既定は等倍(1)で、卓は正方形のため
       卓幅(--table-width)を長さの基準として使い、それを超える行だけ
       JS(fitMeldRowScale)が1未満の値に書き換える */
    --meld-scale-top: 1;
    --meld-scale-bottom: 1;
    --meld-scale-left: 1;
    --meld-scale-right: 1;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{
    height:100%;
    margin:0;
    overflow:hidden;
    background:#08331F;
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    color:var(--text-light);
  }

  .board{
    position:relative;
    height:100dvh;
    width:100vw;
    background:
      radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);
    display:flex;
    flex-direction:column;
    padding:6px;
  }

  /* --- 卓中央：四方向に持ち点を配置した電子卓ふうの情報ボックス。
     レイアウトそのものは.ringを流用し、背景・余白だけこのクラスで足す ---
     サイズはJSでpxを固定しない：中央セル(.ring-center)いっぱいに広がり(width/height:100%)、
     必要な最小サイズ(捨て牌6枚分＋余白1枚分)だけmin-width/min-heightで持たせる。
     この最小値は--tile-wベースのcalc()なので、fitTileSize()の二分探索中も常に最新の値のまま
     参照される（JS実測pxのスナップショットだと探索中に値が古いまま残り、探索後に確定した
     サイズと食い違って捨て牌の行にあふれることがあったため） */
  .center-info{
    box-sizing:border-box;
    width:100%;
    height:100%;
    min-width:calc(var(--tile-w) * 7 + 10px); /* 捨て牌グリッド(6枚・gap2px×5=10px)＋余白1枚分 */
    min-height:calc(var(--tile-w) * 7 + 10px);
    background:rgba(0,0,0,0.25);
    border-radius:10px;
    padding:6px 10px;
    white-space:nowrap;
    /* 上下左右のネームプレートを各辺にぴったり寄せる：中央列・中央行だけを1frにして
       余った分をそこに集め、四隅のネームプレート行/列は中身ぴったりのサイズのまま端に残す */
    grid-template-columns:auto 1fr auto;
    grid-template-rows:auto 1fr auto;
  }
  /* stabilizeCenterInfoCells()が.ring-top等に実測px幅・高さを明示指定すると、
     グリッドアイテムのjustify-self/align-selfの既定値stretchが効かなくなり
     start（トラックの開始側＝左/上）に寄ってしまう。1fr側の余白がある軸を
     明示的にcenterへ固定し、4方向とも中央揃えにする。 */
  .center-info > .ring-top,
  .center-info > .ring-bottom,
  .center-info > .ring-left,
  .center-info > .ring-right{
    justify-self:center;
    align-self:center;
  }
  /* 中央BOXに置く起家マーク（ネームプレートの中に入る） */
  .dealer-mark{
    background:var(--honor-red);
    color:#fff;
    border-radius:3px;
    font-size:13px;
    padding:0 4px;
    line-height:1.4;
  }
  .center-mid{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    font-size:11px;
  }
  /* 1段目：局・供託を横並びにする（.top-left-infoの左上パネル専用。wallCount側の.center-midには
     このクラスの要素が無いので影響しない） */
  .center-mid .round-kyotaku-row{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .center-mid .round{
    font-weight:bold;
    color:var(--gold);
    font-size:1.18em; /* 親(.top-left-info)のfont-sizeに連動して卓と一緒に縮む */
  }
  .center-mid .kyotaku-row{
    color:#ccc;
  }
  .center-mid .dora-row{
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .center-mid .dora-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .center-mid .dora-tile{
    width:2.3em; /* 左上パネルは余白に余裕があるため拡大（旧1.45em）。親(.top-left-info)のfont-sizeに連動 */
    height:3.2em; /* 旧2em */
  }
  .center-mid .dora-label{
    font-size:0.82em; /* 親(.top-left-info)のfont-sizeに連動して卓と一緒に縮む */
    color:#ccc;
  }
  .center-mid .riichi-dora-label{
    color:var(--honor-red);
    font-weight:bold;
  }
  .center-mid .riichi-dora-tile{
    box-shadow:0 0 0 2px var(--honor-red);
    border-radius:3px;
  }
  .wall-count{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1px;
  }
  .wall-count-label{
    font-size:9px;
    color:#ccc;
  }
  .wall-count-num{
    font-size:clamp(20px, calc(var(--tile-h) * 0.9), 44px); /* 卓のサイズ(--tile-h)に連動して拡大・縮小する（旧16px固定） */
    font-weight:bold;
    color:var(--gold);
    font-variant-numeric:tabular-nums;
    line-height:1;
    min-width:2ch; /* 76→9のように桁数が変わってもBOXが揺れないよう幅を固定する */
    text-align:center;
  }

  /* --- 卓：手牌／山／捨牌／中央情報ボックスの4層を、同じ「リング」グリッドを
     3重に入れ子にして表現する。各ringは中身の大きさぶんだけのサイズにし（画面いっぱいに
     伸ばさない）、余った空間はtable-area側でring全体を中央寄せする形で外側に逃がす。
     ただしそれでも画面に収まらない極端な場合のために、中央セルはminmax(0,max-content)にして
     縮められるようにしておく（押し出し問題の再発防止）。 --- */
  .table-area{
    flex:1;
    min-height:0;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring{
    max-width:100%;
    max-height:100%;
    min-width:0;
    min-height:0;
    display:grid;
    grid-template-columns:auto minmax(0, max-content) auto;
    grid-template-rows:auto minmax(0, max-content) auto;
    grid-template-areas:
      ".  t  ."
      "l  c  r"
      ".  b  .";
    gap:2px;
  }
  /* 手牌と山の間隔＝牌の高さ1個分は、鳴き面子の行(.meld-row)自身の厚みで確保する
     （鳴き面子が0組でも.meld-rowは常にvar(--tile-h)ぶんの厚みを持つため）。
     ここでgapを別途空けると隙間が二重になるので0にする（4辺とも）。 */
  .ring.hand-ring{ gap:0; }
  /* grid-template-areasで"minmax(0,...)"にした行・列でも、そこに置かれるアイテム自身が
     デフォルトのmin-width/min-height:auto（中身のサイズ分だけ最低幅・高さを要求する）を
     持ったままだと、結局そのアイテムの中身の大きさに引っ張られて枠がはみ出してしまう。
     4辺すべてに min-width:0; min-height:0; を明示して、この自動最小サイズを無効化する。 */
  .ring-top{ grid-area:t; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; min-height:0; }
  .ring-bottom{ grid-area:b; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:0; min-height:0; }
  .ring-left{ grid-area:l; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:2px; min-width:0; min-height:0; }
  .ring-right{ grid-area:r; display:flex; flex-direction:row-reverse; align-items:center; justify-content:center; gap:2px; min-width:0; min-height:0; }
  /* ring-centerには「入れ子の次のring」か、最も内側では固定サイズの#centerが入る。
     どちらも中身の大きさぶんだけになり、align/justify-centerで中央に寄る。 */
  .ring-center{ grid-area:c; min-width:0; min-height:0; display:flex; align-items:center; justify-content:center; }

  /* 手牌の行(.ring-top/bottom/left/right直下のgap:2px)は、鳴き面子の行と手牌の行の間には
     適用しない（.meld-row自身の厚みだけで隙間を作るため、ここでさらに足すと隙間が広がる） */
  .ring.hand-ring > .ring-top,
  .ring.hand-ring > .ring-bottom,
  .ring.hand-ring > .ring-left,
  .ring.hand-ring > .ring-right{
    gap:0;
  }

  /* 山：実際の卓と同じ2段積み。牌背をCSS Gridで2列（縦持ち）/2行（横持ち）に並べ、
     JSが残り枚数ぶんだけ外側（中心から遠い側）の牌にvisibility:hiddenを付けて隠す。
     grid-auto-flowにより、DOM順で連続する2枚がそのまま「1つの山（二段）」になる。 */
  /* 山は一段表示：表示される牌1枚が「上段+下段」の2枚分を表す。
     上段を消費している間は通常色、下段に入ったらhalf-drawnで少し暗くし、
     両方消費されたらhidden-drawnで非表示にする（牌背の絵柄自体は変えない） */
  .wall-pile{ display:grid; gap:1px; }
  .wall-pile.horizontal{
    grid-auto-flow:column;
    grid-template-rows:repeat(1, var(--tile-h));
    grid-auto-columns:var(--tile-w);
  }
  .wall-pile.vertical{
    grid-auto-flow:row;
    grid-template-columns:repeat(1, var(--tile-h));
    grid-auto-rows:var(--tile-w);
  }
  .wall-pile .tile-back.hidden-drawn{ visibility:hidden; }
  .wall-pile .tile-back.half-drawn{ filter:brightness(0.62); }
  /* 自分の前だけ、自摸山・空き2枚ぶん・王牌が横に並ぶ。1本の山として繋がって見えるよう、
     山の内部と同じ1pxの間隔にする（他家の11枚と合わせて自分の山も表示枚数11枚になる） */
  .wall-bottom-group{ display:flex; flex-direction:row; gap:1px; align-items:center; }
  .wall-gap.horizontal{ display:flex; gap:1px; }
  /* 王牌のうち表向きの2枚（ドラ表示牌・リーチドラ表示牌）は、周りの伏せ牌と同じ枠サイズで表示する */
  .wall-pile .tile.wall-indicator{ width:var(--tile-w); height:var(--tile-h); border-radius:3px; }
  /* リーチドラ表示牌は、左上パネルの表示（.riichi-dora-tile）と同じ赤枠を付けて区別する */
  .wall-pile .tile.wall-indicator.riichi-dora-tile{ box-shadow:0 0 0 2px var(--honor-red); }

  .nameplate{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(0,0,0,0.3);
    border-radius:10px;
    padding:3px 10px;
    font-size:18px; /* 読みやすさのため拡大（旧12px） */
    white-space:nowrap;
  }
  .nameplate .score{
    display:inline-block;
    min-width:5ch; /* 桁数が変わっても幅が動かないよう確保する */
    text-align:right;
    font-weight:bold;
    color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
  .nameplate.you{ background:rgba(0,0,0,0.4); }
  /* 4人とも中身は横書きのまま「方角→点数」の順で並べ、プレート全体をtransformで1回だけ回す。
     90度回転で箱の実寸（レイアウト上の幅・高さ）が回転前のままになる問題は、
     JS側で.center-info内の各セルに実測サイズを固定で入れて吸収する（stabilizeCenterInfoCells参照）。 */
  .nameplate.rot180{ transform:rotate(180deg); }
  .nameplate.rot90{ transform:rotate(90deg); }   /* 上家（左）：文字の上が画面右を向く */
  .nameplate.rotm90{ transform:rotate(-90deg); } /* 下家（右）：文字の上が画面左を向く */
  .nameplate .wind-mark{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:22px; height:22px;
    border-radius:4px;
    background:var(--tile-bg);
    color:var(--honor-wind);
    font-size:15px;
    font-weight:bold;
  }

  /* --- 牌の見た目（リアル寄り） --- */
  .tile{
    width:22px;
    height:30px;
    background:linear-gradient(180deg, #FFFDF6 0%, #F2ECDA 55%, #E9E1CB 100%);
    border:1px solid #B9AD8C;
    border-bottom:2.5px solid #8C7F5E;
    border-radius:3px 3px 4px 4px;
    box-shadow:
      0 2px 0 rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.8);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
  }
  .tile svg{
    width:88%;
    height:88%;
    display:block;
  }
  .tile.man{ color:var(--man); }
  .tile.red-five{ box-shadow:0 0 0 1px rgba(194,59,59,0.7), 0 2px 0 rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.8); }
  .tile.pin{ color:var(--pin); }
  .tile.sou{ color:var(--sou); }
  .tile.wind{ color:var(--honor-wind); }
  .tile.dragon-red{ color:var(--honor-red); }
  .tile.dragon-green{ color:var(--honor-green); }
  .tile.dragon-white{ color:#999; }

  :root{
    --tileback-svg:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140"><rect width="100" height="140" fill="%235BC7E8"/><g fill="none" stroke="%231C5F91" stroke-width="2.6" stroke-linecap="round"><path d="M14 32 Q10 22 18 16 Q26 12 32 18 Q36 24 30 30 Q24 36 14 32 Z"/><path d="M30 24 Q40 26 44 18 Q46 12 42 8"/><path d="M86 32 Q90 22 82 16 Q74 12 68 18 Q64 24 70 30 Q76 36 86 32 Z"/><path d="M70 24 Q60 26 56 18 Q54 12 58 8"/><path d="M14 108 Q10 118 18 124 Q26 128 32 122 Q36 116 30 110 Q24 104 14 108 Z"/><path d="M30 116 Q40 114 44 122 Q46 128 42 132"/><path d="M86 108 Q90 118 82 124 Q74 128 68 122 Q64 116 70 110 Q76 104 86 108 Z"/><path d="M70 116 Q60 114 56 122 Q54 128 58 132"/></g><circle cx="50" cy="70" r="30" fill="none" stroke="%231C5F91" stroke-width="2.8"/><g fill="none" stroke="%231C5F91" stroke-width="6.5" stroke-linecap="square"><path d="M50 44 L50 61 L67 61"/><path d="M76 70 L59 70 L59 87"/><path d="M50 96 L50 79 L33 79"/><path d="M24 70 L41 70 L41 53"/></g><circle cx="50" cy="70" r="6" fill="%231C5F91"/></svg>');
  }

  /* 伏せ牌は全部--tile-*の統一サイズ（CPUの伏せ手牌・山ともに同じ大きさになる） */
  .tile-back{
    width:var(--tile-w);
    height:var(--tile-h);
    background-color:#5BC7E8;
    background-image:var(--tileback-svg);
    background-size:cover;
    background-position:center;
    border:1px solid rgba(255,255,255,0.35);
    border-bottom:2.5px solid rgba(0,0,0,0.35);
    border-radius:3px 3px 4px 4px;
    box-shadow:0 2px 0 rgba(0,0,0,0.3);
    flex-shrink:0;
  }

  /* 横向き（左右の対戦相手用）：対面と全く同じ柄を90度回転させて表示する */
  .tile-back.rot{
    width:var(--tile-h);
    height:var(--tile-w);
    background:none;
    border:none;
    box-shadow:none;
    position:relative;
  }
  .tile-back.rot::before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:var(--tile-w);
    height:var(--tile-h);
    background-color:#5BC7E8;
    background-image:var(--tileback-svg);
    background-size:cover;
    background-position:center;
    border:1px solid rgba(255,255,255,0.35);
    border-bottom:2.5px solid rgba(0,0,0,0.35);
    border-radius:3px 3px 4px 4px;
    box-shadow:0 2px 0 rgba(0,0,0,0.3);
    transform:translate(-50%, -50%) rotate(90deg);
  }

  /* 相手の伏せ手牌を「上から見た薄い帯」として表示する。柄は使わず、牌を横から見た
     二色（象牙色=牌の表面／青=牌の裏側）をlinear-gradientで塗る。
     暗槓の伏せ牌(.tile-back)とは別クラスにして、暗槓側の柄付き表示に影響しないようにする */
  .tile-top{
    width:var(--tile-w);
    height:var(--tile-thick);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:3px;
    flex-shrink:0;
  }
  .tile-top.rot{
    width:var(--tile-thick);
    height:var(--tile-w);
  }
  /* 青(牌の裏側)が卓の中央を向くよう、席ごとに象牙色80%／青20%の向きを変える */
  .tile-top.seat-top{
    background:linear-gradient(to bottom, var(--tile-bg) 0% 75%, #5BC7E8 75% 100%);
  }
  .tile-top.seat-left{
    background:linear-gradient(to right, var(--tile-bg) 0% 75%, #5BC7E8 75% 100%);
  }
  .tile-top.seat-right{
    background:linear-gradient(to left, var(--tile-bg) 0% 75%, #5BC7E8 75% 100%);
  }

  /* 手牌の行：鳴きで枚数が減っても常に「13枚+ツモ1枚=14枚分」の幅（縦向きは高さ）を
     min-width/min-height で確保する（旧padCount＝透明なプレースホルダー牌を並べる方式の代わり）。
     実際の牌はjustify-content:centerでその枠の中央に寄る。
     内訳：牌14枚 + 牌同士のgap13個(3px×13) + ツモ牌自身に付くmargin(3px)。
     ツモった瞬間にmarginぶん行が伸びて縮まないよう、ここにも同じ3pxを含めておく。 */
  .hand-row{
    display:flex;
    gap:3px;
    justify-content:center;
    flex-wrap:nowrap;
    min-width:calc(var(--tile-w) * 14 + 3px * 13 + 3px);
  }
  .hand-row.mine{
    gap:3px;
  }
  .hand-row.mine .tile{
    width:var(--tile-w);
    height:var(--tile-h);
  }
  .hand-row.mine .tile.drawn{
    margin-left:3px; /* 手牌同士の間隔(3px)の2倍程度になるよう、既存のgap(3px)にさらに3pxだけ足す */
  }

  /* CPUのツモ枠：各自から見て手牌の右側になるよう、向きに応じた側に間隔をあける（手牌同士の間隔の2倍程度） */
  #handTop .tile-back.drawn{ margin-right:3px; }   /* 対面：180度回転のため先頭側にあける */
  #handRight .tile-back.drawn{ margin-bottom:3px; } /* 下家：-90度回転のため先頭(上)側にあける */
  #handLeft .tile-back.drawn{ margin-top:3px; }     /* 上家：90度回転のため末尾(下)側にあける */

  .hand-row.vertical{
    flex-direction:column;
    min-width:0;
    min-height:calc(var(--tile-w) * 14 + 3px * 13 + 3px);
  }

  /* --- 捨て牌エリア（全員同じ大きさ。各自から見て左から6枚→奥の段へ、を再現するためJSで行列を明示指定） --- */
  .discard-grid{
    display:grid;
    gap:2px;
    outline:1px solid var(--discard-frame); /* 捨て牌エリアの外周を示す正式な枠線 */
  }
  /* 牌自体の幅・高さはCSSでは決めない。回転あり(top/left/right)はJS側の
     applyMeldRotation()が回転後の見た目に合わせて実寸をインラインで設定するため、
     ここでwidth/heightを指定すると回転前の箱のままグリッドに置かれて枠からあふれる
     （中央BOXと重なっていた不具合の原因）。border-radiusだけ共通で当てておく */
  .discard-grid .tile{
    border-radius:4px;
  }

  /* 自分・対面：6列×4行（横向きの手牌用、最大24枚まで対応）。
     width/heightは--tile-w/--tile-hベースのcalc()で直接指定する（JS実測pxのスナップショットは
     やめた：二分探索中は値が古いまま残り、探索後に確定したサイズと食い違って中央BOXや捨て牌の
     行があふれることがあったため。gapは.discard-gridのgap:2pxに合わせている） */
  #discardBottom, #discardTop{
    grid-template-columns:repeat(6, var(--tile-w));
    grid-template-rows:repeat(4, var(--tile-h));
    flex-shrink:0;
    justify-content:center;
    width:calc(var(--tile-w) * 6 + 10px); /* 牌6枚＋gap2px×5 */
    height:calc(var(--tile-h) * 4 + 6px); /* 牌4枚＋gap2px×3 */
  }

  /* 上家・下家：4列×6行（縦向きの手牌用、回転後の見た目寸法に合わせる。最大24枚まで対応） */
  #discardLeft, #discardRight{
    grid-template-columns:repeat(4, var(--tile-h));
    grid-template-rows:repeat(6, var(--tile-w));
    flex-shrink:0;
    align-content:center;
    width:calc(var(--tile-h) * 4 + 6px); /* 牌4枚＋gap2px×3 */
    height:calc(var(--tile-w) * 6 + 10px); /* 牌6枚＋gap2px×5 */
  }

  #center{
    display:flex;
    align-items:center;
    justify-content:center;
    /* .ring-center自身はgridのstretchで自分のセルいっぱいの大きさになっているが、
       align-items:centerのため中身(#center)はデフォルトでは中央寄せの縮小サイズになり、
       それを100%で引き継ぐ.center-infoも横長のまま縮んでしまっていた。
       #center自身にもwidth/height:100%を明示し、.ring-centerの大きさをそのまま
       .center-infoまで伝える（これで.center-infoのwidth/height:100%が正しく効く） */
    width:100%;
    height:100%;
  }

  /* 鳴き面子の行(.meld-row)は、手牌の行(.hand-row)とは別の独立した行として、
     手牌と山の間の隙間（.ring.hand-ring側でgap:0にした、牌の高さ1個分のスペース）に置く。
     中国式：4人とも「手牌の卓中央寄りの辺」に鳴き面子の行を敷く。
     DOM順（.ring-top/bottom/left/rightの直下）は中央に近い側が来るようにしてある：
     top=[手牌,鳴き]（鳴きが下＝中央側）／bottom=[鳴き,手牌]（鳴きが上＝中央側）／
     left=[手牌,鳴き]（鳴きが右＝中央側）／right=[手牌,鳴き]（鳴きが左＝中央側）。
     鳴きが0組でも.meld-rowはtile-hぶんの厚みを常に確保するため、鳴いた瞬間に
     この行の高さ・幅が変わって中央BOXが揺れることはない。
     .ring-top/bottom/left/rightの既存のalign-items:centerにより、手牌に対して自動的に中央揃えになる。 */
  .meld-row{
    display:flex;
    flex-shrink:0;
    gap:3px; /* 鳴き牌の組同士の間隔＝手牌の牌の間隔と同じ */
  }
  .ring-top .meld-row, .ring-bottom .meld-row{
    flex-direction:row;
    height:var(--tile-h); /* 鳴き0組でも常にこの高さを確保 */
  }
  .ring-left .meld-row, .ring-right .meld-row{
    flex-direction:column;
    width:var(--tile-h); /* 鳴き0組でも常にこの幅を確保 */
  }
  /* カン（暗槓・大明槓・加槓）で積んだ4枚目は、buildKanGroup()がposition:absoluteで
     卓中央側へちょうど牌1枚の横幅ぶん(--tile-w)はみ出す形で積む。.meld-rowの厚みは
     はみ出しぶんを見込んでいないため、王牌と重なっていた。カンがある席だけ、
     JS(renderMelds)が付ける.has-kanクラスで厚みを牌の横幅ぶん増やして回避する。
     カンの無い席はこのクラスが付かないため、従来どおりvar(--tile-h)のまま動かない */
  .ring-top .meld-row.has-kan, .ring-bottom .meld-row.has-kan{
    height:calc(var(--tile-h) + var(--tile-w));
  }
  .ring-left .meld-row.has-kan, .ring-right .meld-row.has-kan{
    width:calc(var(--tile-h) + var(--tile-w));
  }

  .meld-row .tile{
    width:var(--tile-w);
    height:var(--tile-h);
  }

  /* 画面最下段：案内文・結果・鳴きプロンプト、および常時表示の操作ボタン行 */
  .status-area{
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding-top:2px;
  }

  .button-row{
    display:grid;
    grid-template-columns:repeat(11, 1fr); /* ボタン11個ぶんを均等幅に。大きさを統一する */
    gap:4px;
    width:100%;
    max-width:var(--table-width, 100%); /* 卓の実測幅（fitTileSize()が設定）に合わせて中央寄せする */
    margin:0 auto;
    height:clamp(34px, 5.5dvh, 46px);
    flex-shrink:0;
    overflow-x:auto; /* 極端に狭い画面向けの保険。通常は1行に収まる想定 */
  }
  .row-btn{
    background:var(--gold);
    color:#3B2C08;
    border:none;
    border-radius:6px;
    padding:2px 4px;
    font-weight:bold;
    font-size:clamp(9px, 1.6dvh, 11px);
    white-space:nowrap;
    box-shadow:0 2px 0 rgba(0,0,0,0.3);
  }
  .row-btn:disabled{
    opacity:0.35;
  }
  .hand-row.mine .tile.clickable{
    cursor:pointer;
    transition:transform 0.12s ease;
  }
  .hand-row.mine .tile.clickable:hover{
    transform:translateY(-6px);
  }
  /* チー/ポン/カンの選択中、使える牌を枠で色分けする */
  .hand-row.mine .tile.callable{
    cursor:pointer;
    box-shadow:
      0 0 0 3px var(--gold),
      0 2px 0 rgba(0,0,0,0.25),
      inset 0 1px 0 rgba(255,255,255,0.8);
    transition:transform 0.12s ease;
  }
  .hand-row.mine .tile.callable:hover{
    transform:translateY(-6px);
  }

  /* .boardの右上（空きスペース）に固定表示する。.boardがposition:relativeなのでこれが基準になる */
  .result-box{
    background:rgba(5,20,12,0.97);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:0.7em 1.1em; /* em指定でfont-sizeと一緒に縮む */
    text-align:center;
    /* 卓の牌サイズ(--tile-h)に連動して縮小し、狭い画面で卓の隅（鳴き牌等）と重ならないようにする */
    font-size:clamp(9px, calc(var(--tile-h) * 0.4), 15px);
    line-height:1.7;
    position:absolute;
    top:clamp(4px, 1dvh, 10px);
    right:clamp(4px, 1dvw, 10px);
    /* 役名列・合計行の折り返しを防ぐため150pxでは足りなかった。役満の5〜6桁の点数や
       「8000・16000」のような分割表記でも収まる幅に拡げつつ、狭い画面ではvwで縮める */
    max-width:min(260px, 68vw);
    z-index:80;
  }
  .result-box .result-title{
    font-size:17px;
    font-weight:bold;
    color:var(--gold);
    margin-bottom:4px;
  }
  .result-box .result-yaku{
    font-size:12px;
    opacity:0.9;
  }
  .result-box .result-score{
    font-size:15px;
    font-weight:bold;
    color:var(--gold);
    margin-top:4px;
  }
  /* 和了結果：1行1役、役名/飜数/点数の3列グリッド */
  .result-box .result-row{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:0 8px;
    font-size:12px;
    opacity:0.9;
    text-align:left;
    white-space:nowrap; /* 「ドラ×1」「赤×1(自摸)」等が途中で折り返されないようにする */
  }
  .result-box .result-row .col-han{
    text-align:center;
    min-width:2.4em;
  }
  .result-box .result-row .col-pts{
    text-align:right;
    min-width:6ch; /* 役満の5〜6桁の点数でも収まる幅を確保 */
    font-variant-numeric:tabular-nums;
  }
  .result-box .result-row.total-row{
    font-size:15px;
    font-weight:bold;
    color:var(--gold);
    opacity:1;
    margin-top:4px;
    padding-top:3px;
    border-top:1px solid rgba(255,255,255,0.25);
  }

  /* .boardの左上（和了結果表示＝右上の対角）に固定表示する。中身は.center-midのレイアウトを流用する */
  .top-left-info{
    position:absolute;
    top:clamp(4px, 1dvh, 10px);
    left:clamp(4px, 1dvw, 10px);
    background:rgba(5,20,12,0.97);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:0.55em 0.85em; /* em指定でfont-sizeと一緒に縮む */
    /* 右上の和了結果表示（.result-box）とfont-sizeの計算式を揃え、卓のサイズに連動して縮小する */
    font-size:clamp(9px, calc(var(--tile-h) * 0.4), 15px);
    z-index:80;
  }

  .call-prompt{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:4px;
  }
  .call-prompt .action-btn{
    background:#E7C766;
  }
  .action-btn{
    background:var(--gold);
    color:#3B2C08;
    border:none;
    border-radius:8px;
    padding:6px 16px;
    font-weight:bold;
    font-size:13px;
    box-shadow:0 2px 0 rgba(0,0,0,0.3);
  }
  .action-btn:disabled{
    opacity:0.35;
  }
</style>
</head>
<body>

<div class="board">

  <div class="table-area">
    <!-- 層1：手牌（4辺の最も外側） -->
    <div class="ring hand-ring">

      <!-- 対面（CPU）：中国式に、鳴き面子の行を手牌の卓中央寄り（下）に独立した行として置く -->
      <div class="ring-top">
        <div class="hand-row" id="handTop">
          <!-- 13枚、伏せ牌 -->
        </div>
        <div class="meld-row" id="meldsTop"></div>
      </div>

      <!-- 上家（CPU・左）：鳴き面子の行は手牌の卓中央寄り（右）に置く -->
      <div class="ring-left">
        <div class="hand-row vertical" id="handLeft"></div>
        <div class="meld-row vertical" id="meldsLeft"></div>
      </div>

      <!-- 下家（CPU・右）：鳴き面子の行は手牌の卓中央寄り（左）に置く -->
      <div class="ring-right">
        <div class="hand-row vertical" id="handRight"></div>
        <div class="meld-row vertical" id="meldsRight"></div>
      </div>

      <!-- 自分：鳴き面子の行は手牌の卓中央寄り（上）に置く -->
      <div class="ring-bottom">
        <div class="meld-row" id="meldsBottom"></div>
        <div class="hand-row mine" id="handMine"></div>
      </div>

      <!-- 層2：山（実際の卓と同じ2段積み。対面・上家・下家は22枚(11山)、自分の前だけ
           自摸山10枚(5山)＋王牌8枚(4山)に分かれる。残り枚数ぶんだけ外側の山からJSで隠す） -->
      <div class="ring-center">
        <div class="ring wall-ring">
          <div class="ring-top"><div class="wall-pile horizontal" id="wallTop">
            <div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div>
          </div></div>
          <div class="ring-left"><div class="wall-pile vertical" id="wallLeft">
            <div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div>
          </div></div>
          <div class="ring-right"><div class="wall-pile vertical" id="wallRight">
            <div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div><div class="tile-back rot"></div>
          </div></div>
          <div class="ring-bottom"><div class="wall-bottom-group">
            <!-- 自摸山（左・実質10枚を5枚で一段表示、1枚が上段+下段の2枚分）。外側から隠れる -->
            <div class="wall-pile horizontal" id="wallBottomLive">
              <div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div><div class="tile-back"></div>
            </div>
            <!-- 他家（11枚）との表示枚数を揃えるための空き2枚ぶん。自摸山は開門位置＝この側から
                 減っていくため、局が進むとこの空きが自然に広がって見える（wallPileRemaining/
                 updateWallPilesの数え上げ対象からは外すため、wall-pile/wallBottomLiveの外に置く） -->
            <div class="wall-gap horizontal" aria-hidden="true">
              <div class="tile-back" style="visibility:hidden;"></div><div class="tile-back" style="visibility:hidden;"></div>
            </div>
            <!-- 王牌（右・実質8枚を4枚で一段表示）。開門側(左＝自摸山に近い側)から
                 1・2枚目=嶺上牌(カンで消費、1枚が2枚分)、3枚目=表ドラ表示牌、4枚目=リーチドラ表示牌 -->
            <div class="wall-pile horizontal" id="wallDead">
              <div class="tile-back"></div><div class="tile-back"></div><div class="tile wall-indicator" id="doraIndicatorTile"></div><div class="tile wall-indicator" id="riichiDoraIndicatorTile"></div>
            </div>
          </div></div>

          <!-- 層3：捨て牌（6枚で折り返す） -->
          <div class="ring-center">
            <div class="ring discard-ring">
              <div class="ring-top"><div class="discard-grid" id="discardTop"></div></div>
              <div class="ring-left"><div class="discard-grid vertical" id="discardLeft"></div></div>
              <div class="ring-right"><div class="discard-grid vertical" id="discardRight"></div></div>
              <div class="ring-bottom"><div class="discard-grid" id="discardBottom"></div></div>

              <!-- 層4：中央の情報ボックス。実卓の電子卓と同じく、四方向に持ち点を配置する -->
              <div class="ring-center">
                <div id="center">
                  <div class="ring center-info">
                    <div class="ring-top"><div class="nameplate rot180"><span class="wind-mark">西</span><span class="score" id="scoreTop">35000</span></div></div>
                    <div class="ring-left"><div class="nameplate rot90"><span class="wind-mark">北</span><span class="score" id="scoreLeft">35000</span></div></div>
                    <div class="ring-right"><div class="nameplate rotm90"><span class="wind-mark">南</span><span class="score" id="scoreRight">35000</span></div></div>
                    <div class="ring-bottom"><div class="nameplate you"><span class="dealer-mark">起</span><span class="wind-mark">東</span><span class="score" id="scoreBottom">35000</span></div></div>
                    <div class="ring-center">
                      <div class="center-mid">
                        <div id="wallCount" class="wall-count">
                          <span class="wall-count-label">残り牌</span>
                          <span class="wall-count-num" id="wallCountNum">76</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- 場況表示（局・供託・ドラ）。和了結果表示（右上）の対角、画面左上に固定表示する。
       1段目=局・供託、2段目=表ドラ・リーチドラの2段組 -->
  <div class="center-mid top-left-info">
    <div class="round-kyotaku-row">
      <div class="round">東1局 0本場</div>
      <div id="kyotakuCount" class="kyotaku-row">供託 0本</div>
    </div>
    <div class="dora-row">
      <div class="dora-item">
        <div class="tile dora-tile" id="doraActualTile"></div>
        <div class="dora-label">表ドラ</div>
      </div>
      <div class="dora-item">
        <div class="tile dora-tile riichi-dora-tile" id="riichiDoraActualTile"></div>
        <div class="dora-label riichi-dora-label">リーチドラ</div>
      </div>
    </div>
  </div>

  <!-- 結果・鳴きプロンプト＋常時表示の操作ボタン行 -->
  <div class="status-area">
    <div class="result-box" id="resultBox" style="display:none;"></div>
    <div class="call-prompt" id="callPrompt" style="display:none;"></div>
  </div>
  <div class="button-row" id="buttonRow">
    <button class="row-btn" disabled>理牌</button>
    <button class="row-btn" disabled>理牌無し</button>
    <button class="row-btn" disabled>鳴き無し</button>
    <button class="row-btn" id="throughBtn" disabled>スルー</button>
    <button class="row-btn" id="chiBtn" disabled>チー</button>
    <button class="row-btn" id="ponBtn" disabled>ポン</button>
    <button class="row-btn" id="kanBtn" disabled>カン</button>
    <button class="row-btn" disabled>リーチ</button>
    <button class="row-btn" disabled>自動和了</button>
    <button class="row-btn" disabled>自摸切り</button>
    <button class="row-btn" id="winBtn" disabled>和了</button>
  </div>

</div>

<script>
  // --- 牌をリアルな見た目のSVGで描画する ---
  const KANJI_NUM = ["", "一", "二", "三", "四", "伍", "六", "七", "八", "九"];

  // 筒子・索子のドット/竹の配置（viewBox 0 0 40 56）
  function pipPositions(n){
    const layouts = {
      1: [[20,28]],
      2: [[13,17],[27,39]],
      3: [[13,17],[20,28],[27,39]],
      4: [[13,17],[27,17],[13,39],[27,39]],
      5: [[13,17],[27,17],[20,28],[13,39],[27,39]],
      6: [[13,14],[27,14],[13,28],[27,28],[13,42],[27,42]],
      7: [[20,10],[13,20],[27,20],[13,32],[27,32],[13,44],[27,44]],
      8: [[13,11],[27,11],[13,21],[27,21],[13,35],[27,35],[13,45],[27,45]],
      9: [[13,10],[20,10],[27,10],[13,28],[20,28],[27,28],[13,46],[20,46],[27,46]]
    };
    return layouts[n] || [];
  }

  // 筒子専用のドット配置（指定の配色パターンに合わせる）
  function pinDotPositions(n){
    const layouts = {
      2: [[20,17],[20,39]],                                             // 縦に2つ
      3: [[13,14],[20,28],[27,42]],                                     // 右下がり斜め
      4: [[13,17],[27,17],[13,39],[27,39]],
      5: [[13,17],[27,17],[20,28],[13,39],[27,39]],                     // 四隅＋中央
      6: [[13,14],[27,14],[13,28],[27,28],[13,42],[27,42]],             // 上2＋下4
      7: [[13,10],[20,17],[27,24],[13,36],[27,36],[13,48],[27,48]],     // 右下がり斜め3＋下4
      8: [[13,11],[27,11],[13,21],[27,21],[13,35],[27,35],[13,45],[27,45]],
      9: [[13,10],[20,10],[27,10],[13,28],[20,28],[27,28],[13,46],[20,46],[27,46]]
    };
    return layouts[n];
  }

  const PIN_COLOR_PATTERNS = {
    2: ["green","blue"],
    3: ["green","red","blue"],
    4: ["green","blue","blue","green"],
    5: ["green","blue","red","blue","green"],
    6: ["green","green","red","red","red","red"],
    7: ["green","green","green","red","red","red","red"],
    8: ["blue","blue","blue","blue","blue","blue","blue","blue"],
    9: ["green","green","green","red","red","red","blue","blue","blue"]
  };
  const PIN_COLOR_HEX = { green:"#1E8A4C", red:"#C23B3B", blue:"#1E6FB8" };

  function pinSVG(n, isRed){
    if(n === 1){
      // 1筒：中央が赤、その外側が青、円の外周が緑の同心円
      return `<svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="28" r="12" fill="#1E8A4C"/>
        <circle cx="20" cy="28" r="8" fill="#1E6FB8"/>
        <circle cx="20" cy="28" r="4" fill="#C23B3B"/>
      </svg>`;
    }
    const pos = pinDotPositions(n);
    const colors = (n === 5 && isRed) ? ["red","red","red","red","red"] : PIN_COLOR_PATTERNS[n];
    const circles = pos.map((p, i) => {
      const color = PIN_COLOR_HEX[colors[i]];
      return `<circle cx="${p[0]}" cy="${p[1]}" r="4.3" fill="${color}" stroke="rgba(0,0,0,0.15)" stroke-width="0.4"/>
              <ellipse cx="${p[0]-1.3}" cy="${p[1]-1.4}" rx="1.3" ry="0.8" fill="#FFFFFF" opacity="0.5"/>`;
    }).join("");
    return `<svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">${circles}</svg>`;
  }

  const SOU_COLOR_HEX = { green:"#1E8A4C", red:"#C23B3B", blue:"#1E6FB8" };

  function stickShape(p, colorName){
    const fill = SOU_COLOR_HEX[colorName];
    const dark = colorName === "red" ? "#7A2020" : (colorName === "blue" ? "#123A63" : "#124D2A");
    return `<g>
      <rect x="${p[0]-1.9}" y="${p[1]-7}" width="3.8" height="14" rx="1.9" fill="${fill}" stroke="${dark}" stroke-width="0.5"/>
      <line x1="${p[0]-1.9}" y1="${p[1]-2.6}" x2="${p[0]+1.9}" y2="${p[1]-2.6}" stroke="${dark}" stroke-width="0.6"/>
      <line x1="${p[0]-1.9}" y1="${p[1]+2.6}" x2="${p[0]+1.9}" y2="${p[1]+2.6}" stroke="${dark}" stroke-width="0.6"/>
    </g>`;
  }

  const SOU_LAYOUTS = {
    2: { pos:[[20,16],[20,40]], colors:["green","green"] },
    3: { pos:[[20,13],[13,39],[27,39]], colors:["green","green","green"] },                 // 上1・下2
    4: { pos:[[13,17],[27,17],[13,39],[27,39]], colors:["green","green","green","green"] },
    5: { pos:[[13,17],[27,17],[20,28],[13,39],[27,39]], colors:["green","blue","red","blue","green"] },
    6: { pos:[[10,18],[10,38],[20,18],[20,38],[30,18],[30,38]],                              // 縦2本×横3列
         colors:["green","green","green","green","green","green"] },
    7: { pos:[[20,10],[10,26],[20,26],[30,26],[10,42],[20,42],[30,42]],
         colors:["red","green","blue","green","green","blue","green"] },
    9: { pos:[[10,10],[20,10],[30,10],[10,26],[20,26],[30,26],[10,42],[20,42],[30,42]],      // 7のデザイン＋上に2本
         colors:["green","red","blue","green","red","blue","green","red","blue"] }
  };

  function souSVG(n, isRed){
    if(n === 1){
      // 1索：伝統的な鳥の意匠（頭・くちばし・羽根質感の胴体・翼・渦を巻く尾羽）
      function spiralPath(cx, cy, turns, startR, maxR, steps, startAngle){
        let d = "";
        for(let i = 0; i <= steps; i++){
          const t = i / steps;
          const angle = (startAngle || 0) + t * turns * 2 * Math.PI;
          const r = startR + (maxR - startR) * t;
          const x = cx + r * Math.cos(angle);
          const y = cy + r * Math.sin(angle);
          d += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
        }
        return d;
      }
      // 胴体の羽根質感（横縞のハッチング）
      let hatch = "";
      for(let y = 22; y <= 34; y += 3){
        hatch += `<path d="M${13} ${y} Q20 ${y+1.5} ${27} ${y}" fill="none" stroke="#124D2A" stroke-width="0.7"/>`;
      }
      const tailSpiral = spiralPath(17, 44, 1.7, 1, 10, 50, -Math.PI/2);
      return `<svg viewBox="0 -6 40 62" xmlns="http://www.w3.org/2000/svg">
        <!-- 尾羽の流線（渦の外側に広がる羽根） -->
        <path d="M8 40 Q3 34 4 26" fill="none" stroke="#1E8A4C" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M9 44 Q4 40 3 32" fill="none" stroke="#1E8A4C" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M11 48 Q6 46 4 39" fill="none" stroke="#1E8A4C" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M15 51 Q11 51 8 46" fill="none" stroke="#C23B3B" stroke-width="1.2" stroke-linecap="round"/>
        <!-- 尾羽（渦） -->
        <path d="${tailSpiral}" fill="none" stroke="#1E8A4C" stroke-width="2.6" stroke-linecap="round"/>
        <!-- 翼（クロスハッチの三角形） -->
        <path d="M26 22 L35 27 L31 36 L24 31 Z" fill="#DCE9DC" stroke="#124D2A" stroke-width="1"/>
        <path d="M27 24 L33 28 M27.5 27 L33.5 31 M27 30 L31 33" stroke="#124D2A" stroke-width="0.6"/>
        <path d="M26 22 L24 31" stroke="#124D2A" stroke-width="0.6"/>
        <!-- 胴体（羽根質感の縦長楕円） -->
        <path d="M13 20 Q12 28 15 34 Q20 38 25 34 Q28 28 27 20 Q23 16 20 16 Q16 16 13 20 Z"
              fill="#F3EFE3" stroke="#124D2A" stroke-width="1"/>
        ${hatch}
        <!-- 首・頭・くちばし -->
        <path d="M18 17 Q15 10 18 5 Q21 2 24 4 Q26 6 24 9 Q22 11 20 10"
              fill="#F3EFE3" stroke="#124D2A" stroke-width="1.1"/>
        <circle cx="19.5" cy="7" r="1" fill="#124D2A"/>
        <path d="M24 4 Q28 2 30 -1" fill="none" stroke="#124D2A" stroke-width="1" stroke-linecap="round"/>
        <!-- 胸元の赤い差し色 -->
        <path d="M17 32 L14 35 L18 36 Z" fill="none" stroke="#C23B3B" stroke-width="1"/>
        <path d="M19 34 L19 40" stroke="#C23B3B" stroke-width="1.6" stroke-linecap="round"/>
        <!-- 頭上の赤い冠（トサカ） -->
        <path d="M18 5 Q16 1 12 0" fill="none" stroke="#C23B3B" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M20 4 Q22 0 27 -2" fill="none" stroke="#C23B3B" stroke-width="1.3" stroke-linecap="round"/>
      </svg>`;
    }
    if(n === 8){
      // 8索：本来のM字型（両端は縦線、中央だけ斜め）。上はMを逆さにしたW、下はMのまま
      return `<svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">
        <polyline points="8,12 8,24 20,12 32,24 32,12" fill="none" stroke="#1E8A4C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="8,44 8,32 20,44 32,32 32,44" fill="none" stroke="#1E8A4C" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
    }
    const layout = SOU_LAYOUTS[n];
    const colors = (n === 5 && isRed) ? ["red","red","red","red","red"] : layout.colors;
    const sticks = layout.pos.map((p, i) => stickShape(p, colors[i])).join("");
    return `<svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">${sticks}</svg>`;
  }

  function manSVG(n, isRed){
    const numColor = isRed ? "#C23B3B" : "#1a1a1a";
    return `<svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">
      <text x="20" y="26" text-anchor="middle" font-size="20" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" fill="${numColor}" font-weight="bold">${KANJI_NUM[n]}</text>
      <text x="20" y="49" text-anchor="middle" font-size="20" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" fill="#B5342B" font-weight="bold">萬</text>
    </svg>`;
  }

  function windSVG(n){
    const w = {1:"東", 2:"南", 3:"西", 4:"北"};
    return `<svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">
      <text x="20" y="38" text-anchor="middle" font-size="28" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" fill="#1a1a1a" font-weight="bold">${w[n]}</text>
    </svg>`;
  }

  function dragonSVG(n){
    // 1:白(ブランク＋青枠) 2:發(緑) 3:中(赤)
    if(n === 1){
      return `<svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">
        <rect x="7" y="6" width="26" height="44" rx="3" fill="none" stroke="#1E6FB8" stroke-width="2.4"/>
      </svg>`;
    }
    const map = { 2: ["發", "#1E8A4C"], 3: ["中", "#C23B3B"] };
    const [ch, color] = map[n];
    return `<svg viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg">
      <text x="20" y="38" text-anchor="middle" font-size="26" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" fill="${color}" font-weight="bold">${ch}</text>
    </svg>`;
  }

  // ボタン表示など、テキストで牌を示したい箇所で使う短い表記（例:「五萬」「東」「中」）
  function tileLabel(tile){
    if(tile.suit === "wind") return {1:"東", 2:"南", 3:"西", 4:"北"}[tile.num];
    if(tile.suit === "dragon") return {1:"白", 2:"發", 3:"中"}[tile.num];
    const suitCh = { man:"萬", pin:"筒", sou:"索" }[tile.suit];
    return KANJI_NUM[tile.num] + suitCh;
  }

  function tileEl(suit, num, cls, isRed){
    const div = document.createElement("div");
    div.className = "tile " + cls + (isRed ? " red-five" : "");
    if(suit === "pin") div.innerHTML = pinSVG(num, isRed);
    else if(suit === "sou") div.innerHTML = souSVG(num, isRed);
    else if(suit === "man") div.innerHTML = manSVG(num, isRed);
    else if(suit === "wind") div.innerHTML = windSVG(num);
    else if(suit === "dragon") div.innerHTML = dragonSVG(num);
    return div;
  }

  // ==================== STEP2: 牌山生成・配牌 ====================

  function tileClass(suit, num){
    if(suit === "dragon"){
      return num === 1 ? "dragon-white" : (num === 2 ? "dragon-green" : "dragon-red");
    }
    return suit; // man / pin / sou / wind
  }

  // 34種類の牌タイプを作る（萬子・筒子・索子1-9、風牌4種、三元牌3種）
  function buildTileTypes(){
    const types = [];
    ["man", "pin", "sou"].forEach(suit => {
      for(let n = 1; n <= 9; n++) types.push({ suit, num: n });
    });
    for(let n = 1; n <= 4; n++) types.push({ suit:"wind", num:n });
    for(let n = 1; n <= 3; n++) types.push({ suit:"dragon", num:n });
    return types; // 34種類
  }
  const ALL_TILE_TYPES = buildTileTypes(); // テンパイ判定で全34種を試すために使う

  // 136枚の牌山を作る（各種4枚ずつ）
  function buildWall(){
    const types = buildTileTypes();
    const wall = [];
    types.forEach(t => {
      for(let i = 0; i < 4; i++){
        const tile = { suit:t.suit, num:t.num };
        // 各色（萬子・筒子・索子）の5のうち1枚を赤ドラにする（Mリーグ方式）
        if(t.num === 5 && (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && i === 0){
          tile.red = true;
        }
        wall.push(tile);
      }
    });
    return wall; // 34種類 × 4枚 = 136枚
  }

  // Fisher-Yatesシャッフル
  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  function sortKey(t){
    const order = { man:0, pin:1, sou:2, wind:3, dragon:4 };
    return order[t.suit] * 100 + t.num;
  }

  // --- 牌山を作ってシャッフル ---
  const wall = buildWall();
  shuffle(wall);

  // 王牌（8枚固定、山からの補充は一切しない）
  // 内訳：嶺上牌4枚（末尾側からpopして使う）＋ドラ表示牌1枚＋リーチドラ表示牌1枚＋予備2枚（先頭側4枚は触らない）
  // 補充しないため、山からの生きたツモは常に136-8-52=76回、海底牌は開局時から確定する
  const deadWall = wall.splice(0, 8);

  // 自分・CPU3人へ配牌（13枚ずつ）
  const myTiles13 = wall.splice(0, 13);
  const cpuRightTiles = wall.splice(0, 13);
  const cpuTopTiles = wall.splice(0, 13);
  const cpuLeftTiles = wall.splice(0, 13);

  // 山の絵の基準にする、配牌直後・自摸前の生きたツモ回数（＝76）
  const LIVE_WALL_TOTAL = wall.length;

  // 親（あなた）が最初の1枚をツモる
  const firstDraw = wall.splice(0, 1)[0];

  // 手牌は13枚を並び替え、ツモ牌だけ最後に離して表示
  const sortedHand = myTiles13.slice().sort((a, b) => sortKey(a) - sortKey(b));
  const myHand = [...sortedHand, firstDraw].map(t => [t.suit, t.num, tileClass(t.suit, t.num)]);

  // ==================== STEP3+4: ターン進行（ツモ→打牌）＋ 鳴き（ポン・チー・カン） ====================

  // 状態（手牌・捨て牌・鳴き牌はすべてここで管理し、変更のたびに描画し直す）
  const myHandTiles = [...sortedHand, firstDraw]; // {suit,num} の配列
  let lastDrawnTile = firstDraw; // 直前にツモった牌（並び替えても離して表示するため参照で管理）
  const lastDrawnCpu = { top:null, left:null, right:null }; // CPU各自の現在のツモ牌（カン後の嶺上牌も含めて明示的に管理）
  // 他家の捨て牌に対してロン可能な間だけ保持する状態（下段の「和了」ボタンの有効/無効に使う）
  let pendingRon = null; // { discarderSeat, result } | null
  // 鳴きプロンプト（他家の捨て牌への応答）が開いている間だけ保持する状態（下段の「スルー」ボタンに使う）
  let pendingCallContext = null; // { discarderSeat } | null
  // 他家の捨て牌に対してチー・ポン・カンが可能な間だけ保持する状態（下段のチー/ポン/カンボタンに使う）
  let pendingCallOptions = null; // { discarderSeat, tile, pon, kan, chiShapes } | null
  // チー/ポン/カンボタンを押した後、実際に使う手牌を自分でクリックして選んでいる間の状態
  let activeCallSelection = null; // { type, discarderSeat, tile, shapes, selected:[] } | null
  const hands = { bottom: myHandTiles, top: cpuTopTiles, left: cpuLeftTiles, right: cpuRightTiles };
  const discards = { top: [], left: [], right: [], bottom: [] };
  const melds = { top: [], left: [], right: [], bottom: [] };

  const discardElByName = {
    top: document.getElementById("discardTop"),
    left: document.getElementById("discardLeft"),
    right: document.getElementById("discardRight"),
    bottom: document.getElementById("discardBottom")
  };
  const meldElByName = {
    top: document.getElementById("meldsTop"),
    left: document.getElementById("meldsLeft"),
    right: document.getElementById("meldsRight"),
    bottom: document.getElementById("meldsBottom")
  };
  const handMineEl = document.getElementById("handMine");
  const cpuHandElByName = { top: document.getElementById("handTop"), left: document.getElementById("handLeft"), right: document.getElementById("handRight") };
  const backClassByName = { top: "tile-back", left: "tile-back rot", right: "tile-back rot" };
  // 相手の伏せ手牌（帯表示）専用。暗槓の伏せ牌(backClassByName)とは別扱いにする
  const cpuHandBackClassByName = { top: "tile-top seat-top", left: "tile-top rot seat-left", right: "tile-top rot seat-right" };
  const seatLabel = { right:"下家", top:"対面", left:"上家", bottom:"自家" };

  // 手番の順番（あなた→下家→対面→上家→あなた…）と、各自の上家（鳴き元がこの人ならチー可）
  const NEXT_SEAT = { bottom:"right", right:"top", top:"left", left:"bottom" };
  const KAMICHA = { bottom:"left", right:"bottom", top:"right", left:"top" };

  function updateWallCount(){
    document.getElementById("wallCountNum").textContent = wall.length;
    updateWallPiles();
  }

  // 山：自分の前だけ自摸山10枚（王牌8枚は別枠で、嶺上牌4枚だけがカンで減る）、
  // 対面・上家・下家はそれぞれ22枚。開門位置（自摸山の右端＝自分の親の第一自摸位置）から
  // 実際の卓の並びどおりに、自分→上家→対面→下家の順で生きたツモが進むごとに山が減っていく
  // （実際のwall.lengthから逆算する。専用カウンタは持たない）
  const WALL_PILE_ORDER = ["bottom", "left", "top", "right"];
  const WALL_PILE_SIZE = { bottom:10, left:22, top:22, right:22 };
  const WALL_PILE_EL_ID = { bottom:"wallBottomLive", left:"wallLeft", top:"wallTop", right:"wallRight" };
  // 各山のどちら側（DOM順の先頭 or 末尾）から減っていくか。
  // 自分の前は開門位置（王牌側＝DOM末尾側）から、上家は自分に近い側（下端＝DOM末尾側）から、
  // 対面は上家に近い側（左端＝DOM先頭側）から、下家は対面に近い側（上端＝DOM先頭側）から減り、
  // 下家の最後（DOM末尾）が王牌の左端に戻ってつながる
  const WALL_PILE_REVERSE = { bottom:true, left:true, top:false, right:false };

  function wallPileRemaining(pileName){
    const drawnTotal = LIVE_WALL_TOTAL - wall.length;
    let precedingSum = 0;
    for(const name of WALL_PILE_ORDER){
      const size = WALL_PILE_SIZE[name];
      if(name === pileName){
        const drawnFromThis = Math.max(0, Math.min(size, drawnTotal - precedingSum));
        return size - drawnFromThis;
      }
      precedingSum += size;
    }
    return 0;
  }

  // 山の見た目を更新：開門位置に近い側から、残り枚数ぶんだけ隠す
  // 表示牌1枚が「上段+下段」2枚分：上段だけ消費済みならhalf-drawn（少し暗く）、
  // 上段・下段とも消費済みならhidden-drawn（非表示）にする
  function applyStackVisual(tile, consumed){
    tile.classList.toggle("hidden-drawn", consumed >= 2);
    tile.classList.toggle("half-drawn", consumed === 1);
  }

  function updateWallPiles(){
    WALL_PILE_ORDER.forEach(name => {
      const el = document.getElementById(WALL_PILE_EL_ID[name]);
      const size = WALL_PILE_SIZE[name]; // 物理枚数（10 / 22）
      const displayCount = size / 2;     // 表示枚数（1枚が2枚分）
      const remaining = wallPileRemaining(name);
      const drawnFromThis = size - remaining;
      const reverse = WALL_PILE_REVERSE[name];
      Array.from(el.children).forEach((tile, domIdx) => {
        const depletionIdx = reverse ? (displayCount - 1 - domIdx) : domIdx;
        const consumed = Math.max(0, Math.min(2, drawnFromThis - depletionIdx * 2));
        applyStackVisual(tile, consumed);
      });
    });
  }

  // 嶺上牌（王牌の開門側、表示2枚＝物理4枚）：カンで王牌からツモるたびにdeadWall.lengthが
  // 8→4まで減るので、それに合わせて表示2枚を「上段消費で少し暗く→下段も消費で非表示」にする
  // （表ドラ・リーチドラの2枚は対象外＝常に表示のまま）
  function updateRinshanVisual(){
    const el = document.getElementById("wallDead");
    const rinshanUsed = 8 - deadWall.length; // 0〜4（物理枚数）
    Array.from(el.children).slice(0, 2).forEach((tile, idx) => {
      const consumed = Math.max(0, Math.min(2, rinshanUsed - idx * 2));
      applyStackVisual(tile, consumed);
    });
  }

  // 種類（風牌・三元牌・萬子・筒子・索子）のうち、手牌に多い順に左から並べる
  function suitPriorityMap(){
    const counts = { wind:0, dragon:0, man:0, pin:0, sou:0 };
    myHandTiles.forEach(t => counts[t.suit]++);
    const tiebreak = ["wind", "dragon", "man", "pin", "sou"];
    const ordered = tiebreak.slice().sort((a, b) => (counts[b] - counts[a]) || (tiebreak.indexOf(a) - tiebreak.indexOf(b)));
    const map = {};
    ordered.forEach((s, i) => { map[s] = i; });
    return map;
  }

  function renderMyHand(clickable){
    const priorityMap = suitPriorityMap();
    // ツモ牌は並び替えの対象に含めず、常に手牌全体の一番右に別枠で表示する
    const others = myHandTiles.filter(t => t !== lastDrawnTile);
    const sorted = others.slice().sort((a, b) => {
      const ka = priorityMap[a.suit] * 100 + a.num;
      const kb = priorityMap[b.suit] * 100 + b.num;
      return ka - kb;
    });

    handMineEl.innerHTML = "";

    // 鳴きで手牌が減っても常に卓の中央に来るよう、幅の確保は.hand-rowのCSS(min-width)に任せ、
    // ここでは実際の牌だけを並べる（枠の中央寄せはCSSのjustify-content:centerが行う）
    sorted.forEach(t => {
      const el = tileEl(t.suit, t.num, tileClass(t.suit, t.num), t.red);
      if(activeCallSelection){
        // チー/ポン/カンの選択中は、打牌ではなく「使う牌を選ぶ」クリックにする
        if(isCallSelectable(t)){
          el.classList.add("callable");
          el.addEventListener("click", () => onSelectCallTile(t));
        }
      } else if(clickable){
        el.classList.add("clickable");
        el.addEventListener("click", () => onDiscardMyTile(myHandTiles.indexOf(t)));
      }
      handMineEl.appendChild(el);
    });

    // ツモ枠は常に同じ幅を確保する（自摸っていない間は透明なプレースホルダーを置き、手牌全体の幅が変わってズレないようにする）
    if(lastDrawnTile){
      const el = tileEl(lastDrawnTile.suit, lastDrawnTile.num, tileClass(lastDrawnTile.suit, lastDrawnTile.num), lastDrawnTile.red);
      el.classList.add("drawn");
      if(clickable){
        el.classList.add("clickable");
        el.addEventListener("click", () => onDiscardMyTile(myHandTiles.indexOf(lastDrawnTile)));
      }
      handMineEl.appendChild(el);
    } else {
      const placeholder = document.createElement("div");
      placeholder.className = "tile drawn";
      placeholder.style.visibility = "hidden";
      handMineEl.appendChild(placeholder);
    }
  }

  // 対面・下家は回転により「自分から見て右側」が画面の左／先頭になるため、ツモ枠を先頭に置く
  const DRAWN_SLOT_FIRST = { top:true, right:true, left:false };

  function renderCpuHandBacks(name){
    const el = cpuHandElByName[name];
    el.innerHTML = "";
    const hasDrawn = !!lastDrawnCpu[name];
    const normalCount = hands[name].length - (hasDrawn ? 1 : 0); // ツモ牌を除いた「通常の手牌」の枚数

    function makeBack(hidden){
      const b = document.createElement("div");
      b.className = cpuHandBackClassByName[name];
      if(hidden) b.style.visibility = "hidden";
      return b;
    }

    const drawnEl = makeBack(!hasDrawn);
    drawnEl.classList.add("drawn");

    // 鳴きで手牌が減っても常に卓の中央に来るよう、幅(縦向きは高さ)の確保は
    // .hand-rowのCSS(min-width/min-height)に任せ、ここでは実際の牌だけを並べる
    if(DRAWN_SLOT_FIRST[name]){
      el.appendChild(drawnEl);
      for(let i = 0; i < normalCount; i++) el.appendChild(makeBack(false));
    } else {
      for(let i = 0; i < normalCount; i++) el.appendChild(makeBack(false));
      el.appendChild(drawnEl);
    }
  }

  // 捨て牌の並び順：各自から見て左から6枚→奥の段へ（第1捨て牌が一番手前=自分から遠い側）
  function discardGridPosition(seat, index){
    const groupIdx = Math.floor(index / 6); // 0=1段目(一番遠い)…3=4段目（4行×6列グリッドなので0〜3の4値、最大24枚まで対応）
    const posIdx = index % 6; // 0-5（その段の中で何番目か）
    switch(seat){
      case "bottom": return { row: groupIdx + 1, col: posIdx + 1 };
      case "top":    return { row: 4 - groupIdx, col: 6 - posIdx };
      case "left":   return { row: posIdx + 1,   col: 4 - groupIdx };
      case "right":  return { row: 6 - posIdx,   col: groupIdx + 1 };
    }
  }

  // 各自から見た捨て牌の向き。CSSのtransform:rotate()だけだと回転前のレイアウト箱の
  // ままグリッドに配置されてしまい（--tile-wと--tile-hの縦横比ぶんだけ枠からあふれて
  // 中央BOXと重なる不具合の原因だった）、鳴き牌と同じapplyMeldRotation()で
  // 箱の実寸自体を回転後の見た目に合わせて確定させる
  const DISCARD_ROTATION = { bottom:0, top:180, left:90, right:-90 };

  function renderDiscard(name){
    const el = discardElByName[name];
    el.innerHTML = "";
    discards[name].forEach((t, idx) => {
      const tileElx = tileEl(t.suit, t.num, tileClass(t.suit, t.num), t.red);
      applyMeldRotation(tileElx, DISCARD_ROTATION[name]);
      const pos = discardGridPosition(name, idx);
      tileElx.style.gridRow = pos.row;
      tileElx.style.gridColumn = pos.col;
      el.appendChild(tileElx);
    });
  }

  // 鳴いた牌が「誰の捨て牌か」に応じて、鳴き牌グループ内のどこに置くかを決める
  function meldCalledPosition(callerSeat, fromSeat){
    if(fromSeat === KAMICHA[callerSeat]) return "left";   // 上家から＝左端
    if(fromSeat === NEXT_SEAT[callerSeat]) return "right"; // 下家から＝右端
    return "middle"; // 対面から＝真ん中
  }

  const MELD_BASE_ROTATION = { bottom:0, top:180, left:90, right:-90 };
  // 各自の「読む向き」を画面の軸に対応させる（対面は左右反転、上家・下家は縦方向）
  const MELD_FLEX_DIRECTION = { bottom:"row", top:"row-reverse", left:"column", right:"column-reverse" };
  // 鳴き牌グループを卓の外側の辺に揃える（内側にはみ出さず、増えた厚みは外側にのみ配分される）
  const MELD_ALIGN_ITEMS = { top:"flex-start", bottom:"flex-end", left:"flex-start", right:"flex-end" };

  // 暗槓・大明槓（横幅を牌3枚分に抑えるレイアウト）で、積む側の1枚をどちら向きに
  // 積むかを決める：卓中央側（＝手牌から遠い側）に、幅を増やさず高さ方向にだけ突き出す。
  // このCSSプロパティ名をそのまま100%指定すると、積む牌の該当辺がスロットの反対辺に
  // ぴったり接する（＝隙間なく「上に載る」）
  const KAN_STACK_SIDE = { bottom:"bottom", top:"top", left:"left", right:"right" };

  // 90度・270度回転の牌は、外側の箱を見た目通りの寸法(Tier A: main-h×main-w)にして、
  // 中のSVGだけを回転させる（箱と見た目がズレて余分な隙間ができるのを防ぐ）。
  // scaleVarを渡すと、その名前のCSS変数（例:--meld-scale-top）ぶんだけ縮小した実寸にする
  // （鳴き面子の行(top/bottom)が卓幅を超える時にfitMeldRowScale()が使う）
  function applyMeldRotation(tileDiv, deg, scaleVar){
    const norm = ((deg % 360) + 360) % 360;
    const swapped = (norm === 90 || norm === 270);
    const scale = scaleVar ? "var(" + scaleVar + ")" : "1";
    tileDiv.style.width = "calc(" + (swapped ? "var(--tile-h)" : "var(--tile-w)") + " * " + scale + ")";
    tileDiv.style.height = "calc(" + (swapped ? "var(--tile-w)" : "var(--tile-h)") + " * " + scale + ")";
    const svg = tileDiv.querySelector("svg");
    if(svg){
      svg.style.position = "absolute";
      svg.style.left = "50%";
      svg.style.top = "50%";
      // 幅・高さは常に非回転基準(--tile-w×--tile-h)で固定し、向きはtransform:rotate()だけで
      // 与える。外側の箱(width/height)は90/270度でswapされるが、SVG自身のサイズをそれに
      // 追従させると（%指定だと親のswap後の寸法を基準にしてしまい）viewBoxとの縦横比が
      // ズレて「meet」が縮む基準辺を変えてしまい、絵のサイズが縦横で不揃いになるので注意。
      svg.style.width = "calc(var(--tile-w) * 0.88 * " + scale + ")";
      svg.style.height = "calc(var(--tile-h) * 0.88 * " + scale + ")";
      svg.style.transform = "translate(-50%, -50%) rotate(" + deg + "deg)";
    }
  }

  // 暗槓・大明槓共通：横一列3枚(rowEls)の指定位置(stackedIndex:0/1/2)の上に、
  // 回転済みの4枚目(stackedEl)を幅を増やさず積み重ねる。
  // 積む方向は常に卓中央側（KAN_STACK_SIDE）＝手牌から離れる向きにして、
  // 積んだ牌が手牌に重ならないようにする
  function buildKanGroup(name, flexDir, rowEls, stackedEl, stackedIndex){
    const axisIsX = (flexDir === "row" || flexDir === "row-reverse");
    return rowEls.map((rowEl, i) => {
      if(i !== stackedIndex) return rowEl;
      const wrap = document.createElement("div");
      wrap.style.position = "relative";
      wrap.style.flexShrink = "0";
      wrap.style.width = rowEl.style.width;
      wrap.style.height = rowEl.style.height;
      stackedEl.style.position = "absolute";
      stackedEl.style[KAN_STACK_SIDE[name]] = "100%";
      if(axisIsX){
        stackedEl.style.left = "50%";
        stackedEl.style.transform = "translateX(-50%)";
      } else {
        stackedEl.style.top = "50%";
        stackedEl.style.transform = "translateY(-50%)";
      }
      wrap.appendChild(rowEl);
      wrap.appendChild(stackedEl);
      return wrap;
    });
  }

  function renderMelds(name){
    const el = meldElByName[name];
    const baseRot = MELD_BASE_ROTATION[name];
    const flexDir = MELD_FLEX_DIRECTION[name];
    // 卓幅(--table-width)を超えたら、その行(4方向とも)だけ縮小する
    const scaleVar = "--meld-scale-" + name;
    el.style.flexDirection = flexDir;
    el.innerHTML = "";
    // カン（暗槓・大明槓・加槓）が1組でもあれば、積んだ4枚目が王牌側にはみ出さないよう
    // .meld-rowの厚みを牌の横幅ぶん増やす（CSSの.has-kan参照）。無ければ従来どおり
    const hasKan = melds[name].some(m => m.type === "ankan" || m.type === "kan");
    el.classList.toggle("has-kan", hasKan);
    // 古く鳴いた組ほど手牌に近く、新しく鳴いた組ほど手牌から遠い側になるよう並べる
    melds[name].slice().reverse().forEach(m => {
      const group = document.createElement("div");
      group.style.display = "flex";
      group.style.flexDirection = flexDir;
      group.style.alignItems = MELD_ALIGN_ITEMS[name];
      group.style.justifyContent = "center";
      group.style.gap = "3px"; // 鳴き牌3枚の間隔＝捨て牌の間隔と同じ

      if(m.type === "ankan"){
        // 暗槓：伏せ牌3枚を横一列に並べ、4枚目を横向き（90度回転）にして上に積む。
        // 積む1枚は大明槓と同じく席によらず常に表向き。赤牌があれば積む1枚に優先して選ぶ
        const rowBackCls = backClassByName[name] || "tile-back";
        const rowEls = m.handTiles.slice(0, 3).map(() => {
          const backEl = document.createElement("div");
          backEl.className = rowBackCls;
          applyMeldRotation(backEl, baseRot, scaleVar);
          return backEl;
        });
        const stackedTile = m.handTiles.find(t => t.red) || m.handTiles[3];
        const stackedEl = tileEl(stackedTile.suit, stackedTile.num, tileClass(stackedTile.suit, stackedTile.num), stackedTile.red);
        applyMeldRotation(stackedEl, baseRot - 90, scaleVar);
        buildKanGroup(name, flexDir, rowEls, stackedEl, 1).forEach(elx => group.appendChild(elx));
        el.appendChild(group);
        return;
      }

      if(m.type === "kan" && !m.addedTile){   // 大明槓のみ。加槓は下のpon経路へ
        // 大明槓：手牌にあった3枚を表向きで横一列に並べ、鳴かれた1枚を横向きにして上に積む。
        // 積む位置で誰から鳴いたかを示す（上家=左端／対面=中央／下家=右端、既存のpon/chiと同じ判定）
        const rowEls = m.handTiles.map(t => {
          const tEl = tileEl(t.suit, t.num, tileClass(t.suit, t.num), t.red);
          applyMeldRotation(tEl, baseRot, scaleVar);
          return tEl;
        });
        const stackedEl = tileEl(m.calledTile.suit, m.calledTile.num, tileClass(m.calledTile.suit, m.calledTile.num), m.calledTile.red);
        stackedEl.classList.add("meld-called");
        applyMeldRotation(stackedEl, baseRot - 90, scaleVar);
        const kanPosition = meldCalledPosition(name, m.calledFrom);
        const stackedIndex = kanPosition === "left" ? 0 : (kanPosition === "right" ? 2 : 1);
        buildKanGroup(name, flexDir, rowEls, stackedEl, stackedIndex).forEach(elx => group.appendChild(elx));
        el.appendChild(group);
        return;
      }

      const calledEl = tileEl(m.calledTile.suit, m.calledTile.num, tileClass(m.calledTile.suit, m.calledTile.num), m.calledTile.red);
      calledEl.classList.add("meld-called"); // 誰から鳴いたか分かるよう、その席の向きからさらに横向きにする
      // baseRot+90だと絵柄が上下逆になっていたため-90(=270度)にした（90と270はどちらも
      // 箱のswap判定(width/height入れ替え)は同じだが、中のSVGの見た目は180度違う）
      applyMeldRotation(calledEl, baseRot - 90, scaleVar);

      const handEls = m.handTiles.map(t => {
        const tEl = tileEl(t.suit, t.num, tileClass(t.suit, t.num), t.red);
        applyMeldRotation(tEl, baseRot, scaleVar);
        return tEl;
      });

      const position = meldCalledPosition(name, m.calledFrom);
      const calledIndex = position === "left" ? 0 : (position === "right" ? 2 : 1);
      let ordered;
      if(position === "left"){
        ordered = [calledEl, ...handEls];
      } else if(position === "right"){
        ordered = [...handEls, calledEl];
      } else {
        const mid = Math.floor(handEls.length / 2);
        ordered = [...handEls.slice(0, mid), calledEl, ...handEls.slice(mid)];
      }

      // 加カンの4枚目：ポンで晒した横向き牌(calledEl)の上に、暗槓・大明槓と同じ
      // buildKanGroup()（指定スロットの上に絶対配置で積む仕組み）でもう1枚横向きに重ねる。
      // これでcalledEl自体は隠れず、下段3枚（表向き2枚＋横向き1枚）がそのまま見え、
      // その横向き牌の上にaddedElが重なる形になる
      if(m.addedTile){
        const addedEl = tileEl(m.addedTile.suit, m.addedTile.num, tileClass(m.addedTile.suit, m.addedTile.num), m.addedTile.red);
        addedEl.classList.add("meld-called");
        applyMeldRotation(addedEl, baseRot - 90, scaleVar);
        ordered = buildKanGroup(name, flexDir, ordered, addedEl, calledIndex);
      }

      ordered.forEach(elx => group.appendChild(elx));
      el.appendChild(group);
    });
    fitMeldRowScale(name);
  }

  // 鳴き面子の行(4方向とも)が卓の一辺(--table-width。卓は正方形なので上家・下家の
  // 縦方向の長さもこれを基準にする)を超える時だけ、その行の牌を
  // --meld-scale-top/bottom/left/rightで縮小して収める（等倍で収まる時は1のまま）。
  // top/bottomは横に伸びるのでscrollWidthを、left/rightは縦に伸びるのでscrollHeightを見る。
  // 縮小率は行の牌だけに効く相対値(var()経由)なので、resize時に--tile-hが変わっても
  // fitTileSize側でこの関数を呼び直せば追従する
  function fitMeldRowScale(name){
    const scaleVar = "--meld-scale-" + name;
    document.documentElement.style.setProperty(scaleVar, "1");
    const row = meldElByName[name];
    const maxLen = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--table-width"));
    if(!maxLen) return; // 初回fitTileSize()より前はまだ--table-width未設定のため何もしない
    const isHorizontal = (name === "top" || name === "bottom");
    const natural = isHorizontal ? row.scrollWidth : row.scrollHeight;
    const scale = natural > maxLen ? (maxLen / natural) : 1;
    document.documentElement.style.setProperty(scaleVar, String(scale));
  }

  // 案内表示欄は廃止した。呼び出し箇所は多いため関数自体は残し、何もしないだけにしてある。
  function setTurnIndicator(text){}

  // --- 鳴き判定用のヘルパー ---
  function countMatching(hand, tile){
    return hand.filter(t => t.suit === tile.suit && t.num === tile.num).length;
  }
  function canPon(hand, tile){ return countMatching(hand, tile) >= 2; }
  function canKan(hand, tile){ return countMatching(hand, tile) >= 3; }
  // 暗槓：鳴きを介さず、自分の手牌だけで4枚揃っている牌の種類を全て返す
  // （2種類以上同時に4枚揃うこともあるため、最初の1つだけを返さないこと）
  function findAllAnkanTiles(hand){
    const counts = countTiles(hand);
    const result = [];
    for(const k in counts){ if(counts[k] >= 4) result.push(keyToTile(k)); }
    return result;
  }
  // CPU用：候補が複数あっても選ばせる仕組みが無いため、最初の1種類だけを使う
  function findAnkanTile(hand){
    return findAllAnkanTiles(hand)[0] || null;
  }
  // 王牌の先頭4枚（ドラ表示・リーチドラ表示・予備2枚）は嶺上牌に使わない。
  // 補充が無いため嶺上牌は最大4枚＝カンは通算4回まで
  function rinshanAvailable(){ return deadWall.length > 4; }
  function findChiShapes(hand, tile){
    if(tile.suit !== "man" && tile.suit !== "pin" && tile.suit !== "sou") return [];
    const has = n => hand.some(t => t.suit === tile.suit && t.num === n);
    const shapes = [];
    if(has(tile.num - 2) && has(tile.num - 1)) shapes.push([tile.num - 2, tile.num - 1]);
    if(has(tile.num - 1) && has(tile.num + 1)) shapes.push([tile.num - 1, tile.num + 1]);
    if(has(tile.num + 1) && has(tile.num + 2)) shapes.push([tile.num + 1, tile.num + 2]);
    return shapes;
  }
  // --- 自分の打牌 ---
  function onDiscardMyTile(idx){
    const discarded = myHandTiles.splice(idx, 1)[0];
    discards.bottom.push(discarded);
    lastDrawnTile = null;
    renderMyHand(false);
    renderDiscard("bottom");
    setTurnIndicator("");
    updateActionButtons();
    handleDiscard("bottom", discarded);
  }

  // --- 打牌のあと：鳴きが入るか判定してから次に進む ---
  function handleDiscard(discarderSeat, tile){
    if(gameEnded) return;

    if(discarderSeat !== "bottom"){
      const ronResult = attemptWin("bottom", tile, false);
      const pon = canPon(myHandTiles, tile);
      const kan = canKan(myHandTiles, tile) && rinshanAvailable();
      const chi = (KAMICHA.bottom === discarderSeat) ? findChiShapes(myHandTiles, tile) : [];
      pendingRon = ronResult ? { discarderSeat, result: ronResult } : null;
      if(ronResult || pon || kan || chi.length > 0){
        pendingCallOptions = { discarderSeat, tile, pon, kan, chiShapes: chi };
        pendingCallContext = { discarderSeat };
        setTurnIndicator("和了・鳴きますか？（" + seatLabel[discarderSeat] + "の捨て牌）");
        updateActionButtons(); // 和了・チー・ポン・カン・スルーの各ボタンをまとめて更新する
        return;
      }
    }

    // CPUのロン判定（可能なら必ずロンする簡易AI）
    const ronCandidates = ["top", "left", "right"].filter(s => s !== discarderSeat);
    for(const s of ronCandidates){
      const result = attemptWin(s, tile, false);
      if(result){
        discards[discarderSeat].pop();
        renderDiscard(discarderSeat);
        finalizeWin(s, discarderSeat, result);
        return;
      }
    }

    const cpuCall = maybeCpuCalls(discarderSeat, tile);
    if(cpuCall){
      executeCall(cpuCall.seat, discarderSeat, tile, cpuCall.type);
      return;
    }
    advanceTurnAfterDiscard(discarderSeat);
  }

  // CPUのポン・カン簡易AI（チーはプレイヤーのみ対応）
  function maybeCpuCalls(discarderSeat, tile){
    const seats = ["right", "top", "left"].filter(s => s !== discarderSeat);
    for(const s of seats){
      if(canKan(hands[s], tile) && rinshanAvailable() && Math.random() < 0.5) return { seat:s, type:"kan" };
    }
    for(const s of seats){
      if(canPon(hands[s], tile) && Math.random() < 0.45) return { seat:s, type:"pon" };
    }
    return null;
  }

  function makeCallButton(label, onClick){
    const b = document.createElement("button");
    b.className = "action-btn";
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  // 同じ牌でも赤5とノーマルは結果が変わるため、「代表牌」として区別して1つずつ残す
  // （ノーマルが複数あっても選ぶ結果は同じなので1枚に畳んでよい）
  function dedupeByRed(tiles){
    const result = [];
    const red = tiles.find(t => t.red);
    const normal = tiles.find(t => !t.red);
    if(red) result.push(red);
    if(normal) result.push(normal);
    return result;
  }

  // ポンで実際に使う手牌2枚の「結果が異なる組み合わせ」を全て挙げる。
  // 通常は1通り（同じ牌2枚に区別が無いため）。手牌に赤5＋ノーマル5が両方あるときだけ
  // 「赤5を使う／使わない」で結果が変わるため2通りになる（このときだけ手牌クリックで選ばせる）。
  function ponComboOptions(hand, tile){
    const matching = hand.filter(t => t.suit === tile.suit && t.num === tile.num);
    const reds = matching.filter(t => t.red);
    const normals = matching.filter(t => !t.red);
    const combos = [];
    if(normals.length >= 2) combos.push([normals[0], normals[1]]);
    if(reds.length >= 1 && normals.length >= 1) combos.push([reds[0], normals[0]]);
    return combos;
  }

  // チーで実際に使う手牌2枚の組み合わせを全て挙げる。形（shapes）が複数あれば形の数だけ、
  // さらに各枠に赤5とノーマル5が両方あればその枠でも枝分かれする
  function chiComboOptions(hand, tile, shapes){
    const combos = [];
    shapes.forEach(shape => {
      const optsA = dedupeByRed(hand.filter(t => t.suit === tile.suit && t.num === shape[0]));
      const optsB = dedupeByRed(hand.filter(t => t.suit === tile.suit && t.num === shape[1]));
      optsA.forEach(a => optsB.forEach(b => combos.push([a, b])));
    });
    return combos;
  }

  // カンは手牌に残る同じ牌3枚を必ず全部使うため、常に1通り（選ぶ余地が無い）
  function kanComboOptions(hand, tile){
    const matching = hand.filter(t => t.suit === tile.suit && t.num === tile.num);
    return matching.length >= 3 ? [matching.slice(0, 3)] : [];
  }

  function callComboOptions(type, tile, shapes){
    if(type === "kan") return kanComboOptions(myHandTiles, tile);
    if(type === "pon") return ponComboOptions(myHandTiles, tile);
    return chiComboOptions(myHandTiles, tile, shapes);
  }

  // --- チー・ポン・カンは下段ボタンで即成立、組み合わせが複数ある時だけ手牌クリックで選ぶ ---
  // （赤5が絡んでポン/チーの結果が変わる場合など。カンは常に1通りなので必ず即成立する）
  function startCallSelection(type){
    if(!pendingCallOptions) return;
    const opts = pendingCallOptions;
    const combos = callComboOptions(type, opts.tile, opts.chiShapes);
    if(combos.length <= 1){
      const chosen = combos[0] || defaultChosenTiles(myHandTiles, opts.tile, type === "kan" ? 3 : 2);
      pendingCallOptions = null;
      pendingCallContext = null;
      pendingRon = null;
      if(type === "chi") executeChi(chosen, opts.tile);
      else executeCall("bottom", opts.discarderSeat, opts.tile, type, chosen);
      return;
    }
    activeCallSelection = { type, discarderSeat: opts.discarderSeat, tile: opts.tile, shapes: opts.chiShapes, selected: [] };
    setTurnIndicator("使う牌を選んでください（やめる場合はスルー）");
    updateActionButtons();
    renderMyHand(true);
  }

  // 今クリック可能な（まだ選んでいない）牌かどうかを判定する
  function isCallSelectable(t){
    const sel = activeCallSelection;
    if(!sel || sel.selected.includes(t)) return false;
    if(sel.type === "pon" || sel.type === "kan"){
      return t.suit === sel.tile.suit && t.num === sel.tile.num;
    }
    // チー：1枚目はどの形の構成牌でも良く、2枚目は1枚目と矛盾しない形の相方だけに絞る
    const candidateShapes = sel.selected.length === 0
      ? sel.shapes
      : sel.shapes.filter(s => s.includes(sel.selected[0].num));
    const neededNums = new Set();
    candidateShapes.forEach(s => s.forEach(n => { if(!sel.selected.some(st => st.num === n)) neededNums.add(n); }));
    return t.suit === sel.tile.suit && neededNums.has(t.num);
  }

  function onSelectCallTile(t){
    const sel = activeCallSelection;
    if(!sel || !isCallSelectable(t)) return;
    sel.selected.push(t);
    const needed = sel.type === "kan" ? 3 : 2;
    if(sel.selected.length >= needed){
      confirmCallSelection();
    } else {
      renderMyHand(true);
    }
  }

  function confirmCallSelection(){
    const sel = activeCallSelection;
    if(!sel) return;
    activeCallSelection = null;
    pendingCallOptions = null;
    pendingCallContext = null;
    pendingRon = null;
    if(sel.type === "chi") executeChi(sel.selected, sel.tile);
    else executeCall("bottom", sel.discarderSeat, sel.tile, sel.type, sel.selected);
  }

  // 鳴き関連の状態（ロン待ち・スルー待ち・チー/ポン/カンの選択中を含む）を
  // 必ずクリアしてから閉じる唯一の窓口
  function hideCallPrompt(){
    document.getElementById("callPrompt").style.display = "none";
    pendingRon = null;
    pendingCallContext = null;
    pendingCallOptions = null;
    const hadSelection = !!activeCallSelection;
    activeCallSelection = null;
    updateActionButtons();
    if(hadSelection) renderMyHand(true);
  }

  // 牌の選択肢を出さない場合（CPU、または不整合時のフォールバック）に使う、
  // 末尾（新しく引いた牌に近い側）から必要枚数を機械的に選ぶ従来ロジック
  function defaultChosenTiles(hand, tile, needed){
    const handTiles = [];
    for(let i = hand.length - 1; i >= 0 && handTiles.length < needed; i--){
      if(hand[i].suit === tile.suit && hand[i].num === tile.num) handTiles.push(hand[i]);
    }
    return handTiles;
  }
  // --- ポン・カンの実行（プレイヤー／CPU共通） ---
  // chosenTiles: プレイヤーが牌の画像で選んだ実際の手牌（省略時はCPU用に自動選択する）
  function executeCall(callerSeat, discarderSeat, tile, type, chosenTiles){
    discards[discarderSeat].pop();
    renderDiscard(discarderSeat);

    const hand = hands[callerSeat];
    const needed = (type === "kan") ? 3 : 2;
    const handTiles = chosenTiles ? chosenTiles.slice() : defaultChosenTiles(hand, tile, needed);
    handTiles.forEach(t => {
      const idx = hand.indexOf(t);
      if(idx >= 0) hand.splice(idx, 1);
    });
    melds[callerSeat].push({ type, handTiles, calledTile: tile, calledFrom: discarderSeat });
    renderMelds(callerSeat);

    // カンをしたら王牌から嶺上牌を1枚ツモる（山からの補充はしない）
    if(type === "kan"){
      const rinshan = deadWall.pop();
      updateRinshanVisual();
      hand.push(rinshan);
      if(callerSeat === "bottom") lastDrawnTile = rinshan;
      else lastDrawnCpu[callerSeat] = rinshan;
    }

    if(callerSeat === "bottom"){
      if(type !== "kan") lastDrawnTile = null;
      renderMyHand(true);
      setTurnIndicator((type === "pon" ? "ポン" : "カン") + "しました。捨てる牌をタップしてください");
      updateActionButtons();
    } else {
      renderCpuHandBacks(callerSeat);
      setTurnIndicator(seatLabel[callerSeat] + "が" + (type === "pon" ? "ポン" : "カン") + "しました");
      if(type === "kan"){
        const rinshanWin = attemptWin(callerSeat, null, true);
        if(rinshanWin){ finalizeWin(callerSeat, callerSeat, rinshanWin); return; }
      }
      setTimeout(() => cpuDiscardOnly(callerSeat), 600);
    }
    fitTileSize();
  }

  // --- チーの実行(プレイヤーのみ) ---
  // comboTiles: プレイヤーが牌の画像で選んだ実際の手牌2枚（[小さい方, 大きい方]）
  function executeChi(comboTiles, tile){
    discards.left.pop();
    renderDiscard("left");
    const handTiles = [];
    comboTiles.forEach(t => {
      const idx = myHandTiles.indexOf(t);
      if(idx >= 0) handTiles.push(myHandTiles.splice(idx, 1)[0]);
    });
    melds.bottom.push({ type: "chi", handTiles, calledTile: tile, calledFrom: "left" });
    renderMelds("bottom");
    lastDrawnTile = null;
    renderMyHand(true);
    setTurnIndicator("チーしました。捨てる牌をタップしてください");
    updateActionButtons();
  }

  // 鳴いた後、その人はツモらずすぐ打牌する
  function cpuDiscardOnly(seat){
    const hand = hands[seat];
    const idx = Math.floor(Math.random() * hand.length);
    const discarded = hand.splice(idx, 1)[0];
    discards[seat].push(discarded);
    lastDrawnCpu[seat] = null;
    renderCpuHandBacks(seat);
    renderDiscard(seat);
    handleDiscard(seat, discarded);
  }

  // 鳴きが無ければ、通常通り次の人に手番が移る
  function advanceTurnAfterDiscard(discarderSeat){
    if(gameEnded) return;
    const next = NEXT_SEAT[discarderSeat];
    if(next === "bottom"){
      playerDraw();
    } else {
      setTimeout(() => cpuDrawAndDiscard(next), 550);
    }
  }

  function cpuDrawAndDiscard(seat){
    if(gameEnded) return;
    if(wall.length === 0){
      handleRyuukyoku();
      return;
    }
    setTurnIndicator(seatLabel[seat] + "の番です");
    const drawn = wall.shift();
    hands[seat].push(drawn);
    lastDrawnCpu[seat] = drawn;
    updateWallCount();
    renderCpuHandBacks(seat);

    const tsumoResult = attemptWin(seat, null, true);
    if(tsumoResult){
      finalizeWin(seat, seat, tsumoResult);
      return;
    }

    // CPUの暗槓（簡易AI：4枚揃っていれば必ず暗槓する。rinshanAvailable()が通算カン4回の上限を管理する）
    const ankanTile = findAnkanTile(hands[seat]);
    if(ankanTile && rinshanAvailable()){
      executeCpuAnkan(seat, ankanTile);
      return;
    }

    setTimeout(() => cpuChooseAndDiscard(seat), 500);
  }

  function cpuChooseAndDiscard(seat){
    if(gameEnded) return;
    const idx = Math.floor(Math.random() * hands[seat].length);
    const discarded = hands[seat].splice(idx, 1)[0];
    discards[seat].push(discarded);
    lastDrawnCpu[seat] = null;
    renderCpuHandBacks(seat);
    renderDiscard(seat);
    handleDiscard(seat, discarded);
  }

  function executeCpuAnkan(seat, tile){
    const hand = hands[seat];
    const removed = [];
    for(let i = hand.length - 1; i >= 0 && removed.length < 4; i--){
      if(hand[i].suit === tile.suit && hand[i].num === tile.num){
        removed.push(hand.splice(i, 1)[0]);
      }
    }
    melds[seat].push({ type:"ankan", handTiles: removed });
    renderMelds(seat);

    // 嶺上牌をツモる（山からの補充はしない）
    const rinshan = deadWall.pop();
    updateRinshanVisual();
    hand.push(rinshan);
    lastDrawnCpu[seat] = rinshan;
    renderCpuHandBacks(seat);
    setTurnIndicator(seatLabel[seat] + "が暗槓しました");

    const rinshanWin = attemptWin(seat, null, true);
    if(rinshanWin){
      finalizeWin(seat, seat, rinshanWin);
      return;
    }

    setTimeout(() => cpuChooseAndDiscard(seat), 500);
    fitTileSize();
  }

  function playerDraw(){
    if(gameEnded) return;
    if(wall.length === 0){
      handleRyuukyoku();
      return;
    }
    const drawn = wall.shift();
    myHandTiles.push(drawn);
    lastDrawnTile = drawn;
    updateWallCount();
    setTurnIndicator("あなたの番です（牌をタップして捨ててください）");
    renderMyHand(true);
    updateActionButtons();
    if(!checkKakanOpportunity(drawn)) checkAnkanOpportunity();
  }

  // --- 加カン（ポンした牌と同じ牌を自分でツモった時） ---
  // プロンプトを表示できたら true、できなければ false を返す（呼び出し側で暗槓チェックへ続けるかの判定に使う）
  function checkKakanOpportunity(drawnTile){
    const meldIdx = melds.bottom.findIndex(m => m.type === "pon" && m.calledTile.suit === drawnTile.suit && m.calledTile.num === drawnTile.num);
    if(meldIdx < 0 || !rinshanAvailable()) return false;
    const el = document.getElementById("callPrompt");
    el.innerHTML = "";
    el.style.display = "flex";
    el.appendChild(makeCallButton("カン", () => { hideCallPrompt(); executeKakan(meldIdx, drawnTile); }));
    el.appendChild(makeCallButton("この牌を捨てる", () => { hideCallPrompt(); onDiscardMyTile(myHandTiles.indexOf(drawnTile)); }));
    el.appendChild(makeCallButton("手牌に保留", () => { hideCallPrompt(); }));
    setTurnIndicator("同じ牌をツモりました。加カンしますか？");
    return true;
  }

  // --- 暗槓（鳴きを介さず、自分の手牌だけで同じ牌が4枚揃った時） ---
  function checkAnkanOpportunity(){
    const candidates = findAllAnkanTiles(myHandTiles);
    if(candidates.length === 0 || !rinshanAvailable()) return false;
    const el = document.getElementById("callPrompt");
    el.innerHTML = "";
    el.style.display = "flex";
    // 候補が2種類以上ある時は、どれを暗槓するかボタンで選ばせる（1種類なら従来通り1つだけ出る）
    candidates.forEach(tile => {
      const label = "暗槓（" + tileLabel(tile) + "）";
      el.appendChild(makeCallButton(label, () => { hideCallPrompt(); executeAnkan(tile); }));
    });
    el.appendChild(makeCallButton("手牌に保留", () => { hideCallPrompt(); }));
    setTurnIndicator(candidates.length > 1 ? "暗槓できる牌が複数あります。どちらを暗槓しますか？" : "同じ牌が4枚揃いました。暗槓しますか？");
    return true;
  }

  function executeAnkan(tile){
    const removed = [];
    for(let i = myHandTiles.length - 1; i >= 0 && removed.length < 4; i--){
      if(myHandTiles[i].suit === tile.suit && myHandTiles[i].num === tile.num){
        removed.push(myHandTiles.splice(i, 1)[0]);
      }
    }
    melds.bottom.push({ type:"ankan", handTiles: removed });
    renderMelds("bottom");

    // 嶺上牌をツモる（山からの補充はしない）
    const rinshan = deadWall.pop();
    updateRinshanVisual();
    myHandTiles.push(rinshan);
    lastDrawnTile = rinshan;

    renderMyHand(true);
    setTurnIndicator("暗槓しました。捨てる牌をタップしてください");
    updateActionButtons();
    fitTileSize();
  }

  function executeKakan(meldIdx, drawnTile){
    const meld = melds.bottom[meldIdx];
    const idx = myHandTiles.indexOf(drawnTile);
    if(idx >= 0) myHandTiles.splice(idx, 1);
    meld.type = "kan";
    meld.addedTile = drawnTile;
    renderMelds("bottom");

    // 嶺上牌をツモる（山からの補充はしない）
    const rinshan = deadWall.pop();
    updateRinshanVisual();
    myHandTiles.push(rinshan);
    lastDrawnTile = rinshan;

    renderMyHand(true);
    setTurnIndicator("加カンしました。捨てる牌をタップしてください");
    updateActionButtons();
    fitTileSize();
  }

  // ==================== STEP5: 和了判定・役・点数計算・流局処理 ====================
  // ※簡易実装です。リーチ・平和の待ちの形・ドラ以外の詳細な符計算・半荘の進行（親流れ等）は省略しています。

  let gameEnded = false;
  // 供託（リーチ棒）の本数。局をまたいで場に残り続け、その局でリーチして和了した人だけが総取りする
  // （リーチせずに和了しても供託には触れない。流局してもそのまま場に残る）
  let riichiSticks = 0;
  // 各自が今の局でリーチを宣言しているか。局の開始時に全員falseへリセットする
  // （リーチ宣言そのものは第2段階で実装し、宣言時にtrueにしてriichiSticksを1増やす）
  let riichiDeclared = { bottom:false, top:false, left:false, right:false };
  const scores = { bottom: 35000, top: 35000, left: 35000, right: 35000 };
  // ネームプレート（方角+名前+点数）は中央情報ボックスの中、各家の方角位置に置かれている
  const scoreElByName = {
    bottom: document.getElementById("scoreBottom"),
    top: document.getElementById("scoreTop"),
    left: document.getElementById("scoreLeft"),
    right: document.getElementById("scoreRight")
  };
  const DEALER_SEAT = "bottom"; // 今回は東1局のみのため、あなたが常に親
  const ROUND_WIND = 1; // 東場
  const SEAT_WIND = { bottom: 1, right: 2, top: 3, left: 4 }; // 東南西北

  function renderScores(){
    Object.keys(scores).forEach(s => { scoreElByName[s].textContent = scores[s]; });
    stabilizeCenterInfoCells();
  }

  // 上家・下家・対面のネームプレートはtransform:rotate()で向きを変えているだけなので、
  // セル自体のoffsetWidth/Heightは回転前（横書き）のままになる。90度回転する上家・下家は
  // 実測した幅と高さを入れ替えてセルに固定で入れ、回転後の見た目どおりの領域を確保する
  // （こうしておかないと.center-infoのグリッド列幅がずれてレイアウトが崩れる）。
  function stabilizeCenterInfoCells(){
    [["top", false], ["bottom", false], ["left", true], ["right", true]].forEach(([pos, swapped]) => {
      const cell = document.querySelector(".center-info > .ring-" + pos);
      const plate = cell.querySelector(".nameplate");
      cell.style.width = "";
      cell.style.height = "";
      const w = plate.offsetWidth, h = plate.offsetHeight;
      cell.style.width = (swapped ? h : w) + "px";
      cell.style.height = (swapped ? w : h) + "px";
    });
  }

  function updateKyotakuDisplay(){
    document.getElementById("kyotakuCount").textContent = "供託 " + riichiSticks + "本";
  }

  function tileKey(t){ return t.suit + "_" + t.num; }
  function keyToTile(k){
    const idx = k.lastIndexOf("_");
    return { suit: k.slice(0, idx), num: parseInt(k.slice(idx + 1)) };
  }
  function countTiles(tiles){
    const counts = {};
    tiles.forEach(t => { const k = tileKey(t); counts[k] = (counts[k] || 0) + 1; });
    return counts;
  }

  // 手牌（面子）を三面子/順子+刻子に分解できるか（1つの分解例を返す）
  function decomposeMelds(counts, sets, preferSequence){
    // 常に「色→数字」の順で、残っている一番小さい牌から処理する
    // （順番がバラバラだと、既にある順子の途中の牌を先に拾ってしまい、正しい組み合わせを見落とすため）
    const sortedKeys = Object.keys(counts).sort((a, b) => {
      const ta = keyToTile(a), tb = keyToTile(b);
      if(ta.suit !== tb.suit) return ta.suit < tb.suit ? -1 : 1;
      return ta.num - tb.num;
    });
    let key = null;
    for(const k of sortedKeys){ if(counts[k] > 0){ key = k; break; } }
    if(!key) return true;
    const t = keyToTile(key);

    const tryTriplet = () => {
      if(counts[key] < 3) return false;
      counts[key] -= 3;
      sets.push({ type:"triplet", tiles:[t, t, t], open:false });
      if(decomposeMelds(counts, sets, preferSequence)) return true;
      sets.pop();
      counts[key] += 3;
      return false;
    };
    const trySequence = () => {
      if(!((t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num <= 7)) return false;
      const k2 = t.suit + "_" + (t.num + 1), k3 = t.suit + "_" + (t.num + 2);
      if(!((counts[k2] || 0) > 0 && (counts[k3] || 0) > 0)) return false;
      counts[key]--; counts[k2]--; counts[k3]--;
      sets.push({ type:"sequence", tiles:[t, keyToTile(k2), keyToTile(k3)], open:false });
      if(decomposeMelds(counts, sets, preferSequence)) return true;
      sets.pop();
      counts[key]++; counts[k2]++; counts[k3]++;
      return false;
    };

    if(preferSequence){
      if(trySequence()) return true;
      if(tryTriplet()) return true;
    } else {
      if(tryTriplet()) return true;
      if(trySequence()) return true;
    }
    return false;
  }

  function findDecomposition(concealedTiles, preferSequence){
    if(concealedTiles.length % 3 !== 2) return null;
    const counts = countTiles(concealedTiles);
    for(const k in counts){
      if(counts[k] >= 2){
        counts[k] -= 2;
        const sets = [];
        if(decomposeMelds(counts, sets, preferSequence)){
          return { pairKey: k, sets };
        }
        counts[k] += 2;
      }
    }
