    return null;
  }

  function meldsToSets(seat){
    return melds[seat].map(m => {
      if(m.type === "ankan") return { type:"kan", tiles:[...m.handTiles], open:false };
      const type = m.type === "chi" ? "sequence" : (m.type === "kan" ? "kan" : "triplet");
      const tiles = [...m.handTiles, m.calledTile]; // スプレッドでコピー済み。元のm.handTiles/m.calledTileは書き換えない
      if(m.addedTile) tiles.push(m.addedTile);
      // チーは手牌2枚＋鳴いた牌の順で並んでいるため、鳴いた牌が真ん中や下端の数字だと
      // tiles[0]が「その順子の一番小さい牌」にならないことがある。三色同順など
      // s.tiles[0]を順子の起点として使う役判定が軒並み誤判定するため、必ず数字順に揃える
      // （renderMelds()は別経路でmelds[name]を直接参照するため、画面表示には影響しない）
      if(type === "sequence") tiles.sort((a, b) => a.num - b.num);
      return { type, tiles, open:true };
    });
  }

  // 役の判定（簡易版）
  // 和了牌が「両面待ち」で入ったかどうかを判定する（平和の条件のひとつ）
  // 嵌張（例：4・6待ちの5）、辺張（1・2待ちの3、8・9待ちの7）、単騎（雀頭待ち）は両面ではない
  function isRyanmenWait(decomp, winTile, threadSets){
    if(!winTile) return false;
    if(threadSets){
      // 組合龍の筋は順子として扱うため、筋の一部を埋めた場合は常に両面待ち扱いにする
      for(const s of threadSets){
        if(s.tiles.some(t => t.suit === winTile.suit && t.num === winTile.num)) return true;
      }
    }
    if(!decomp) return false;
    for(const s of decomp.sets){
      if(s.type !== "sequence") continue;
      if(s.tiles[0].suit !== winTile.suit) continue;
      const nums = s.tiles.map(t => t.num);
      const idx = nums.indexOf(winTile.num);
      if(idx === -1) continue;
      const a = nums[0];
      if(idx === 1) continue; // 真ん中＝嵌張なのでこの組み合わせは両面にならない
      if(idx === 0 && a + 2 !== 9) return true;  // 例外：8・9待ちの7は辺張
      if(idx === 2 && a !== 1) return true;      // 例外：1・2待ちの3は辺張
    }
    return false;
  }

  // 推不倒（トイプータオ）：上下逆さまにしても模様が同じに見える牌だけで作る役
  // 白（三元牌）、筒子1234589、索子245689 の14種類のみ使用
  const TOIBUDAO_KEYS = new Set([
    "dragon_1",
    "pin_1", "pin_2", "pin_3", "pin_4", "pin_5", "pin_8", "pin_9",
    "sou_2", "sou_4", "sou_5", "sou_6", "sou_8", "sou_9"
  ]);
  function isToibudaoTile(t){ return TOIBUDAO_KEYS.has(tileKey(t)); }

  // 小于五（ショウユウウー）：1〜4の数牌だけで作る役
  // 緑一色：索子2・3・4・6・8と發だけで作る役
  function isGreenTile(t){
    if(t.suit === "dragon" && t.num === 2) return true;
    if(t.suit === "sou" && [2, 3, 4, 6, 8].includes(t.num)) return true;
    return false;
  }

  // 紅孔雀：索子1・5・7・9と中の5種類だけで作る役（通常形・七対子どちらも可）
  const HONG_KONGQUE_KEYS = new Set(["sou_1", "sou_5", "sou_7", "sou_9", "dragon_3"]);
  function isHongKongqueTile(t){ return HONG_KONGQUE_KEYS.has(tileKey(t)); }

  // 花鳥風月雪：筒子5・筒子1・索子1・風牌（任意）・白の5種類だけで作る役（七対子も可）
  function isKachoFugetsuYukiTile(t){
    if(t.suit === "pin" && (t.num === 5 || t.num === 1)) return true;
    if(t.suit === "sou" && t.num === 1) return true;
    if(t.suit === "wind") return true;
    if(t.suit === "dragon" && t.num === 1) return true;
    return false;
  }

  // 百万石：萬子の数字の合計が100以上（役満）
  function manNumberSum(tiles){
    return tiles.filter(t => t.suit === "man").reduce((sum, t) => sum + t.num, 0);
  }

  function isXiaoYuWuTile(t){
    return (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num >= 1 && t.num <= 4;
  }

  // 全小（チェンショウ）：1〜3の数牌だけで作る役
  function isQuanXiaoTile(t){
    return (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num >= 1 && t.num <= 3;
  }

  // 大于五（ダーユウウー）：6〜9の数牌だけで作る役
  function isDaYuWuTile(t){
    return (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num >= 6 && t.num <= 9;
  }

  // 全大（チェンダー）：7〜9の数牌だけで作る役
  function isQuanDaTile(t){
    return (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num >= 7 && t.num <= 9;
  }

  // 全中（チェンチュン）：4〜6の数牌だけで作る役
  function isQuanZhongTile(t){
    return (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num >= 4 && t.num <= 6;
  }

  // 組合龍（ツーハーロン、三色筋一気通貫）：
  // 「1・4・7」「2・5・8」「3・6・9」の3つの筋を、萬子・筒子・索子それぞれ1色ずつに割り当てて使う。
  // 筋は順子として扱うため平和にもなり得るが、必ず面前で作る必要があり（チー不可）、
  // 鳴けるのは残りの1面子部分だけ。
  function permuteIndices(arr){
    if(arr.length <= 1) return [arr];
    const result = [];
    arr.forEach((v, i) => {
      const rest = [...arr.slice(0, i), ...arr.slice(i + 1)];
      permuteIndices(rest).forEach(p => result.push([v, ...p]));
    });
    return result;
  }

  function findZuheLongDecomposition(seat, concealed){
    if(melds[seat].length > 1) return null; // 鳴けるのは残り1面子分だけ
    const threadDefs = [[1, 4, 7], [2, 5, 8], [3, 6, 9]];
    const suits = ["man", "pin", "sou"];
    for(const perm of permuteIndices([0, 1, 2])){
      const counts = countTiles(concealed);
      let ok = true;
      for(let i = 0; i < 3 && ok; i++){
        const suit = suits[i];
        for(const n of threadDefs[perm[i]]){
          const k = suit + "_" + n;
          if((counts[k] || 0) < 1){ ok = false; break; }
          counts[k]--;
        }
      }
      if(!ok) continue;

      const remaining = [];
      for(const k in counts){
        for(let c = 0; c < counts[k]; c++) remaining.push(keyToTile(k));
      }
      const neededSets = 1 - melds[seat].length; // 鳴きが無ければ、あと1面子を門前で作る必要がある
      if(remaining.length !== neededSets * 3 + 2) continue;

      const decomp = findDecomposition(remaining, false);
      if(!decomp || decomp.sets.length !== neededSets) continue;

      const threadSets = suits.map((suit, i) => ({
        type:"sequence",
        tiles: threadDefs[perm[i]].map(n => ({ suit, num:n })),
        open:false,
        isThread:true
      }));
      return { pairKey: decomp.pairKey, extraSets: decomp.sets, threadSets };
    }
    return null;
  }

  // 組合同順（ツーハートンシュン、三色筋同順）：組合龍と同じ考え方だが、
  // 3色すべてに「同じ」筋（1・4・7／2・5・8／3・6・9のいずれか）を使う
  function findZuheTongshunDecomposition(seat, concealed){
    if(melds[seat].length > 1) return null; // 鳴けるのは残り1面子分だけ
    const threadDefs = [[1, 4, 7], [2, 5, 8], [3, 6, 9]];
    const suits = ["man", "pin", "sou"];
    for(const thread of threadDefs){
      const counts = countTiles(concealed);
      let ok = true;
      for(const suit of suits){
        for(const n of thread){
          const k = suit + "_" + n;
          if((counts[k] || 0) < 1){ ok = false; break; }
          counts[k]--;
        }
        if(!ok) break;
      }
      if(!ok) continue;

      const remaining = [];
      for(const k in counts){
        for(let c = 0; c < counts[k]; c++) remaining.push(keyToTile(k));
      }
      const neededSets = 1 - melds[seat].length;
      if(remaining.length !== neededSets * 3 + 2) continue;

      const decomp = findDecomposition(remaining, false);
      if(!decomp || decomp.sets.length !== neededSets) continue;

      const threadSets = suits.map(suit => ({
        type:"sequence",
        tiles: thread.map(n => ({ suit, num:n })),
        open:false,
        isThread:true
      }));
      return { pairKey: decomp.pairKey, extraSets: decomp.sets, threadSets };
    }
    return null;
  }

  function computeYaku(seat, allSets, pairTile, isTsumo, decomp, winTile, threadSets){
    const yaku = [];
    // 暗槓は鳴きを介さないため、それ以外の鳴き（ポン・チー・大明槓・加槓）が無ければ門前扱いのまま
    const closedHand = melds[seat].every(m => m.type === "ankan");
    const allTiles = [pairTile, pairTile, ...allSets.flatMap(s => s.tiles)];

    if(isTsumo && closedHand) yaku.push({ name:"門前清自摸和", han:1 });

    // 全帯五（チェンタイウー）：全ての面子＋雀頭に、萬子5・筒子5・索子5のいずれかが1枚以上含まれている
    // （門前2翻・鳴き1翻。必ずタンヤオ形になるため、タンヤオとは複合させない）
    const hasFive = t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num === 5;
    const isChantaiwu = hasFive(pairTile) && allSets.every(s => s.tiles.some(hasFive));
    if(isChantaiwu) yaku.push({ name:"全帯五", han: closedHand ? 2 : 1 });

    // 全双刻（チェンシュワンクー）：偶数の牌だけで成立した対々和（対々和と複合、2翻。必ずタンヤオ形になるため、タンヤオとは複合させない）
    const isEven = t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num % 2 === 0;
    const isToitoi = allSets.every(s => s.type === "triplet" || s.type === "kan");
    const isChuanshuangku = isToitoi && isEven(pairTile) && allSets.every(s => isEven(s.tiles[0]));
    if(isChuanshuangku) yaku.push({ name:"全双刻", han:2 });

    // 全中（チェンチュン）：4〜6の数牌だけで作る（門前3翻・鳴き2翻。タンヤオとは複合しない。全帯五とは複合する）
    const isQuanZhong = allTiles.every(isQuanZhongTile);
    if(isQuanZhong) yaku.push({ name:"全中", han: closedHand ? 3 : 2 });

    const isSimple = t => t.num !== 1 && t.num !== 9 && t.suit !== "wind" && t.suit !== "dragon";
    if(!isChantaiwu && !isChuanshuangku && !isQuanZhong && allTiles.every(isSimple)) yaku.push({ name:"断幺九", han:1 });

    allSets.forEach(s => {
      if(s.type === "triplet" || s.type === "kan"){
        const t = s.tiles[0];
        if(t.suit === "dragon") yaku.push({ name:"役牌（三元牌）", han:1 });
        if(t.suit === "wind" && t.num === SEAT_WIND[seat]) yaku.push({ name:"役牌（自風）", han:1 });
        if(t.suit === "wind" && t.num === ROUND_WIND) yaku.push({ name:"役牌（場風）", han:1 });
      }
    });

    if(allSets.every(s => s.type === "triplet" || s.type === "kan")) yaku.push({ name:"対々和", han:2 });

    // 大四喜・小四喜：風牌4種類のうち3つ以上を刻子/槓子として使っている（役満）。三風刻の上位役なので複合しない
    {
      const windNums = new Set();
      allSets.forEach(s => {
        if((s.type === "triplet" || s.type === "kan") && s.tiles[0].suit === "wind") windNums.add(s.tiles[0].num);
      });
      if(windNums.size === 4){
        yaku.push({ name:"大四喜", han:13 });
      } else if(windNums.size === 3 && pairTile.suit === "wind"){
        yaku.push({ name:"小四喜", han:13 });
      } else if(windNums.size >= 3){
        yaku.push({ name:"三風刻", han:2 });
      }
    }

    // 大三元・小三元：三元牌3種類のうち刻子/槓子にした数
    {
      const dragonNums = new Set();
      allSets.forEach(s => {
        if((s.type === "triplet" || s.type === "kan") && s.tiles[0].suit === "dragon") dragonNums.add(s.tiles[0].num);
      });
      if(dragonNums.size === 3){
        yaku.push({ name:"大三元", han:13 });
      } else if(dragonNums.size === 2 && pairTile.suit === "dragon"){
        yaku.push({ name:"小三元", han:2 });
      }
    }

    // 字一色：字牌だけで作る（役満）
    if(allTiles.every(t => t.suit === "wind" || t.suit === "dragon")) yaku.push({ name:"字一色", han:13 });

    // 清老頭：1・9の数牌だけで作る（役満）
    if(allTiles.every(t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && (t.num === 1 || t.num === 9))){
      yaku.push({ name:"清老頭", han:13 });
    }

    // 混老頭：1・9・字牌だけで作る（2翻）
    if(allTiles.every(t => t.num === 1 || t.num === 9 || t.suit === "wind" || t.suit === "dragon")){
      yaku.push({ name:"混老頭", han:2 });
    }

    // 緑一色：索子2・3・4・6・8と發だけで作る（役満）
    if(allTiles.every(isGreenTile)) yaku.push({ name:"緑一色", han:13 });

    // 三色同刻：同じ数字の刻子/槓子が萬子・筒子・索子それぞれにある（3翻）
    {
      const bySuit = { man:new Set(), pin:new Set(), sou:new Set() };
      allSets.forEach(s => {
        if((s.type === "triplet" || s.type === "kan") && bySuit[s.tiles[0].suit]) bySuit[s.tiles[0].suit].add(s.tiles[0].num);
      });
      let hasSanshokuDouko = false;
      for(let n = 1; n <= 9; n++){
        if(bySuit.man.has(n) && bySuit.pin.has(n) && bySuit.sou.has(n)){ hasSanshokuDouko = true; break; }
      }
      if(hasSanshokuDouko) yaku.push({ name:"三色同刻", han:3 });
    }

    // 三色同順：同じ数字の順子が萬子・筒子・索子それぞれにある（門前2翻・鳴き1翻）
    {
      const seqStartsBySuit3 = { man:new Set(), pin:new Set(), sou:new Set() };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        if(seqStartsBySuit3[s.tiles[0].suit]) seqStartsBySuit3[s.tiles[0].suit].add(s.tiles[0].num);
      });
      for(let n = 1; n <= 7; n++){
        if(seqStartsBySuit3.man.has(n) && seqStartsBySuit3.pin.has(n) && seqStartsBySuit3.sou.has(n)){
          yaku.push({ name:"三色同順", han: closedHand ? 2 : 1 });
          break;
        }
      }
    }

    // 三槓子：槓子が3組以上ある（3翻）
    if(allSets.filter(s => s.type === "kan").length >= 3) yaku.push({ name:"三槓子", han:3 });

    // 花鳥風月雪（役満）：筒子5・索子1・風牌（任意）・筒子1を刻子/槓子にし、雀頭を白にする。
    // 花鳥風月の上位役なので複合しない
    {
      const hasTripletOf = (suit, num) => allSets.some(s =>
        (s.type === "triplet" || s.type === "kan") && s.tiles[0].suit === suit && (num === undefined || s.tiles[0].num === num)
      );
      const isKachoFugetsuYuki = hasTripletOf("pin", 5) && hasTripletOf("sou", 1) && hasTripletOf("wind") &&
        hasTripletOf("pin", 1) && pairTile.suit === "dragon" && pairTile.num === 1;
      if(isKachoFugetsuYuki){
        yaku.push({ name:"花鳥風月雪", han:13 });
      } else if(hasTripletOf("pin", 5) && hasTripletOf("sou", 1) && hasTripletOf("wind") && hasTripletOf("pin", 1)){
        yaku.push({ name:"花鳥風月", han:2 });
      }
    }

    // 紅孔雀：索子1・5・7・9と中の5種類だけで作る（役満、鳴きも可）
    if(allTiles.every(isHongKongqueTile)) yaku.push({ name:"紅孔雀", han:13 });

    // 百万石：萬子の数字の合計が100以上（役満）
    if(manNumberSum(allTiles) >= 100) yaku.push({ name:"百万石", han:13 });

    // 一色双龍会（イーソシュワンロンフィー）：1色だけで123の順子2組・789の順子2組・雀頭を作る（役満、鳴きも可）
    let hasYisSeShuangLong = false;
    {
      const suits = ["man", "pin", "sou"];
      for(const suit of suits){
        const seqStarts = allSets.filter(s => s.type === "sequence" && s.tiles[0].suit === suit).map(s => s.tiles[0].num);
        const has123x2 = seqStarts.filter(n => n === 1).length >= 2;
        const has789x2 = seqStarts.filter(n => n === 7).length >= 2;
        if(has123x2 && has789x2 && pairTile.suit === suit){
          yaku.push({ name:"一色双龍会", han:13 });
          hasYisSeShuangLong = true;
          break;
        }
      }
    }

    const suitsUsed = new Set(allTiles.filter(t => t.suit === "man" || t.suit === "pin" || t.suit === "sou").map(t => t.suit));
    const hasHonor = allTiles.some(t => t.suit === "wind" || t.suit === "dragon");
    if(!hasYisSeShuangLong && suitsUsed.size === 1){
      if(hasHonor) yaku.push({ name:"混一色", han: closedHand ? 3 : 2 });
      else yaku.push({ name:"清一色", han: closedHand ? 6 : 5 });
    }

    // 平和：門前・全部順子・雀頭が役牌でない・かつ「両面待ち」で和了した場合のみ成立する
    if(closedHand && allSets.every(s => s.type === "sequence")){
      const pairIsYakuhai = pairTile.suit === "dragon" ||
        (pairTile.suit === "wind" && (pairTile.num === SEAT_WIND[seat] || pairTile.num === ROUND_WIND));
      if(!pairIsYakuhai && isRyanmenWait(decomp, winTile, threadSets)) yaku.push({ name:"平和", han:1 });
    }

    // 一気通貫：同じ色で123・456・789が揃っている（鳴いていると1翻、門前なら2翻）
    {
      const seqStartsBySuit = { man:new Set(), pin:new Set(), sou:new Set() };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit;
        if(seqStartsBySuit[suit]) seqStartsBySuit[suit].add(s.tiles[0].num);
      });
      for(const suit of ["man", "pin", "sou"]){
        if(seqStartsBySuit[suit].has(1) && seqStartsBySuit[suit].has(4) && seqStartsBySuit[suit].has(7)){
          yaku.push({ name:"一気通貫", han: closedHand ? 2 : 1 });
          break;
        }
      }
    }

    // 純全帯么（ジュンチャン）・全帯幺（チャンタ）：全ての面子＋雀頭に幺九牌が1枚以上含まれている
    // 純全帯么は字牌を含まない（1・9のみ）、より厳しい形（鳴いても面前でも3翻）。成立時は全帯幺とは複合しない
    {
      const hasTerminalOnly = t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && (t.num === 1 || t.num === 9);
      const hasTerminalOrHonor = t => t.num === 1 || t.num === 9 || t.suit === "wind" || t.suit === "dragon";
      const isJunchan = hasTerminalOnly(pairTile) && allSets.every(s => s.tiles.some(hasTerminalOnly));
      if(isJunchan){
        yaku.push({ name:"純全帯么", han:3 });
      } else if(hasTerminalOrHonor(pairTile) && allSets.every(s => s.tiles.some(hasTerminalOrHonor))){
        yaku.push({ name:"全帯幺", han:2 });
      }
    }

    // 一色四歩高：同じ色の順子4組全てが、1枚ずつか2枚ずつずれた階段状になっている（門前4翻・鳴き3翻）
    // 一色三歩高の上位役なので、成立した場合は一色三歩高を複合させない
    let hasIsshokuSibuko = false;
    {
      const seqStartsBySuit4 = { man:[], pin:[], sou:[] };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit;
        if(seqStartsBySuit4[suit]) seqStartsBySuit4[suit].push(s.tiles[0].num);
      });
      for(const suit of ["man", "pin", "sou"]){
        const starts = seqStartsBySuit4[suit];
        if(starts.length < 4) continue;
        const sorted = starts.slice().sort((a, b) => a - b);
        const d1 = sorted[1] - sorted[0], d2 = sorted[2] - sorted[1], d3 = sorted[3] - sorted[2];
        if(d1 === d2 && d2 === d3 && (d1 === 1 || d1 === 2)){
          yaku.push({ name:"一色四歩高", han: closedHand ? 4 : 3 });
          hasIsshokuSibuko = true;
          break;
        }
      }
    }

    // 一色三歩高：同じ色の順子3組が、1枚ずつか2枚ずつずれた階段状になっている（門前2翻・鳴き1翻）
    if(!hasIsshokuSibuko){
      const seqStartsBySuit = { man:[], pin:[], sou:[] };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit;
        if(seqStartsBySuit[suit]) seqStartsBySuit[suit].push(s.tiles[0].num);
      });
      outer:
      for(const suit of ["man", "pin", "sou"]){
        const starts = seqStartsBySuit[suit];
        for(let i = 0; i < starts.length; i++){
          for(let j = i + 1; j < starts.length; j++){
            for(let k = j + 1; k < starts.length; k++){
              const trio = [starts[i], starts[j], starts[k]].sort((a, b) => a - b);
              const d1 = trio[1] - trio[0], d2 = trio[2] - trio[1];
              if(d1 === d2 && (d1 === 1 || d1 === 2)){
                yaku.push({ name:"一色三歩高", han: closedHand ? 2 : 1 });
                break outer;
              }
            }
          }
        }
      }
    }

    // 全帯三（チャンタイサン）：全ての面子＋雀頭に、萬子3・筒子3・索子3のいずれかが1枚以上含まれている（門前2翻・鳴き1翻、タンヤオと複合）
    {
      const hasThree = t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num === 3;
      if(hasThree(pairTile) && allSets.every(s => s.tiles.some(hasThree))){
        yaku.push({ name:"全帯三", han: closedHand ? 2 : 1 });
      }
    }

    // 全帯七（チャンタイチー）：全ての面子＋雀頭に、萬子7・筒子7・索子7のいずれかが1枚以上含まれている（門前2翻・鳴き1翻、タンヤオと複合）
    {
      const hasSeven = t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num === 7;
      if(hasSeven(pairTile) && allSets.every(s => s.tiles.some(hasSeven))){
        yaku.push({ name:"全帯七", han: closedHand ? 2 : 1 });
      }
    }

    // 三色双龍会（サンソーシュワンロンフィー）：3色のうち1色に123の順子2組、別の1色に789の順子2組、
    // 残りの1色で雀頭を作る（4翻、チーも可）。二盃口とは複合しない
    let hasSanshokuShuangLong = false;
    {
      const seqStartsBySuit = { man:[], pin:[], sou:[] };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        if(seqStartsBySuit[s.tiles[0].suit]) seqStartsBySuit[s.tiles[0].suit].push(s.tiles[0].num);
      });
      const suits = ["man", "pin", "sou"];
      for(const perm of permuteIndices([0, 1, 2])){
        const s123 = suits[perm[0]], s789 = suits[perm[1]], sPair = suits[perm[2]];
        const has123x2 = seqStartsBySuit[s123].filter(n => n === 1).length >= 2;
        const has789x2 = seqStartsBySuit[s789].filter(n => n === 7).length >= 2;
        if(has123x2 && has789x2 && pairTile.suit === sPair){
          yaku.push({ name:"三色双龍会", han:4 });
          hasSanshokuShuangLong = true;
          break;
        }
      }
    }

    // 一色四順：同じ色で全く同じ順子が4組揃っている（役満）。一色三順・一盃口の上位役なので複合しない
    let hasIsshokuSijun = false;
    {
      const seqCountsBySuit4 = {};
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit, start = s.tiles[0].num;
        const k = suit + "_" + start;
        seqCountsBySuit4[k] = (seqCountsBySuit4[k] || 0) + 1;
      });
      if(Object.values(seqCountsBySuit4).some(c => c >= 4)){
        yaku.push({ name:"一色四順", han:13 });
        hasIsshokuSijun = true;
      }
    }

    // 一盃口（門前限定）・二盃口（門前3翻・鳴き1翻）：同じ順子が2組以上あるか
    if(!hasSanshokuShuangLong && !hasIsshokuSijun && !hasYisSeShuangLong){
      const seqCounts = {};
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const k = s.tiles[0].suit + "_" + s.tiles[0].num;
        seqCounts[k] = (seqCounts[k] || 0) + 1;
      });
      const dupPairCount = Object.values(seqCounts).filter(c => c >= 2).length;
      if(dupPairCount >= 2) yaku.push({ name:"二盃口", han: closedHand ? 3 : 1 });
      else if(closedHand && dupPairCount === 1) yaku.push({ name:"一盃口", han:1 });
    }

    // 三色三連刻（萬子・筒子・索子それぞれに刻子/槓子が1組ずつあり、数字が3つ連続している）
    {
      const triplets = allSets.filter(s => s.type === "triplet" || s.type === "kan");
      const bySuit = { man:[], pin:[], sou:[] };
      triplets.forEach(s => {
        const suit = s.tiles[0].suit;
        if(bySuit[suit]) bySuit[suit].push(s.tiles[0].num);
      });
      if(bySuit.man.length === 1 && bySuit.pin.length === 1 && bySuit.sou.length === 1){
        const nums = [bySuit.man[0], bySuit.pin[0], bySuit.sou[0]].sort((a, b) => a - b);
        if(nums[1] === nums[0] + 1 && nums[2] === nums[1] + 1){
          yaku.push({ name:"三色三連刻", han:1 });
        }
      }

      // 四連刻：同じ色だけで数字が4つ連続した刻子/槓子（役満）。三連刻の上位役なので複合しない
      let hasSurenko = false;
      const bySuitSet = { man:new Set(bySuit.man), pin:new Set(bySuit.pin), sou:new Set(bySuit.sou) };
      outerSurenko:
      for(const suit of ["man", "pin", "sou"]){
        for(let n = 1; n <= 6; n++){
          if(bySuitSet[suit].has(n) && bySuitSet[suit].has(n + 1) && bySuitSet[suit].has(n + 2) && bySuitSet[suit].has(n + 3)){
            yaku.push({ name:"四連刻", han:13 });
            hasSurenko = true;
            break outerSurenko;
          }
        }
      }

      // 三連刻：同じ色だけで数字が3つ連続した刻子/槓子（例：111・222・333）が揃っている（2翻）
      if(!hasSurenko){
        outerSanrenko:
        for(const suit of ["man", "pin", "sou"]){
          for(let n = 1; n <= 7; n++){
            if(bySuitSet[suit].has(n) && bySuitSet[suit].has(n + 1) && bySuitSet[suit].has(n + 2)){
              yaku.push({ name:"三連刻", han:2 });
              break outerSanrenko;
            }
          }
        }
      }
    }

    // 三暗刻・四暗刻：門前で自分の手牌の中だけで揃えた刻子（ロンで完成した刻子は含まない）が3つ/4つ
    // 暗槓（鳴きを介さない槓子）も暗刻として数える。大明槓・加槓は open:true のため対象外
    {
      const ankouExcludedOnce = { used:false };
      let ankouCount = decomp ? decomp.sets.reduce((count, s) => {
        if(s.type !== "triplet") return count;
        if(!isTsumo && winTile && s.tiles[0].suit === winTile.suit && s.tiles[0].num === winTile.num && !ankouExcludedOnce.used){
          ankouExcludedOnce.used = true;
          return count;
        }
        return count + 1;
      }, 0) : 0;
      ankouCount += allSets.filter(s => s.type === "kan" && s.open === false).length;
      if(ankouCount >= 4) yaku.push({ name:"四暗刻", han:13 });
      else if(ankouCount === 3) yaku.push({ name:"三暗刻", han:2 });
    }

    // 一色三順：同じ色で全く同じ順子が3組揃っている（例：123・123・123）（2翻）
    if(!hasIsshokuSijun){
      const seqCountsBySuit = {};
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit, start = s.tiles[0].num;
        const k = suit + "_" + start;
        seqCountsBySuit[k] = (seqCountsBySuit[k] || 0) + 1;
      });
      if(Object.values(seqCountsBySuit).some(c => c >= 3)){
        yaku.push({ name:"一色三順", han:2 });
      }
    }

    // 花龍（ファーロン）：萬子・筒子・索子で123/456/789のブロックが1つずつ揃う（鳴いても1翻）
    {
      const seqStartsBySuit = { man:new Set(), pin:new Set(), sou:new Set() };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit;
        if(seqStartsBySuit[suit]) seqStartsBySuit[suit].add(s.tiles[0].num);
      });
      const suits = ["man", "pin", "sou"];
      const blocks = [1, 4, 7];
      const permute = arr => arr.length <= 1 ? [arr] :
        arr.flatMap((v, i) => permute([...arr.slice(0, i), ...arr.slice(i + 1)]).map(p => [v, ...p]));
      const isKaryuu = permute(blocks).some(perm =>
        seqStartsBySuit[suits[0]].has(perm[0]) &&
        seqStartsBySuit[suits[1]].has(perm[1]) &&
        seqStartsBySuit[suits[2]].has(perm[2])
      );
      if(isKaryuu) yaku.push({ name:"花龍", han:1 });
    }

    // 五門斉（ウーメンチー）：萬子・筒子・索子・風牌・三元牌の5種類全てを使っている（鳴いても1翻）
    if(hasAllFiveSuits(allTiles)) yaku.push({ name:"五門斉", han:1 });

    // 推不倒（トイプータオ）：白・筒子1234589・索子245689だけで作る（門前2翻・鳴き1翻）
    if(allTiles.every(isToibudaoTile)) yaku.push({ name:"推不倒", han: closedHand ? 2 : 1 });

    // 全小（チェンショウ）：1〜3の数牌だけで作る（門前3翻・鳴き2翻）。小于五の上位役なので複合しない
    const isQuanXiao = allTiles.every(isQuanXiaoTile);
    if(isQuanXiao) yaku.push({ name:"全小", han: closedHand ? 3 : 2 });

    // 小于五（ショウユウウー）：1〜4の数牌だけで作る（門前2翻・鳴き1翻）
    if(!isQuanXiao && allTiles.every(isXiaoYuWuTile)) yaku.push({ name:"小于五", han: closedHand ? 2 : 1 });

    // 全大（チェンダー）：7〜9の数牌だけで作る（門前3翻・鳴き2翻）。大于五の上位役なので複合しない
    const isQuanDa = allTiles.every(isQuanDaTile);
    if(isQuanDa) yaku.push({ name:"全大", han: closedHand ? 3 : 2 });

    // 大于五（ダーユウウー）：6〜9の数牌だけで作る（門前2翻・鳴き1翻）
    if(!isQuanDa && allTiles.every(isDaYuWuTile)) yaku.push({ name:"大于五", han: closedHand ? 2 : 1 });

    // 組合龍（ツーハーロン、三色筋一気通貫）：門前2翻・鳴き1翻
    // 組合龍は専用の構造検出（findZuheLongDecomposition）側で判定し、ここでは扱わない

    // 雪月花（せつげっか）：白（雪）・1筒（月）・5筒（花）の刻子/槓子が揃っている（鳴いても1翻、白の役牌と複合）
    {
      const hasTripletOf = (suit, num) => allSets.some(s =>
        (s.type === "triplet" || s.type === "kan") && s.tiles[0].suit === suit && s.tiles[0].num === num
      );
      if(hasTripletOf("dragon", 1) && hasTripletOf("pin", 1) && hasTripletOf("pin", 5)){
        yaku.push({ name:"雪月花", han:1 });
      }
    }

    return yaku;
  }

  function hasAllFiveSuits(tiles){
    const cats = new Set(tiles.map(t => t.suit));
    return cats.has("man") && cats.has("pin") && cats.has("sou") && cats.has("wind") && cats.has("dragon");
  }

  function nextTileForDora(t){
    if(t.suit === "man" || t.suit === "pin" || t.suit === "sou"){
      return { suit:t.suit, num: t.num === 9 ? 1 : t.num + 1 };
    } else if(t.suit === "wind"){
      return { suit:"wind", num: t.num === 4 ? 1 : t.num + 1 };
    }
    return { suit:"dragon", num: t.num === 3 ? 1 : t.num + 1 };
  }

  function countDoraDetail(allTiles){
    const doraTile = nextTileForDora(doraIndicator);
    const indicatorDora = allTiles.filter(t => t.suit === doraTile.suit && t.num === doraTile.num).length;
    return indicatorDora;
  }

  // リーチドラ（通常の裏ドラに相当。開局時から表向きに公開済み）：
  // リーチを宣言して和了した人にだけ適用する
  function countRiichiDoraDetail(allTiles){
    const riichiDoraTile = nextTileForDora(riichiDoraIndicator);
    return allTiles.filter(t => t.suit === riichiDoraTile.suit && t.num === riichiDoraTile.num).length;
  }

  function countAka(allTiles){
    return allTiles.filter(t => t.red).length;
  }

  function addDoraYaku(yaku, allTiles, seat){
    const indicatorDora = countDoraDetail(allTiles);
    if(indicatorDora > 0) yaku.push({ name:"ドラ", han:indicatorDora });
    let total = indicatorDora;
    if(riichiDeclared[seat]){
      const riichiDora = countRiichiDoraDetail(allTiles);
      if(riichiDora > 0) yaku.push({ name:"リーチドラ", han:riichiDora });
      total += riichiDora;
    }
    return total;
  }

  // 符計算はせず、飜数だけで点数を決める簡易方式
  // （settleRon/settleTsumoの倍率（子ロン=4倍・親ロン=6倍）と組み合わせると、
  //   子＝飜数×2,000点、親＝飜数×3,000点になります）
  function calcBasePoints(han){
    return han * 500;
  }

  // 手牌が和了形になっているか判定し、役があれば結果を返す（役なしはnull）
  function attemptWin(seat, extraTile, isTsumo){
    const concealed = hands[seat].slice();
    if(extraTile) concealed.push(extraTile);
    // 和了牌（ロンなら捨て牌、ツモなら直前にツモった牌）。待ちの形（平和の判定）に使う
    const winTile = extraTile || (seat === "bottom" ? lastDrawnTile : lastDrawnCpu[seat]);

    // 国士無双（役満）：1・9の数牌6種類＋字牌7種類、計13種類のうちどれか1種類が2枚、残り12種類が1枚ずつ
    function buildKokushiResult(){
      if(melds[seat].length !== 0 || concealed.length !== 14) return null;
      const kokushiKeys = [
        "man_1", "man_9", "pin_1", "pin_9", "sou_1", "sou_9",
        "wind_1", "wind_2", "wind_3", "wind_4", "dragon_1", "dragon_2", "dragon_3"
      ];
      const counts = countTiles(concealed);
      const keys = Object.keys(counts);
      if(!keys.every(k => kokushiKeys.includes(k))) return null;
      if(keys.length !== 13) return null;
      const values = Object.values(counts);
      if(!(values.filter(c => c === 2).length === 1 && values.every(c => c === 1 || c === 2))) return null;
      const yaku = [{ name:"国士無双", han:13 }];
      const akaCount = countAka(concealed);
      const base = calcBasePoints(13);
      return { seat, yaku, han:13, base, isTsumo, akaCount };
    }

    // 七対子（2翻）：対子が7組（同じ牌を4枚使って2組にするのも可）、かつ門前のみ
    function buildChiitoitsuResult(){
      if(melds[seat].length !== 0 || concealed.length !== 14) return null;
      const counts = countTiles(concealed);
      const values = Object.values(counts);
      const allEven = values.every(c => c % 2 === 0);
      const totalPairs = values.reduce((sum, c) => sum + c / 2, 0);
      if(!allEven || totalPairs !== 7) return null;

      // 連七対（役満）：同じ色の7つの連続した数字が、ちょうど2枚ずつの対子になっている（4枚使いは不可）
      const keys = Object.keys(counts);
      let isRenchitoi = false;
      if(keys.length === 7 && keys.every(k => counts[k] === 2)){
        const tiles7 = keys.map(keyToTile);
        const suit0 = tiles7[0].suit;
        if(tiles7.every(t => t.suit === suit0)){
          const nums = tiles7.map(t => t.num).sort((a, b) => a - b);
          isRenchitoi = nums.every((n, i) => i === 0 || n === nums[i - 1] + 1);
        }
      }

      // 緑一色の七対子・4枚使い（役満）：全て緑の牌で、いずれかの牌を4枚（2組扱い）使っている
      const isGreenFourTileChiitoi = concealed.every(isGreenTile) && keys.some(k => counts[k] === 4);

      // 紅孔雀の七対子（役満、4枚使いも可）：全て索子1・5・7・9と中だけ
      const isHongKongqueChiitoi = concealed.every(isHongKongqueTile);

      // 花鳥風月雪の七対子（役満、4枚使いも可）：全て筒子5・筒子1・索子1・風牌・白だけ
      const isKachoFugetsuYukiChiitoi = concealed.every(isKachoFugetsuYukiTile);

      // 百万石の七対子（役満、4枚使いも可）：萬子の数字の合計が100以上
      const isHyakumangokuChiitoi = manNumberSum(concealed) >= 100;

      let yaku;
      if(isGreenFourTileChiitoi) yaku = [{ name:"緑一色（七対子四枚使い）", han:13 }];
      else if(isHongKongqueChiitoi) yaku = [{ name:"紅孔雀", han:13 }];
      else if(isKachoFugetsuYukiChiitoi) yaku = [{ name:"花鳥風月雪", han:13 }];
      else if(isHyakumangokuChiitoi) yaku = [{ name:"百万石", han:13 }];
      else if(isRenchitoi) yaku = [{ name:"連七対", han:13 }];
      else yaku = [{ name:"七対子", han:2 }];
      if(isTsumo) yaku.push({ name:"門前清自摸和", han:1 });
      if(hasAllFiveSuits(concealed)) yaku.push({ name:"五門斉", han:1 });
      if(concealed.every(isToibudaoTile)) yaku.push({ name:"推不倒", han:2 });
      if(concealed.every(isXiaoYuWuTile)) yaku.push({ name:"小于五", han:2 });
      if(concealed.every(isDaYuWuTile)) yaku.push({ name:"大于五", han:2 });
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, concealed, seat);
      const akaCount = countAka(concealed);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    // 同じ牌の並びでも「刻子優先」「順子優先」で解釈が分かれることがあるため
    // （例：111222333は三連刻にも一色三順にもなり得る）、両方試して翻数が高い方を採用する
    function buildStandardResult(preferSequence){
      const decomp = findDecomposition(concealed, preferSequence);
      if(!decomp) return null;
      const pairTile = keyToTile(decomp.pairKey);
      const allSets = [...decomp.sets, ...meldsToSets(seat)];
      if(allSets.length !== 4) return null;
      const yaku = computeYaku(seat, allSets, pairTile, isTsumo, decomp, winTile);
      const allTiles = [...concealed, ...meldsToSets(seat).flatMap(s => s.tiles)];
      const akaCount = countAka(allTiles);
      if(yaku.length === 0){
        const indicatorDoraCount = countDoraDetail(allTiles);
        return { seat, yaku: [], han: 0, isTsumo, akaCount, yakunashi: true, indicatorDoraCount };
      }
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, allTiles, seat);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    function buildZuheLongResult(){
      const zDecomp = findZuheLongDecomposition(seat, concealed);
      if(!zDecomp) return null;
      const pairTile = keyToTile(zDecomp.pairKey);
      const allSets = [...zDecomp.threadSets, ...zDecomp.extraSets, ...meldsToSets(seat)];
      if(allSets.length !== 4) return null;
      const pseudoDecomp = { sets: zDecomp.extraSets };
      const yaku = computeYaku(seat, allSets, pairTile, isTsumo, pseudoDecomp, winTile, zDecomp.threadSets);
      yaku.push({ name:"組合龍", han: melds[seat].length === 0 ? 2 : 1 });
      const allTiles = [...concealed, ...meldsToSets(seat).flatMap(s => s.tiles)];
      const akaCount = countAka(allTiles);
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, allTiles, seat);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    function buildZuheTongshunResult(){
      const zDecomp = findZuheTongshunDecomposition(seat, concealed);
      if(!zDecomp) return null;
      const pairTile = keyToTile(zDecomp.pairKey);
      const allSets = [...zDecomp.threadSets, ...zDecomp.extraSets, ...meldsToSets(seat)];
      if(allSets.length !== 4) return null;
      const pseudoDecomp = { sets: zDecomp.extraSets };
      const yaku = computeYaku(seat, allSets, pairTile, isTsumo, pseudoDecomp, winTile, zDecomp.threadSets);
      yaku.push({ name:"組合同順", han: melds[seat].length === 0 ? 2 : 1 });
      const allTiles = [...concealed, ...meldsToSets(seat).flatMap(s => s.tiles)];
      const akaCount = countAka(allTiles);
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, allTiles, seat);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    const candidates = [buildKokushiResult(), buildChiitoitsuResult(), buildStandardResult(false), buildStandardResult(true), buildZuheLongResult(), buildZuheTongshunResult()].filter(Boolean);
    if(candidates.length === 0) return null;
    return candidates.reduce((best, r) => (r.han > best.han ? r : best));
  }

  // テンパイ判定（役の有無は問わない、形式テンパイ）：34種類の牌を1枚ずつ仮に加えてみて、
  // どれか1つでも和了の形になれば（役なし和了も可の本ルールでは attemptWin が非nullを返せば）テンパイとする
  function isTenpai(seat){
    return ALL_TILE_TYPES.some(t => attemptWin(seat, t, true) !== null);
  }

  function settleTsumo(winnerSeat, base){
    const isDealer = winnerSeat === DEALER_SEAT;
    const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
    let total = 0;
    others.forEach(s => {
      const pay = isDealer
        ? Math.ceil(base * 2 / 100) * 100
        : (s === DEALER_SEAT ? Math.ceil(base * 2 / 100) * 100 : Math.ceil(base / 100) * 100);
      scores[s] -= pay;
      total += pay;
    });
    scores[winnerSeat] += total;
  }

  function settleRon(winnerSeat, loserSeat, base){
    const isDealer = winnerSeat === DEALER_SEAT;
    const pay = Math.ceil(base * (isDealer ? 6 : 4) / 100) * 100;
    scores[loserSeat] -= pay;
    scores[winnerSeat] += pay;
  }

  // 役満（13翻以上）は通常の計算式ではなく、親48,000点・子32,000点の固定点数にする
  function settleYakumanTsumo(winnerSeat){
    const isDealer = winnerSeat === DEALER_SEAT;
    const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
    let total = 0;
    others.forEach(s => {
      const pay = isDealer ? 16000 : (s === DEALER_SEAT ? 16000 : 8000);
      scores[s] -= pay;
      total += pay;
    });
    scores[winnerSeat] += total;
  }

  function settleYakumanRon(winnerSeat, loserSeat){
    const isDealer = winnerSeat === DEALER_SEAT;
    const pay = isDealer ? 48000 : 32000;
    scores[loserSeat] -= pay;
    scores[winnerSeat] += pay;
  }

  // 赤牌ボーナス：ドラ扱いにせず、1枚につき2,000点の直接ボーナス（親でも子でも同額）
  // ツモなら3人からそれぞれ2,000点（合計6,000点）、ロンなら相手から2,000点
  function settleAkaBonus(winnerSeat, loserSeat, akaCount, isTsumo){
    if(!akaCount) return 0;
    if(isTsumo){
      const perOpponent = akaCount * 2000;
      const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
      others.forEach(s => { scores[s] -= perOpponent; });
      const total = perOpponent * others.length;
      scores[winnerSeat] += total;
      return total;
    } else {
      const amount = akaCount * 2000;
      scores[loserSeat] -= amount;
      scores[winnerSeat] += amount;
      return amount;
    }
  }

  // 役なし和了の精算（簡易ルール）：子1,000点・親1,500点を基準に、
  // ドラは基準と同じ単位（子1,000点/親1,500点）で1枚ごとに加算。この基礎点+ドラ分は
  // 「合計額」なので、ロンなら1人がそのまま払う。ツモは3人均等ではなく「子1・親2」の比で払う：
  //   子の和了→子payer=合計/4・親payer=合計/2（2人×1/4 + 1人×1/2 = 合計）
  //   親の和了→支払う3人は全員子なので合計/3の均等
  // 単位が子1,000点/親1,500点なのでこの比で割り切れる（子payerは250の倍数、親payerは500の倍数）。
  // 100点単位に揃うとは限らないが端数は出ないため、切り上げ処理は不要。
  // 赤牌だけは親子・ツモロン問わず1枚につき1,000点を、支払う側1人あたりの額として加算する
  function settleYakunashi(winnerSeat, loserSeat, indicatorDoraCount, akaCount, isTsumo){
    const isDealer = winnerSeat === DEALER_SEAT;
    const unitRate = isDealer ? 1500 : 1000;
    const baseAndDora = unitRate * (1 + indicatorDoraCount); // 基礎点+ドラの合計額
    if(isTsumo){
      const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
      let total = 0;
      others.forEach(s => {
        const share = isDealer
          ? baseAndDora / 3
          : (s === DEALER_SEAT ? baseAndDora / 2 : baseAndDora / 4);
        const pay = share + akaCount * 1000;
        scores[s] -= pay;
        total += pay;
      });
      scores[winnerSeat] += total;
      return total;
    } else {
      const perShare = baseAndDora + akaCount * 1000;
      scores[loserSeat] -= perShare;
      scores[winnerSeat] += perShare;
      return perShare;
    }
  }

  // 流局時のテンパイ料精算：ノーテンの人がテンパイの人それぞれに1,000点ずつ払う
  function settleRyuukyoku(tenpaiSeats, notenSeats){
    if(tenpaiSeats.length === 0 || notenSeats.length === 0) return;
    const gainEach = 1000 * notenSeats.length;
    const lossEach = 1000 * tenpaiSeats.length;
    tenpaiSeats.forEach(s => { scores[s] += gainEach; });
    notenSeats.forEach(s => { scores[s] -= lossEach; });
  }

  function showRyuukyokuResult(tenpaiSeats, notenSeats){
    const box = document.getElementById("resultBox");
    box.style.display = "block";
    // 全員テンパイ／全員ノーテンは点数移動が発生しない（settleRyuukyoku側で0扱い）ので、
    // その場合は自然に±0点になる。テンパイ／ノーテンの文言は出さず点数だけを表示する
    const hasMovement = tenpaiSeats.length > 0 && notenSeats.length > 0;
    const gainEach = hasMovement ? 1000 * notenSeats.length : 0;
    const lossEach = hasMovement ? 1000 * tenpaiSeats.length : 0;
    // 席ごとに1行ずつ、あなた→下家→対面→上家の順（＝seats配列の順）で点数増減だけを出す
    const rows = ["bottom", "right", "top", "left"].map(s => {
      const delta = tenpaiSeats.includes(s) ? gainEach : -lossEach;
      const deltaText = delta > 0 ? "＋" + delta + "点" : (delta < 0 ? "－" + (-delta) + "点" : "±0点");
      return `<div class="result-yaku">${seatLabel[s]}　${deltaText}</div>`;
    }).join("");
    box.innerHTML = `<div class="result-title">流局</div>` + rows;
  }

  // 山が尽きた（誰もツモれなくなった）ときの流局処理
  // ※この段階では親交代・連荘・半荘進行は行わず、ここでゲームを終了する
  function handleRyuukyoku(){
    gameEnded = true;
    const seats = ["bottom", "right", "top", "left"]; // あなた・下家・対面・上家の順で表示する
    const tenpaiSeats = seats.filter(isTenpai);
    const notenSeats = seats.filter(s => !tenpaiSeats.includes(s));
    settleRyuukyoku(tenpaiSeats, notenSeats);
    renderScores();
    showRyuukyokuResult(tenpaiSeats, notenSeats);
    setTurnIndicator("");
    hideCallPrompt();
    renderMyHand(false);
  }

  // totalGain: 精算後に和了者の持ち点が実際に何点増えたか（供託の総取り分も含む）。
  // 「持ち点がいきなり変わるだけで分からない」を解消するため、常にこの実数を表示する
  // paymentsBySeat: finalizeWinで供託加算前に控えた、各家の実際の支払額（seat -> 点数）
  function showResult(seat, result, loserSeat, bonusTotal, totalGain, paymentsBySeat){
    const box = document.getElementById("resultBox");
    box.style.display = "block";
    const title = result.isTsumo ? (seatLabel[seat] + "のツモ") : (seatLabel[seat] + "のロン（" + seatLabel[loserSeat] + "から）");
    const isTsumo = result.isTsumo;
    const isDealer = seat === DEALER_SEAT;

    // 役名の括弧書き（例:「役牌（三元牌）」の（三元牌）部分）は表示しない
    const stripParen = name => name.replace(/（[^）]*）/g, "");
    // 表示だけの短縮名（役判定側のnameキーは変更しない）
    const DISPLAY_NAME_ALIAS = { "門前清自摸和": "門前清" };
    const displayNameOf = name => DISPLAY_NAME_ALIAS[name] || stripParen(name);

    const row = (name, hanText, pts, cls) =>
      `<div class="result-row${cls ? " " + cls : ""}">` +
      `<span class="col-name">${name}</span>` +
      `<span class="col-han">${hanText}</span>` +
      `<span class="col-pts">${pts}</span>` +
      `</div>`;

    let rowsHtml = "";
    if(result.yakunashi){
      const unitRate = isDealer ? 1500 : 1000;
      const doraCount = result.indicatorDoraCount;
      // settleYakunashiが100点単位への切り上げをやめ「子1・親2」の比の実額計算に変わったため、
      // 役無し・ドラの行は名目額（unitRate・doraCount*unitRate）をそのまま出せばよい
      rowsHtml += row("役無し", "", unitRate);
      if(doraCount > 0){
        rowsHtml += row("ドラ×" + doraCount, "", doraCount * unitRate);
      }
      if(result.akaCount > 0){
        const payers = isTsumo ? 3 : 1; // settleYakunashiは赤1枚につき支払う側1人あたり1,000点
        rowsHtml += row("赤×" + result.akaCount + (isTsumo ? "(自摸)" : ""), "", result.akaCount * 1000 * payers);
      }
    } else {
      // ドラ・リーチドラはハウスルール上、他の役と違って「翻を稼ぐための役」ではなく
      // 定額ボーナスの性格が強いので、表示上も他の役（飜数の少ない順）とは分けて末尾にまとめる
      // （赤牌ボーナスも同じ理由で、常にそのさらに後ろの行に表示する）
      const DORA_YAKU_NAMES = new Set(["ドラ", "リーチドラ"]);
      // 役満は固定額（親48,000点・子32,000点）で、飜×単位の線形計算に乗らない。
      // ドラの飜がhan>=13の判定に加わっただけの場合も含め、役満成立時はドラが実際の点数に
      // 一切寄与しないため、ドラの行自体を出さない（点数欄だけ空欄にすると「本来は点数が
      // あるのに表示できていない」ように誤読されるため、行ごと省く方が実態に合う）
      const isYakuman = result.han >= 13;
      const normalYaku = result.yaku.filter(y => !DORA_YAKU_NAMES.has(y.name)).slice().sort((a, b) => a.han - b.han);
      const doraYaku = isYakuman ? [] : result.yaku.filter(y => DORA_YAKU_NAMES.has(y.name));
      const pointsPerHan = isDealer ? 3000 : 2000; // 1翻あたりの合計額（子2,000点・親3,000点）
      normalYaku.concat(doraYaku).forEach(y => {
        const isDoraRow = DORA_YAKU_NAMES.has(y.name);
        const displayName = isDoraRow ? (y.name + "×" + y.han) : displayNameOf(y.name);
        const hanText = isYakuman ? "役満" : (y.han + "飜");
        const pts = isYakuman ? "" : y.han * pointsPerHan;
        rowsHtml += row(displayName, hanText, pts);
      });
      if(bonusTotal > 0){
        rowsHtml += row("赤×" + result.akaCount + (isTsumo ? "(自摸)" : ""), "", bonusTotal);
      }
    }

    let totalHtml;
    if(isTsumo){
      const others = ["bottom", "top", "left", "right"].filter(s => s !== seat);
      const amounts = others.map(s => paymentsBySeat[s]);
      const allSame = amounts.every(a => a === amounts[0]);
      const splitText = allSame
        ? amounts[0] + "ALL"
        : paymentsBySeat[others.find(s => s !== DEALER_SEAT)] + "・" + paymentsBySeat[DEALER_SEAT];
      totalHtml = row(splitText, "", totalGain, "total-row");
    } else {
      totalHtml = row("", "", totalGain, "total-row");
    }

    box.innerHTML =
      `<div class="result-title">${title}</div>` +
      rowsHtml +
      totalHtml;
  }

  function finalizeWin(winnerSeat, loserSeat, result){
    gameEnded = true;
    // settle系を呼ぶ前に4人全員のscoresを控えておく（供託加算より前の、和了精算のみの差分を後で取るため）
    const seats = ["bottom", "top", "left", "right"];
    const scoresBefore = {};
    seats.forEach(s => { scoresBefore[s] = scores[s]; });
    let bonusTotal;
    if(result.yakunashi){
      bonusTotal = settleYakunashi(winnerSeat, loserSeat, result.indicatorDoraCount, result.akaCount, result.isTsumo);
    } else if(result.han >= 13){
      if(result.isTsumo) settleYakumanTsumo(winnerSeat);
      else settleYakumanRon(winnerSeat, loserSeat);
      bonusTotal = settleAkaBonus(winnerSeat, loserSeat, result.akaCount, result.isTsumo);
    } else {
      if(result.isTsumo) settleTsumo(winnerSeat, result.base);
      else settleRon(winnerSeat, loserSeat, result.base);
      bonusTotal = settleAkaBonus(winnerSeat, loserSeat, result.akaCount, result.isTsumo);
    }
    // 供託を足す前に、各家の実際の支払額（控えておいた値－現在値）を集計する。
    // 比率からの逆算はしない：赤牌ボーナスは親子に関係なく1枚につき各家2,000点の均等払いのため、
    // 通常役の飜による2:1の比が崩れる。実際の支払額を足し上げれば、親の和了は自然に3人同額になる。
    const paymentsBySeat = {};
    seats.forEach(s => { paymentsBySeat[s] = scoresBefore[s] - scores[s]; });
    if(riichiSticks > 0 && riichiDeclared[winnerSeat]){
      scores[winnerSeat] += riichiSticks * 1000;
      riichiSticks = 0;
      updateKyotakuDisplay();
    }
    const totalGain = scores[winnerSeat] - scoresBefore[winnerSeat];
    renderScores();
    showResult(winnerSeat, result, loserSeat, bonusTotal, totalGain, paymentsBySeat);
    setTurnIndicator("");
    hideCallPrompt();
    renderMyHand(false);
  }

  // 下段の「和了」ボタンはツモとロンを兼ねる。
  // ロン待ち（pendingRon）があればそれを優先。無ければ、今まさに牌を引いた直後
  // （lastDrawnTileがある間）だけツモの成立を判定する。それ以外（鳴いた直後の打牌待ちや
  // 打牌した直後など）は判定を待たずに常に無効化する。
  function updateWinButton(){
    const btn = document.getElementById("winBtn");
    if(gameEnded){
      btn.disabled = true;
      btn.onclick = null;
      return;
    }
    if(pendingRon){
      const ron = pendingRon; // hideCallPrompt()がpendingRonをnullにする前にクロージャで確保しておく
      btn.disabled = false;
      btn.onclick = () => { hideCallPrompt(); finalizeWin("bottom", ron.discarderSeat, ron.result); };
      return;
    }
    if(!lastDrawnTile){
      btn.disabled = true;
      btn.onclick = null;
      return;
    }
    const result = attemptWin("bottom", null, true);
    if(result){
      btn.disabled = false;
      btn.onclick = () => finalizeWin("bottom", "bottom", result);
    } else {
      btn.disabled = true;
      btn.onclick = null;
    }
  }

  // 下段の「スルー」ボタン：他家の捨て牌に対する鳴きプロンプトが開いている間だけ有効にする
  // （鳴きプロンプト側の「スルー」ボタンは廃止し、こちらに一本化した）
  function updateThroughButton(){
    const btn = document.getElementById("throughBtn");
    if(gameEnded || !pendingCallContext){
      btn.disabled = true;
      btn.onclick = null;
      return;
    }
    const ctx = pendingCallContext; // hideCallPrompt()がクリアする前にクロージャで確保しておく
    btn.disabled = false;
    btn.onclick = () => { hideCallPrompt(); advanceTurnAfterDiscard(ctx.discarderSeat); };
  }

  // 下段のチー/ポン/カンボタン：鳴ける選択肢がある時だけ有効にする。
  // 選択モード中（activeCallSelection）は、途中で別の種類に切り替えられないよう3つとも無効にする
  // （やめたい時はスルーで選択自体をキャンセルする）
  function updateCallButtons(){
    const chiBtn = document.getElementById("chiBtn");
    const ponBtn = document.getElementById("ponBtn");
    const kanBtn = document.getElementById("kanBtn");
    if(gameEnded || !pendingCallOptions || activeCallSelection){
      [chiBtn, ponBtn, kanBtn].forEach(b => { b.disabled = true; b.onclick = null; });
      return;
    }
    const opts = pendingCallOptions;
    chiBtn.disabled = !(opts.chiShapes && opts.chiShapes.length > 0);
    chiBtn.onclick = chiBtn.disabled ? null : () => startCallSelection("chi");
    ponBtn.disabled = !opts.pon;
    ponBtn.onclick = ponBtn.disabled ? null : () => startCallSelection("pon");
    kanBtn.disabled = !opts.kan;
    kanBtn.onclick = kanBtn.disabled ? null : () => startCallSelection("kan");
  }

  function updateActionButtons(){
    updateWinButton();
    updateThroughButton();
    updateCallButtons();
  }


  renderMyHand(true);
  renderCpuHandBacks("top");
  renderCpuHandBacks("left");
  renderCpuHandBacks("right");
  updateActionButtons();
  setTurnIndicator("あなたの番です（牌をタップして捨ててください）");

  // 指定したid要素に牌の見た目を描き込む（既存のtileEl()を流用し、classとinnerHTMLだけ移す）
  function paintTile(elId, tile, extraClass){
    const el = document.getElementById(elId);
    const temp = tileEl(tile.suit, tile.num, tileClass(tile.suit, tile.num) + " " + extraClass, tile.red);
    el.className = temp.className;
    el.innerHTML = temp.innerHTML;
  }

  // 王牌のうち2枚を表向きにして、実際のドラ表示牌・リーチドラ表示牌として見せる（以降は一切めくらない）
  const doraIndicator = deadWall[0];
  const riichiDoraIndicator = deadWall[1];
  paintTile("doraIndicatorTile", doraIndicator, "wall-indicator");
  paintTile("riichiDoraIndicatorTile", riichiDoraIndicator, "wall-indicator riichi-dora-tile");
  // 局表示の横には、表示牌そのものではなく実際のドラ（次の牌）を出す
  paintTile("doraActualTile", nextTileForDora(doraIndicator), "dora-tile");
  paintTile("riichiDoraActualTile", nextTileForDora(riichiDoraIndicator), "dora-tile riichi-dora-tile");

  updateWallCount();
  renderScores();
  updateKyotakuDisplay();

  // --- 牌サイズ(--tile-h)を画面いっぱいまで最大化する ---
  // 縦・横どちらの制約にもぶつからない最大サイズを、実際にDOMへ適用して測りながら二分探索で探す
  // （山も鳴き面子も含め、卓の見た目を決めるあらゆる余白・比率がCSS側に散らばっているため、
  // 手計算の式より実測の方が確実で、レイアウトを直すたびに式を書き直さずに済む）。
  function fitTileSize(){
    const ring = document.querySelector(".ring.hand-ring");
    const area = document.querySelector(".table-area");
    const prevMaxW = ring.style.maxWidth;
    const prevMaxH = ring.style.maxHeight;
    // 探索中は.ringのmax-width/height:100%（親に収める制約）を外し、素の必要サイズを測れるようにする
    ring.style.maxWidth = "none";
    ring.style.maxHeight = "none";

    function fits(px){
      document.documentElement.style.setProperty("--tile-h", px + "px");
      return ring.scrollWidth <= area.clientWidth && ring.scrollHeight <= area.clientHeight;
    }

    let lo = 10, hi = 80; // 探索範囲(px)。10ptでも収まらない極端な画面ではloのまま使う
    if(fits(lo)){
      while(hi - lo > 1){
        const mid = Math.floor((lo + hi) / 2);
        if(fits(mid)) lo = mid; else hi = mid;
      }
    }
    document.documentElement.style.setProperty("--tile-h", lo + "px");

    ring.style.maxWidth = prevMaxW;
    ring.style.maxHeight = prevMaxH;
    stabilizeCenterInfoCells();

    // 卓の基準幅（山11枚+左右2枚ずつ相当）を、実際に描画された卓(.ring.hand-ring)の幅から
    // 実測して--table-widthに反映する。下段ボタン行など、卓の入れ子構造の外にあって
    // グリッドでは自動的に幅を合わせられない要素はこの変数を参照して幅を揃える
    document.documentElement.style.setProperty("--table-width", ring.offsetWidth + "px");

    // --tile-h（ひいては--table-width）が変わると鳴き面子行の縮小要否・縮小率も
    // 変わるため、4方向とも計算し直す
    ["top", "bottom", "left", "right"].forEach(fitMeldRowScale);
  }

  fitTileSize();
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { fitTileSize(); }, 150);
  });
</script>

</body>
