        const s123 = suits[perm[0]], s789 = suits[perm[1]], sPair = suits[perm[2]];
        const has123x2 = seqStartsBySuit[s123].filter(n => n === 1).length >= 2;
        const has789x2 = seqStartsBySuit[s789].filter(n => n === 7).length >= 2;
        if(has123x2 && has789x2 && pairTile.suit === sPair){
          yaku.push({ name:"三色双龍会", han:4 });
          hasSanshokuShuangLong = true;
          break;
        }
      }
    }

    // 一色四順：同じ色で全く同じ順子が4組揃っている（役満）。一色三順・一盃口の上位役なので複合しない
    let hasIsshokuSijun = false;
    {
      const seqCountsBySuit4 = {};
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit, start = s.tiles[0].num;
        const k = suit + "_" + start;
        seqCountsBySuit4[k] = (seqCountsBySuit4[k] || 0) + 1;
      });
      if(Object.values(seqCountsBySuit4).some(c => c >= 4)){
        yaku.push({ name:"一色四順", han:13 });
        hasIsshokuSijun = true;
      }
    }

    // 一盃口（門前限定）・二盃口（門前3翻・鳴き1翻）：同じ順子が2組以上あるか
    if(!hasSanshokuShuangLong && !hasIsshokuSijun && !hasYisSeShuangLong){
      const seqCounts = {};
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const k = s.tiles[0].suit + "_" + s.tiles[0].num;
        seqCounts[k] = (seqCounts[k] || 0) + 1;
      });
      const dupPairCount = Object.values(seqCounts).filter(c => c >= 2).length;
      if(dupPairCount >= 2) yaku.push({ name:"二盃口", han: closedHand ? 3 : 1 });
      else if(closedHand && dupPairCount === 1) yaku.push({ name:"一盃口", han:1 });
    }

    // 三色三連刻（萬子・筒子・索子それぞれに刻子/槓子が1組ずつあり、数字が3つ連続している）
    {
      const triplets = allSets.filter(s => s.type === "triplet" || s.type === "kan");
      const bySuit = { man:[], pin:[], sou:[] };
      triplets.forEach(s => {
        const suit = s.tiles[0].suit;
        if(bySuit[suit]) bySuit[suit].push(s.tiles[0].num);
      });
      if(bySuit.man.length === 1 && bySuit.pin.length === 1 && bySuit.sou.length === 1){
        const nums = [bySuit.man[0], bySuit.pin[0], bySuit.sou[0]].sort((a, b) => a - b);
        if(nums[1] === nums[0] + 1 && nums[2] === nums[1] + 1){
          yaku.push({ name:"三色三連刻", han:1 });
        }
      }

      // 四連刻：同じ色だけで数字が4つ連続した刻子/槓子（役満）。三連刻の上位役なので複合しない
      let hasSurenko = false;
      const bySuitSet = { man:new Set(bySuit.man), pin:new Set(bySuit.pin), sou:new Set(bySuit.sou) };
      outerSurenko:
      for(const suit of ["man", "pin", "sou"]){
        for(let n = 1; n <= 6; n++){
          if(bySuitSet[suit].has(n) && bySuitSet[suit].has(n + 1) && bySuitSet[suit].has(n + 2) && bySuitSet[suit].has(n + 3)){
            yaku.push({ name:"四連刻", han:13 });
            hasSurenko = true;
            break outerSurenko;
          }
        }
      }

      // 三連刻：同じ色だけで数字が3つ連続した刻子/槓子（例：111・222・333）が揃っている（2翻）
      if(!hasSurenko){
        outerSanrenko:
        for(const suit of ["man", "pin", "sou"]){
          for(let n = 1; n <= 7; n++){
            if(bySuitSet[suit].has(n) && bySuitSet[suit].has(n + 1) && bySuitSet[suit].has(n + 2)){
              yaku.push({ name:"三連刻", han:2 });
              break outerSanrenko;
            }
          }
        }
      }
    }

    // 三暗刻・四暗刻：門前で自分の手牌の中だけで揃えた刻子（ロンで完成した刻子は含まない）が3つ/4つ
    // 暗槓（鳴きを介さない槓子）も暗刻として数える。大明槓・加槓は open:true のため対象外
    {
      const ankouExcludedOnce = { used:false };
      let ankouCount = decomp ? decomp.sets.reduce((count, s) => {
        if(s.type !== "triplet") return count;
        if(!isTsumo && winTile && s.tiles[0].suit === winTile.suit && s.tiles[0].num === winTile.num && !ankouExcludedOnce.used){
          ankouExcludedOnce.used = true;
          return count;
        }
        return count + 1;
      }, 0) : 0;
      ankouCount += allSets.filter(s => s.type === "kan" && s.open === false).length;
      if(ankouCount >= 4) yaku.push({ name:"四暗刻", han:13 });
      else if(ankouCount === 3) yaku.push({ name:"三暗刻", han:2 });
    }

    // 一色三順：同じ色で全く同じ順子が3組揃っている（例：123・123・123）（2翻）
    if(!hasIsshokuSijun){
      const seqCountsBySuit = {};
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit, start = s.tiles[0].num;
        const k = suit + "_" + start;
        seqCountsBySuit[k] = (seqCountsBySuit[k] || 0) + 1;
      });
      if(Object.values(seqCountsBySuit).some(c => c >= 3)){
        yaku.push({ name:"一色三順", han:2 });
      }
    }

    // 花龍（ファーロン）：萬子・筒子・索子で123/456/789のブロックが1つずつ揃う（鳴いても1翻）
    {
      const seqStartsBySuit = { man:new Set(), pin:new Set(), sou:new Set() };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit;
        if(seqStartsBySuit[suit]) seqStartsBySuit[suit].add(s.tiles[0].num);
      });
      const suits = ["man", "pin", "sou"];
      const blocks = [1, 4, 7];
      const permute = arr => arr.length <= 1 ? [arr] :
        arr.flatMap((v, i) => permute([...arr.slice(0, i), ...arr.slice(i + 1)]).map(p => [v, ...p]));
      const isKaryuu = permute(blocks).some(perm =>
        seqStartsBySuit[suits[0]].has(perm[0]) &&
        seqStartsBySuit[suits[1]].has(perm[1]) &&
        seqStartsBySuit[suits[2]].has(perm[2])
      );
      if(isKaryuu) yaku.push({ name:"花龍", han:1 });
    }

    // 五門斉（ウーメンチー）：萬子・筒子・索子・風牌・三元牌の5種類全てを使っている（鳴いても1翻）
    if(hasAllFiveSuits(allTiles)) yaku.push({ name:"五門斉", han:1 });

    // 推不倒（トイプータオ）：白・筒子1234589・索子245689だけで作る（門前2翻・鳴き1翻）
    if(allTiles.every(isToibudaoTile)) yaku.push({ name:"推不倒", han: closedHand ? 2 : 1 });

    // 全小（チェンショウ）：1〜3の数牌だけで作る（門前3翻・鳴き2翻）。小于五の上位役なので複合しない
    const isQuanXiao = allTiles.every(isQuanXiaoTile);
    if(isQuanXiao) yaku.push({ name:"全小", han: closedHand ? 3 : 2 });

    // 小于五（ショウユウウー）：1〜4の数牌だけで作る（門前2翻・鳴き1翻）
    if(!isQuanXiao && allTiles.every(isXiaoYuWuTile)) yaku.push({ name:"小于五", han: closedHand ? 2 : 1 });

    // 全大（チェンダー）：7〜9の数牌だけで作る（門前3翻・鳴き2翻）。大于五の上位役なので複合しない
    const isQuanDa = allTiles.every(isQuanDaTile);
    if(isQuanDa) yaku.push({ name:"全大", han: closedHand ? 3 : 2 });

    // 大于五（ダーユウウー）：6〜9の数牌だけで作る（門前2翻・鳴き1翻）
    if(!isQuanDa && allTiles.every(isDaYuWuTile)) yaku.push({ name:"大于五", han: closedHand ? 2 : 1 });

    // 組合龍（ツーハーロン、三色筋一気通貫）：門前2翻・鳴き1翻
    // 組合龍は専用の構造検出（findZuheLongDecomposition）側で判定し、ここでは扱わない

    // 雪月花（せつげっか）：白（雪）・1筒（月）・5筒（花）の刻子/槓子が揃っている（鳴いても1翻、白の役牌と複合）
    {
      const hasTripletOf = (suit, num) => allSets.some(s =>
        (s.type === "triplet" || s.type === "kan") && s.tiles[0].suit === suit && s.tiles[0].num === num
      );
      if(hasTripletOf("dragon", 1) && hasTripletOf("pin", 1) && hasTripletOf("pin", 5)){
        yaku.push({ name:"雪月花", han:1 });
      }
    }

    return yaku;
  }

  function hasAllFiveSuits(tiles){
    const cats = new Set(tiles.map(t => t.suit));
    return cats.has("man") && cats.has("pin") && cats.has("sou") && cats.has("wind") && cats.has("dragon");
  }

  function nextTileForDora(t){
    if(t.suit === "man" || t.suit === "pin" || t.suit === "sou"){
      return { suit:t.suit, num: t.num === 9 ? 1 : t.num + 1 };
    } else if(t.suit === "wind"){
      return { suit:"wind", num: t.num === 4 ? 1 : t.num + 1 };
    }
    return { suit:"dragon", num: t.num === 3 ? 1 : t.num + 1 };
  }

  function countDoraDetail(allTiles){
    const doraTile = nextTileForDora(doraIndicator);
    const indicatorDora = allTiles.filter(t => t.suit === doraTile.suit && t.num === doraTile.num).length;
    return indicatorDora;
  }

  // リーチドラ（通常の裏ドラに相当。開局時から表向きに公開済み）：
  // リーチを宣言して和了した人にだけ適用する
  function countRiichiDoraDetail(allTiles){
    const riichiDoraTile = nextTileForDora(riichiDoraIndicator);
    return allTiles.filter(t => t.suit === riichiDoraTile.suit && t.num === riichiDoraTile.num).length;
  }

  function countAka(allTiles){
    return allTiles.filter(t => t.red).length;
  }

  function addDoraYaku(yaku, allTiles, seat){
    const indicatorDora = countDoraDetail(allTiles);
    if(indicatorDora > 0) yaku.push({ name:"ドラ", han:indicatorDora });
    let total = indicatorDora;
    if(riichiDeclared[seat]){
      const riichiDora = countRiichiDoraDetail(allTiles);
      if(riichiDora > 0) yaku.push({ name:"リーチドラ", han:riichiDora });
      total += riichiDora;
    }
    return total;
  }

  // 符計算はせず、飜数だけで点数を決める簡易方式
  // （settleRon/settleTsumoの倍率（子ロン=4倍・親ロン=6倍）と組み合わせると、
  //   子＝飜数×2,000点、親＝飜数×3,000点になります）
  function calcBasePoints(han){
    return han * 500;
  }

  // 手牌が和了形になっているか判定し、役があれば結果を返す（役なしはnull）
  function attemptWin(seat, extraTile, isTsumo){
    const concealed = hands[seat].slice();
    if(extraTile) concealed.push(extraTile);
    // 和了牌（ロンなら捨て牌、ツモなら直前にツモった牌）。待ちの形（平和の判定）に使う
    const winTile = extraTile || (seat === "bottom" ? lastDrawnTile : lastDrawnCpu[seat]);

    // 国士無双（役満）：1・9の数牌6種類＋字牌7種類、計13種類のうちどれか1種類が2枚、残り12種類が1枚ずつ
    function buildKokushiResult(){
      if(melds[seat].length !== 0 || concealed.length !== 14) return null;
      const kokushiKeys = [
        "man_1", "man_9", "pin_1", "pin_9", "sou_1", "sou_9",
        "wind_1", "wind_2", "wind_3", "wind_4", "dragon_1", "dragon_2", "dragon_3"
      ];
      const counts = countTiles(concealed);
      const keys = Object.keys(counts);
      if(!keys.every(k => kokushiKeys.includes(k))) return null;
      if(keys.length !== 13) return null;
      const values = Object.values(counts);
      if(!(values.filter(c => c === 2).length === 1 && values.every(c => c === 1 || c === 2))) return null;
      const yaku = [{ name:"国士無双", han:13 }];
      const akaCount = countAka(concealed);
      const base = calcBasePoints(13);
      return { seat, yaku, han:13, base, isTsumo, akaCount };
    }

    // 七対子（2翻）：対子が7組（同じ牌を4枚使って2組にするのも可）、かつ門前のみ
    function buildChiitoitsuResult(){
      if(melds[seat].length !== 0 || concealed.length !== 14) return null;
      const counts = countTiles(concealed);
      const values = Object.values(counts);
      const allEven = values.every(c => c % 2 === 0);
      const totalPairs = values.reduce((sum, c) => sum + c / 2, 0);
      if(!allEven || totalPairs !== 7) return null;

      // 連七対（役満）：同じ色の7つの連続した数字が、ちょうど2枚ずつの対子になっている（4枚使いは不可）
      const keys = Object.keys(counts);
      let isRenchitoi = false;
      if(keys.length === 7 && keys.every(k => counts[k] === 2)){
        const tiles7 = keys.map(keyToTile);
        const suit0 = tiles7[0].suit;
        if(tiles7.every(t => t.suit === suit0)){
          const nums = tiles7.map(t => t.num).sort((a, b) => a - b);
          isRenchitoi = nums.every((n, i) => i === 0 || n === nums[i - 1] + 1);
        }
      }

      // 緑一色の七対子・4枚使い（役満）：全て緑の牌で、いずれかの牌を4枚（2組扱い）使っている
      const isGreenFourTileChiitoi = concealed.every(isGreenTile) && keys.some(k => counts[k] === 4);

      // 紅孔雀の七対子（役満、4枚使いも可）：全て索子1・5・7・9と中だけ
      const isHongKongqueChiitoi = concealed.every(isHongKongqueTile);

      // 花鳥風月雪の七対子（役満、4枚使いも可）：全て筒子5・筒子1・索子1・風牌・白だけ
      const isKachoFugetsuYukiChiitoi = concealed.every(isKachoFugetsuYukiTile);

      // 百万石の七対子（役満、4枚使いも可）：萬子の数字の合計が100以上
      const isHyakumangokuChiitoi = manNumberSum(concealed) >= 100;

      let yaku;
      if(isGreenFourTileChiitoi) yaku = [{ name:"緑一色（七対子四枚使い）", han:13 }];
      else if(isHongKongqueChiitoi) yaku = [{ name:"紅孔雀", han:13 }];
      else if(isKachoFugetsuYukiChiitoi) yaku = [{ name:"花鳥風月雪", han:13 }];
      else if(isHyakumangokuChiitoi) yaku = [{ name:"百万石", han:13 }];
      else if(isRenchitoi) yaku = [{ name:"連七対", han:13 }];
      else yaku = [{ name:"七対子", han:2 }];
      if(isTsumo) yaku.push({ name:"門前清自摸和", han:1 });
      if(hasAllFiveSuits(concealed)) yaku.push({ name:"五門斉", han:1 });
      if(concealed.every(isToibudaoTile)) yaku.push({ name:"推不倒", han:2 });
      if(concealed.every(isXiaoYuWuTile)) yaku.push({ name:"小于五", han:2 });
      if(concealed.every(isDaYuWuTile)) yaku.push({ name:"大于五", han:2 });
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, concealed, seat);
      const akaCount = countAka(concealed);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    // 同じ牌の並びでも「刻子優先」「順子優先」で解釈が分かれることがあるため
    // （例：111222333は三連刻にも一色三順にもなり得る）、両方試して翻数が高い方を採用する
    function buildStandardResult(preferSequence){
      const decomp = findDecomposition(concealed, preferSequence);
      if(!decomp) return null;
      const pairTile = keyToTile(decomp.pairKey);
      const allSets = [...decomp.sets, ...meldsToSets(seat)];
      if(allSets.length !== 4) return null;
      const yaku = computeYaku(seat, allSets, pairTile, isTsumo, decomp, winTile);
      const allTiles = [...concealed, ...meldsToSets(seat).flatMap(s => s.tiles)];
      const akaCount = countAka(allTiles);
      if(yaku.length === 0){
        const indicatorDoraCount = countDoraDetail(allTiles);
        return { seat, yaku: [], han: 0, isTsumo, akaCount, yakunashi: true, indicatorDoraCount };
      }
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, allTiles, seat);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    function buildZuheLongResult(){
      const zDecomp = findZuheLongDecomposition(seat, concealed);
      if(!zDecomp) return null;
      const pairTile = keyToTile(zDecomp.pairKey);
      const allSets = [...zDecomp.threadSets, ...zDecomp.extraSets, ...meldsToSets(seat)];
      if(allSets.length !== 4) return null;
      const pseudoDecomp = { sets: zDecomp.extraSets };
      const yaku = computeYaku(seat, allSets, pairTile, isTsumo, pseudoDecomp, winTile, zDecomp.threadSets);
      yaku.push({ name:"組合龍", han: melds[seat].length === 0 ? 2 : 1 });
      const allTiles = [...concealed, ...meldsToSets(seat).flatMap(s => s.tiles)];
      const akaCount = countAka(allTiles);
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, allTiles, seat);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    function buildZuheTongshunResult(){
      const zDecomp = findZuheTongshunDecomposition(seat, concealed);
      if(!zDecomp) return null;
      const pairTile = keyToTile(zDecomp.pairKey);
      const allSets = [...zDecomp.threadSets, ...zDecomp.extraSets, ...meldsToSets(seat)];
      if(allSets.length !== 4) return null;
      const pseudoDecomp = { sets: zDecomp.extraSets };
      const yaku = computeYaku(seat, allSets, pairTile, isTsumo, pseudoDecomp, winTile, zDecomp.threadSets);
      yaku.push({ name:"組合同順", han: melds[seat].length === 0 ? 2 : 1 });
      const allTiles = [...concealed, ...meldsToSets(seat).flatMap(s => s.tiles)];
      const akaCount = countAka(allTiles);
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, allTiles, seat);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    const candidates = [buildKokushiResult(), buildChiitoitsuResult(), buildStandardResult(false), buildStandardResult(true), buildZuheLongResult(), buildZuheTongshunResult()].filter(Boolean);
    if(candidates.length === 0) return null;
    return candidates.reduce((best, r) => (r.han > best.han ? r : best));
  }

  // テンパイ判定（役の有無は問わない、形式テンパイ）：34種類の牌を1枚ずつ仮に加えてみて、
  // どれか1つでも和了の形になれば（役なし和了も可の本ルールでは attemptWin が非nullを返せば）テンパイとする
  function isTenpai(seat){
    return ALL_TILE_TYPES.some(t => attemptWin(seat, t, true) !== null);
  }

  function settleTsumo(winnerSeat, base){
    const isDealer = winnerSeat === DEALER_SEAT;
    const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
    let total = 0;
    others.forEach(s => {
      const pay = isDealer
        ? Math.ceil(base * 2 / 100) * 100
        : (s === DEALER_SEAT ? Math.ceil(base * 2 / 100) * 100 : Math.ceil(base / 100) * 100);
      scores[s] -= pay;
      total += pay;
    });
    scores[winnerSeat] += total;
  }

  function settleRon(winnerSeat, loserSeat, base){
    const isDealer = winnerSeat === DEALER_SEAT;
    const pay = Math.ceil(base * (isDealer ? 6 : 4) / 100) * 100;
    scores[loserSeat] -= pay;
    scores[winnerSeat] += pay;
  }

  // 役満（13翻以上）は通常の計算式ではなく、親48,000点・子32,000点の固定点数にする
  function settleYakumanTsumo(winnerSeat){
    const isDealer = winnerSeat === DEALER_SEAT;
    const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
    let total = 0;
    others.forEach(s => {
      const pay = isDealer ? 16000 : (s === DEALER_SEAT ? 16000 : 8000);
      scores[s] -= pay;
      total += pay;
    });
    scores[winnerSeat] += total;
  }

  function settleYakumanRon(winnerSeat, loserSeat){
    const isDealer = winnerSeat === DEALER_SEAT;
    const pay = isDealer ? 48000 : 32000;
    scores[loserSeat] -= pay;
    scores[winnerSeat] += pay;
  }

  // 赤牌ボーナス：ドラ扱いにせず、1枚につき2,000点の直接ボーナス（親でも子でも同額）
  // ツモなら3人からそれぞれ2,000点（合計6,000点）、ロンなら相手から2,000点
  function settleAkaBonus(winnerSeat, loserSeat, akaCount, isTsumo){
    if(!akaCount) return 0;
    if(isTsumo){
      const perOpponent = akaCount * 2000;
      const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
      others.forEach(s => { scores[s] -= perOpponent; });
      const total = perOpponent * others.length;
      scores[winnerSeat] += total;
      return total;
    } else {
      const amount = akaCount * 2000;
      scores[loserSeat] -= amount;
      scores[winnerSeat] += amount;
      return amount;
    }
  }

  // 役なし和了の精算（簡易ルール）：子1,000点・親1,500点を基準に、
  // ドラは基準と同じ単位（子1,000点/親1,500点）で1枚ごとに加算、
  // 赤牌は親子問わず1枚につき1,000点。ツモなら3人からそれぞれ同額を受け取る
  function settleYakunashi(winnerSeat, loserSeat, indicatorDoraCount, akaCount, isTsumo){
    const isDealer = winnerSeat === DEALER_SEAT;
    const unitRate = isDealer ? 1500 : 1000;
    const perShare = unitRate * (1 + indicatorDoraCount) + akaCount * 1000;
    if(isTsumo){
      const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
      others.forEach(s => { scores[s] -= perShare; });
      const total = perShare * others.length;
      scores[winnerSeat] += total;
      return total;
    } else {
      scores[loserSeat] -= perShare;
      scores[winnerSeat] += perShare;
      return perShare;
    }
  }

  // 流局時のテンパイ料精算：ノーテンの人がテンパイの人それぞれに1,000点ずつ払う
  function settleRyuukyoku(tenpaiSeats, notenSeats){
    if(tenpaiSeats.length === 0 || notenSeats.length === 0) return;
    const gainEach = 1000 * notenSeats.length;
    const lossEach = 1000 * tenpaiSeats.length;
    tenpaiSeats.forEach(s => { scores[s] += gainEach; });
    notenSeats.forEach(s => { scores[s] -= lossEach; });
  }

  function showRyuukyokuResult(tenpaiSeats, notenSeats){
    const box = document.getElementById("resultBox");
    box.style.display = "block";
    const tenpaiText = tenpaiSeats.length > 0 ? tenpaiSeats.map(s => seatLabel[s]).join("・") + "：テンパイ" : "テンパイ：なし";
    const notenText = notenSeats.length > 0 ? notenSeats.map(s => seatLabel[s]).join("・") + "：ノーテン" : "ノーテン：なし";
    box.innerHTML =
      `<div class="result-title">流局</div>` +
      `<div class="result-yaku">${tenpaiText}</div>` +
      `<div class="result-yaku">${notenText}</div>`;
  }

  // 山が尽きた（誰もツモれなくなった）ときの流局処理
  // ※この段階では親交代・連荘・半荘進行は行わず、ここでゲームを終了する
  function handleRyuukyoku(){
    gameEnded = true;
    const seats = ["bottom", "right", "top", "left"]; // あなた・下家・対面・上家の順で表示する
    const tenpaiSeats = seats.filter(isTenpai);
    const notenSeats = seats.filter(s => !tenpaiSeats.includes(s));
    settleRyuukyoku(tenpaiSeats, notenSeats);
    renderScores();
    showRyuukyokuResult(tenpaiSeats, notenSeats);
    setTurnIndicator("");
    hideCallPrompt();
    renderMyHand(false);
  }

  function showResult(seat, result, loserSeat, bonusTotal){
    const box = document.getElementById("resultBox");
    box.style.display = "block";
    const title = result.isTsumo ? (seatLabel[seat] + "のツモ") : (seatLabel[seat] + "のロン（" + seatLabel[loserSeat] + "から）");

    if(result.yakunashi){
      const parts = [];
      if(result.indicatorDoraCount > 0) parts.push("ドラ" + result.indicatorDoraCount + "枚");
      if(result.akaCount > 0) parts.push("赤牌" + result.akaCount + "枚");
      const subText = "役なし和了" + (parts.length ? "（" + parts.join("・") + "）" : "");
      box.innerHTML =
        `<div class="result-title">${title}</div>` +
        `<div class="result-yaku">${subText}</div>` +
        `<div class="result-score">＋${bonusTotal}点</div>`;
      return;
    }

    const yakuText = result.yaku.map(y => y.name + " " + y.han + "翻").join("　");
    const akaText = bonusTotal > 0
      ? `<div class="result-yaku">赤牌ボーナス（${result.akaCount}枚）＋${bonusTotal}点</div>`
      : "";
    box.innerHTML =
      `<div class="result-title">${title}</div>` +
      `<div class="result-yaku">${yakuText}</div>` +
      akaText +
      `<div class="result-score">${result.han}翻</div>`;
  }

  function finalizeWin(winnerSeat, loserSeat, result){
    gameEnded = true;
    let bonusTotal;
    if(result.yakunashi){
      bonusTotal = settleYakunashi(winnerSeat, loserSeat, result.indicatorDoraCount, result.akaCount, result.isTsumo);
    } else if(result.han >= 13){
      if(result.isTsumo) settleYakumanTsumo(winnerSeat);
      else settleYakumanRon(winnerSeat, loserSeat);
      bonusTotal = settleAkaBonus(winnerSeat, loserSeat, result.akaCount, result.isTsumo);
    } else {
      if(result.isTsumo) settleTsumo(winnerSeat, result.base);
      else settleRon(winnerSeat, loserSeat, result.base);
      bonusTotal = settleAkaBonus(winnerSeat, loserSeat, result.akaCount, result.isTsumo);
    }
    if(riichiSticks > 0 && riichiDeclared[winnerSeat]){
      scores[winnerSeat] += riichiSticks * 1000;
      riichiSticks = 0;
      updateKyotakuDisplay();
    }
    renderScores();
    showResult(winnerSeat, result, loserSeat, bonusTotal);
    setTurnIndicator("");
    hideCallPrompt();
    renderMyHand(false);
  }

  // 下段の「和了」ボタンはツモとロンを兼ねる。
  // ロン待ち（pendingRon）があればそれを優先。無ければ、今まさに牌を引いた直後
  // （lastDrawnTileがある間）だけツモの成立を判定する。それ以外（鳴いた直後の打牌待ちや
  // 打牌した直後など）は判定を待たずに常に無効化する。
  function updateWinButton(){
    const btn = document.getElementById("winBtn");
    if(gameEnded){
      btn.disabled = true;
      btn.onclick = null;
      return;
    }
    if(pendingRon){
      const ron = pendingRon; // hideCallPrompt()がpendingRonをnullにする前にクロージャで確保しておく
      btn.disabled = false;
      btn.onclick = () => { hideCallPrompt(); finalizeWin("bottom", ron.discarderSeat, ron.result); };
      return;
    }
    if(!lastDrawnTile){
      btn.disabled = true;
      btn.onclick = null;
      return;
    }
    const result = attemptWin("bottom", null, true);
    if(result){
      btn.disabled = false;
      btn.onclick = () => finalizeWin("bottom", "bottom", result);
    } else {
      btn.disabled = true;
      btn.onclick = null;
    }
  }

  // 下段の「スルー」ボタン：他家の捨て牌に対する鳴きプロンプトが開いている間だけ有効にする
  // （鳴きプロンプト側の「スルー」ボタンは廃止し、こちらに一本化した）
  function updateThroughButton(){
    const btn = document.getElementById("throughBtn");
    if(gameEnded || !pendingCallContext){
      btn.disabled = true;
      btn.onclick = null;
      return;
    }
    const ctx = pendingCallContext; // hideCallPrompt()がクリアする前にクロージャで確保しておく
    btn.disabled = false;
    btn.onclick = () => { hideCallPrompt(); advanceTurnAfterDiscard(ctx.discarderSeat); };
  }

  function updateActionButtons(){
    updateWinButton();
    updateThroughButton();
  }


  renderMyHand(true);
  renderCpuHandBacks("top");
  renderCpuHandBacks("left");
  renderCpuHandBacks("right");
  updateActionButtons();
  captureWallBandFullSize();
  updateWallBands();
  setTurnIndicator("あなたの番です（牌をタップして捨ててください）");

  // ドラ表示牌・リーチドラ表示牌（王牌の先頭2枚を表向きにする。以降は一切めくらない）
  const doraIndicator = deadWall[0];
  const riichiDoraIndicator = deadWall[1];
  const doraTileEl = document.getElementById("doraTile");
  doraTileEl.className = "tile dora-tile " + tileClass(doraIndicator.suit, doraIndicator.num);
  doraTileEl.innerHTML = tileEl(doraIndicator.suit, doraIndicator.num, "", doraIndicator.red).innerHTML;
  const riichiDoraTileEl = document.getElementById("riichiDoraTile");
  riichiDoraTileEl.className = "tile dora-tile riichi-dora-tile " + tileClass(riichiDoraIndicator.suit, riichiDoraIndicator.num);
  riichiDoraTileEl.innerHTML = tileEl(riichiDoraIndicator.suit, riichiDoraIndicator.num, "", riichiDoraIndicator.red).innerHTML;

  updateWallCount();
  renderScores();
  updateKyotakuDisplay();
</script>
