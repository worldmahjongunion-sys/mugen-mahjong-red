    const next = NEXT_SEAT[discarderSeat];
    if(next === "bottom"){
      playerDraw();
    } else {
      setTimeout(() => cpuDrawAndDiscard(next), 550);
    }
  }

  function cpuDrawAndDiscard(seat){
    if(gameEnded) return;
    if(wall.length === 0){
      handleRyuukyoku();
      return;
    }
    furitenTemp[seat] = false; // 同巡内フリテンは自分の次のツモで解除（リーチ後の永続フリテンは触らない）
    setTurnIndicator(seatLabel[seat] + "の番です");
    const drawn = wall.shift();
    hands[seat].push(drawn);
    lastDrawnCpu[seat] = drawn;
    updateWallCount();
    renderCpuHandBacks(seat);

    const tsumoResult = attemptWin(seat, null, true);
    if(tsumoResult){
      finalizeWin(seat, seat, tsumoResult);
      return;
    }

    // CPUの暗槓（簡易AI：4枚揃っていれば必ず暗槓する。rinshanAvailable()が通算カン4回の上限を管理する）
    const ankanTile = findAnkanTile(hands[seat]);
    if(ankanTile && rinshanAvailable()){
      executeCpuAnkan(seat, ankanTile);
      return;
    }

    setTimeout(() => cpuChooseAndDiscard(seat), 500);
  }

  function cpuChooseAndDiscard(seat){
    if(gameEnded) return;
    const idx = Math.floor(Math.random() * hands[seat].length);
    const discarded = hands[seat].splice(idx, 1)[0];
    discards[seat].push(discarded);
    discardHistory[seat].push(tileKey(discarded));
    lastDrawnCpu[seat] = null;
    renderCpuHandBacks(seat);
    renderDiscard(seat);
    handleDiscard(seat, discarded);
  }

  function executeCpuAnkan(seat, tile){
    ippatsuActive = false; // 誰の暗槓であっても鳴きなので一発は消える
    const hand = hands[seat];
    const removed = [];
    for(let i = hand.length - 1; i >= 0 && removed.length < 4; i--){
      if(hand[i].suit === tile.suit && hand[i].num === tile.num){
        removed.push(hand.splice(i, 1)[0]);
      }
    }
    melds[seat].push({ type:"ankan", handTiles: removed });
    renderMelds(seat);

    // 嶺上牌をツモる（山からの補充はしない）
    const rinshan = deadWall.pop();
    updateRinshanVisual();
    hand.push(rinshan);
    lastDrawnCpu[seat] = rinshan;
    renderCpuHandBacks(seat);
    setTurnIndicator(seatLabel[seat] + "が暗槓しました");

    const rinshanWin = attemptWin(seat, null, true);
    if(rinshanWin){
      finalizeWin(seat, seat, rinshanWin);
      return;
    }

    setTimeout(() => cpuChooseAndDiscard(seat), 500);
    fitTileSize();
  }

  function playerDraw(){
    if(gameEnded) return;
    if(wall.length === 0){
      handleRyuukyoku();
      return;
    }
    furitenTemp.bottom = false; // 同巡内フリテンは自分の次のツモで解除（リーチ後の永続フリテンは触らない）
    const drawn = wall.shift();
    myHandTiles.push(drawn);
    lastDrawnTile = drawn;
    updateWallCount();

    // リーチ確定後（宣言牌を切り終えた後）は自動ツモ切り。ただしツモ和了できる時は止めて選ばせる
    if(riichiDeclared.bottom && !awaitingRiichiDiscard.bottom){
      renderMyHand(true); // isRiichiWaitDiscardable()により手牌は全てクリック不可で描画される
      updateActionButtons(); // ツモ和了できるならここで和了ボタンが有効になる
      if(attemptWin("bottom", null, true)){
        setTurnIndicator("あなたの番です（ツモ！）");
        return;
      }
      setTurnIndicator("あなたの番です（リーチ中のため自動でツモ切りします）");
      // CPUの打牌と同じ間（500〜600ms）を置いてから、引いた牌をそのまま捨てる
      setTimeout(() => {
        if(gameEnded) return;
        // 折る②：ツモ和了できなかった＝この一巡での一発の権利は使い切ったので、
        // 打牌の結果を待たずこの打牌をもって先に失効させる（ツモ和了した場合はここに来ない）
        ippatsuActive = false;
        onDiscardMyTile(myHandTiles.indexOf(drawn));
      }, 550);
      return;
    }

    setTurnIndicator("あなたの番です（牌をタップして捨ててください）");
    updateSelfKanOpportunity(drawn);
    renderMyHand(true);
    updateActionButtons();
  }

  // --- 自摸カン（加槓・暗槓）の候補判定 ---
  // 独立したポップアップは出さず、下段の「カン」「スルー」ボタンを有効にする方式に変更。
  // 加槓：ポンした牌と同じ牌を自分でツモった時（drawnTile限定、既存仕様どおり）
  // 暗槓：鳴きを介さず、手牌だけで同じ牌が4枚揃っている時（手牌全体を毎回スキャン）
  // 両方が同時に成立することもあるため、候補は配列でまとめて返す
  function computeSelfKanCandidates(drawnTile){
    if(!rinshanAvailable()) return [];
    const list = [];
    if(drawnTile && !riichiDeclared.bottom){ // リーチ後は加槓不可
      const meldIdx = melds.bottom.findIndex(m => m.type === "pon" && m.calledTile.suit === drawnTile.suit && m.calledTile.num === drawnTile.num);
      if(meldIdx >= 0) list.push({ kind:"kakan", meldIdx, tile: drawnTile });
    }
    // リーチ後は「牌姿（面子の解釈）が変わらない暗槓のみ」に絞る（canAnkanAfterRiichi参照）。
    // リーチしていない時は従来通り、4枚揃っている種類を無条件に候補にする
    const ankanTiles = riichiDeclared.bottom
      ? findAllAnkanTiles(myHandTiles).filter(canAnkanAfterRiichi)
      : findAllAnkanTiles(myHandTiles);
    ankanTiles.forEach(tile => list.push({ kind:"ankan", tile }));
    return list;
  }

  // ツモの直後（またはカン後の嶺上ツモの直後）に呼び、pendingSelfKan/selfKanSelectingを更新する。
  // 呼び出し側はこの後で必ずupdateActionButtons()を呼び、カン・スルーボタンの表示に反映させること
  function updateSelfKanOpportunity(drawnTile){
    pendingSelfKan = null;
    selfKanSelecting = false;
    const candidates = computeSelfKanCandidates(drawnTile);
    if(candidates.length > 0) pendingSelfKan = { candidates };
  }

  // 下段の「カン」ボタン（自摸カン候補がある時）を押した時の処理。
  // 候補が1つだけならそのまま実行、2つ以上あれば手牌の該当牌をハイライトしてクリックで選ばせる
  function handleSelfKanButtonClick(){
    if(!pendingSelfKan || pendingSelfKan.candidates.length === 0) return;
    if(pendingSelfKan.candidates.length === 1){
      executeSelfKanCandidate(pendingSelfKan.candidates[0]);
    } else {
      selfKanSelecting = true;
      updateActionButtons();
      renderMyHand(true);
    }
  }

  // 自摸カンの選択中（selfKanSelecting）に、その牌が選択候補かどうか
  function isSelfKanSelectable(t){
    if(!selfKanSelecting || !pendingSelfKan) return false;
    return pendingSelfKan.candidates.some(c => c.tile.suit === t.suit && c.tile.num === t.num);
  }

  // 選択候補の牌がクリックされた時（selfKanSelecting中のみ有効）
  function onSelectSelfKanTile(t){
    if(!selfKanSelecting || !pendingSelfKan) return;
    const candidate = pendingSelfKan.candidates.find(c => c.tile.suit === t.suit && c.tile.num === t.num);
    if(candidate) executeSelfKanCandidate(candidate);
  }

  function executeSelfKanCandidate(candidate){
    pendingSelfKan = null;
    selfKanSelecting = false;
    if(candidate.kind === "kakan") executeKakan(candidate.meldIdx, candidate.tile);
    else executeAnkan(candidate.tile);
  }

  function executeAnkan(tile){
    ippatsuActive = false; // 自分自身の暗槓でも鳴きなので一発は消える（リーチ後の暗槓も対象）
    const removed = [];
    for(let i = myHandTiles.length - 1; i >= 0 && removed.length < 4; i--){
      if(myHandTiles[i].suit === tile.suit && myHandTiles[i].num === tile.num){
        removed.push(myHandTiles.splice(i, 1)[0]);
      }
    }
    melds.bottom.push({ type:"ankan", handTiles: removed });
    renderMelds("bottom");

    // 嶺上牌をツモる（山からの補充はしない）
    const rinshan = deadWall.pop();
    updateRinshanVisual();
    myHandTiles.push(rinshan);
    lastDrawnTile = rinshan;

    updateSelfKanOpportunity(rinshan); // 続けて引いた嶺上牌で新たに暗槓・加槓が成立する場合を拾う
    renderMyHand(true);
    setTurnIndicator("暗槓しました。捨てる牌をタップしてください");
    updateActionButtons();
    fitTileSize();
  }

  function executeKakan(meldIdx, drawnTile){
    ippatsuActive = false; // 既存meldの書き換えとはいえ加槓も鳴きなので一発は消える
    const meld = melds.bottom[meldIdx];
    const idx = myHandTiles.indexOf(drawnTile);
    if(idx >= 0) myHandTiles.splice(idx, 1);
    meld.type = "kan";
    meld.addedTile = drawnTile;
    renderMelds("bottom");

    // 嶺上牌をツモる（山からの補充はしない）
    const rinshan = deadWall.pop();
    updateRinshanVisual();
    myHandTiles.push(rinshan);
    lastDrawnTile = rinshan;

    updateSelfKanOpportunity(rinshan); // 続けて引いた嶺上牌で新たに暗槓・加槓が成立する場合を拾う
    renderMyHand(true);
    setTurnIndicator("加カンしました。捨てる牌をタップしてください");
    updateActionButtons();
    fitTileSize();
  }

  // ==================== STEP5: 和了判定・役・点数計算・流局処理 ====================
  // ※簡易実装です。リーチ・平和の待ちの形・ドラ以外の詳細な符計算は省略しています。

  let gameEnded = false;
  // 供託（リーチ棒）の本数。局をまたいで場に残り続け、その局でリーチして和了した人だけが総取りする
  // （リーチせずに和了しても供託には触れない。流局してもそのまま場に残る）
  let riichiSticks = savedMatchState ? savedMatchState.riichiSticks : 0;
  // 各自が今の局でリーチを宣言しているか。局の開始時に全員falseへリセットする
  let riichiDeclared = { bottom:false, top:false, left:false, right:false };
  // リーチ宣言後、まだ宣言牌（河で横向きにする1枚）を確定させていない席。宣言直後の次の打牌だけを狙い撃ちするためのワンショットフラグ
  let awaitingRiichiDiscard = { bottom:false, top:false, left:false, right:false };
  // リーチ宣言牌そのもの（discards[seat]内の同一オブジェクト参照）。renderDiscardでこの1枚だけ追加で90度回す
  let riichiDeclareTile = { bottom:null, top:null, left:null, right:null };
  // リーチ宣言時点で「切っても聴牌を保てる」と確定した牌の種類(suit+num)一覧。
  // awaitingRiichiDiscard中はこのリストに無い牌をクリックできないようにする
  let riichiValidDiscards = { bottom:[], top:[], left:[], right:[] };
  // 一発権（自分＝bottom専用。CPUはリーチしないためbottom以外は使わない）。
  // リーチ宣言牌を切った時にtrueにし、鳴きが入るか自分の次の打牌が終わったらfalseに戻す
  let ippatsuActive = false;
  const scores = savedMatchState
    ? { ...savedMatchState.scores }
    : { bottom: 35000, top: 35000, left: 35000, right: 35000 };
  // 半荘（8局固定・東場2周）の進行状態。savedMatchStateが無ければ東1局・0本場・自分が親から開始
  let kyokuNumber = savedMatchState ? savedMatchState.kyokuNumber : 1; // 1〜8（連番。東1〜8局として表示）
  let honba = savedMatchState ? savedMatchState.honba : 0;
  // ネームプレート（方角+名前+点数）は中央情報ボックスの中、各家の方角位置に置かれている
  const scoreElByName = {
    bottom: document.getElementById("scoreBottom"),
    top: document.getElementById("scoreTop"),
    left: document.getElementById("scoreLeft"),
    right: document.getElementById("scoreRight")
  };
  // リーチ表示用：各家のネームプレート本体（.riichiクラスを付け外しして光らせる）
  const nameplateElByName = {};
  Object.keys(scoreElByName).forEach(s => { nameplateElByName[s] = scoreElByName[s].closest(".nameplate"); });
  // DEALER_SEATはファイル冒頭（配牌処理の直前）で既に読み込み済み
  const ROUND_WIND = 1; // 場風は東のみ固定（東場を2周する半荘のため、南入はしない）
  // 自風は親を基準に東→南→西→北の順で決まる（NEXT_SEATの手番順＝親交代順と同じ並び）
  function computeSeatWind(dealerSeat){
    const winds = {};
    let seat = dealerSeat;
    for(let w = 1; w <= 4; w++){ winds[seat] = w; seat = NEXT_SEAT[seat]; }
    return winds;
  }
  const SEAT_WIND = computeSeatWind(DEALER_SEAT);

  function renderScores(){
    Object.keys(scores).forEach(s => { scoreElByName[s].textContent = scores[s]; });
    stabilizeCenterInfoCells();
  }

  // 上家・下家・対面のネームプレートはtransform:rotate()で向きを変えているだけなので、
  // セル自体のoffsetWidth/Heightは回転前（横書き）のままになる。90度回転する上家・下家は
  // 実測した幅と高さを入れ替えてセルに固定で入れ、回転後の見た目どおりの領域を確保する
  // （こうしておかないと.center-infoのグリッド列幅がずれてレイアウトが崩れる）。
  function stabilizeCenterInfoCells(){
    [["top", false], ["bottom", false], ["left", true], ["right", true]].forEach(([pos, swapped]) => {
      const cell = document.querySelector(".center-info > .ring-" + pos);
      const plate = cell.querySelector(".nameplate");
      cell.style.width = "";
      cell.style.height = "";
      const w = plate.offsetWidth, h = plate.offsetHeight;
      cell.style.width = (swapped ? h : w) + "px";
      cell.style.height = (swapped ? w : h) + "px";
    });
  }

  function updateKyotakuDisplay(){
    document.getElementById("kyotakuCount").textContent = "供託 " + riichiSticks + "本";
  }

  // 局表示（「東n局 m本場」）・各家の自風マーク・起家（＝その局の親）マークを、
  // 現在のkyokuNumber/honba/DEALER_SEAT/SEAT_WINDに合わせて描き直す
  const WIND_CHAR = { 1:"東", 2:"南", 3:"西", 4:"北" };
  function renderMatchHeader(){
    document.getElementById("roundText").textContent = "東" + kyokuNumber + "局 " + honba + "本場";
    // ハウスルール：親が一巡(東1〜4局＝表東場)したら南場にはせず、そのまま東5〜8局(裏東場)を
    // 続ける。起家マークの色で表/裏を区別する(赤=表東場、緑=裏東場)
    const isSecondLap = kyokuNumber > 4;
    Object.keys(nameplateElByName).forEach(seat => {
      const plate = nameplateElByName[seat];
      plate.querySelector(".wind-mark").textContent = WIND_CHAR[SEAT_WIND[seat]];
      const dealerMarkEl = plate.querySelector(".dealer-mark");
      dealerMarkEl.style.display = (seat === STARTING_DEALER_SEAT) ? "" : "none";
      dealerMarkEl.classList.toggle("second-lap", isSecondLap);
    });
  }

  function tileKey(t){ return t.suit + "_" + t.num; }
  function keyToTile(k){
    const idx = k.lastIndexOf("_");
    return { suit: k.slice(0, idx), num: parseInt(k.slice(idx + 1)) };
  }
  function countTiles(tiles){
    const counts = {};
    tiles.forEach(t => { const k = tileKey(t); counts[k] = (counts[k] || 0) + 1; });
    return counts;
  }

  // 手牌（面子）を三面子/順子+刻子に分解できるか（1つの分解例を返す）
  function decomposeMelds(counts, sets, preferSequence){
    // 常に「色→数字」の順で、残っている一番小さい牌から処理する
    // （順番がバラバラだと、既にある順子の途中の牌を先に拾ってしまい、正しい組み合わせを見落とすため）
    const sortedKeys = Object.keys(counts).sort((a, b) => {
      const ta = keyToTile(a), tb = keyToTile(b);
      if(ta.suit !== tb.suit) return ta.suit < tb.suit ? -1 : 1;
      return ta.num - tb.num;
    });
    let key = null;
    for(const k of sortedKeys){ if(counts[k] > 0){ key = k; break; } }
    if(!key) return true;
    const t = keyToTile(key);

    const tryTriplet = () => {
      if(counts[key] < 3) return false;
      counts[key] -= 3;
      sets.push({ type:"triplet", tiles:[t, t, t], open:false });
      if(decomposeMelds(counts, sets, preferSequence)) return true;
      sets.pop();
      counts[key] += 3;
      return false;
    };
    const trySequence = () => {
      if(!((t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num <= 7)) return false;
      const k2 = t.suit + "_" + (t.num + 1), k3 = t.suit + "_" + (t.num + 2);
      if(!((counts[k2] || 0) > 0 && (counts[k3] || 0) > 0)) return false;
      counts[key]--; counts[k2]--; counts[k3]--;
      sets.push({ type:"sequence", tiles:[t, keyToTile(k2), keyToTile(k3)], open:false });
      if(decomposeMelds(counts, sets, preferSequence)) return true;
      sets.pop();
      counts[key]++; counts[k2]++; counts[k3]++;
      return false;
    };

    if(preferSequence){
      if(trySequence()) return true;
      if(tryTriplet()) return true;
    } else {
      if(tryTriplet()) return true;
      if(trySequence()) return true;
    }
    return false;
  }

  function findDecomposition(concealedTiles, preferSequence){
    if(concealedTiles.length % 3 !== 2) return null;
    const counts = countTiles(concealedTiles);
    for(const k in counts){
      if(counts[k] >= 2){
        counts[k] -= 2;
        const sets = [];
        if(decomposeMelds(counts, sets, preferSequence)){
          return { pairKey: k, sets };
        }
        counts[k] += 2;
      }
    }
    return null;
  }

  // 面子の分解を1通りに絞らず、あり得るすべての組み合わせを列挙する版。
  // リーチ後の暗槓制限（対象牌がどの分解でも独立した暗刻として使われているか）の判定専用に使う。
  // 既存のdecomposeMeldsは最初に成立した1通りで打ち切るため流用できず、
  // ここでは毎回countsを複製して両方の枝（刻子/順子）を打ち切らずに探索する
  function decompositionSignature(pairKey, sets){
    const setSigs = sets.map(s => s.type + ":" + s.tiles.map(tileKey).sort().join(",")).sort();
    return pairKey + "#" + setSigs.join("|");
  }
  function decomposeMeldsAll(counts, sets, results, pairKey, seen){
    const sortedKeys = Object.keys(counts).sort((a, b) => {
      const ta = keyToTile(a), tb = keyToTile(b);
      if(ta.suit !== tb.suit) return ta.suit < tb.suit ? -1 : 1;
      return ta.num - tb.num;
    });
    let key = null;
    for(const k of sortedKeys){ if(counts[k] > 0){ key = k; break; } }
    if(!key){
      const sig = decompositionSignature(pairKey, sets);
      if(!seen.has(sig)){
        seen.add(sig);
        results.push({ pairKey, sets: sets.slice() });
      }
      return;
    }
    const t = keyToTile(key);

    if(counts[key] >= 3){
      const next = Object.assign({}, counts);
      next[key] -= 3;
      decomposeMeldsAll(next, [...sets, { type:"triplet", tiles:[t, t, t], open:false }], results, pairKey, seen);
    }
    if((t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num <= 7){
      const k2 = t.suit + "_" + (t.num + 1), k3 = t.suit + "_" + (t.num + 2);
      if((counts[k2] || 0) > 0 && (counts[k3] || 0) > 0){
        const next = Object.assign({}, counts);
        next[key] -= 1; next[k2] -= 1; next[k3] -= 1;
        decomposeMeldsAll(next, [...sets, { type:"sequence", tiles:[t, keyToTile(k2), keyToTile(k3)], open:false }], results, pairKey, seen);
      }
    }
  }
  // 標準形（4面子+雀頭）のあり得る分解をすべて返す（[{pairKey, sets}, ...]）。重複は除く
  function findAllDecompositions(concealedTiles){
    if(concealedTiles.length % 3 !== 2) return [];
    const baseCounts = countTiles(concealedTiles);
    const results = [];
    const seen = new Set();
    for(const k in baseCounts){
      if(baseCounts[k] >= 2){
        const counts = Object.assign({}, baseCounts);
        counts[k] -= 2;
        decomposeMeldsAll(counts, [], results, k, seen);
      }
    }
    return results;
  }

  // リーチ後の暗槓が許されるか：対象牌tileが手に4枚ある前提で、1枚除いた13枚に
  // 待ち牌それぞれを加えた和了形すべてを調べ、どの分解でもtileの3枚が独立した暗刻
  // （他の面子や雀頭に使われない）として現れる場合だけtrueにする。
  // リーチ後は必ず門前（鳴きは無いか暗槓のみ）なので、鳴き面子は考慮しない
  function canAnkanAfterRiichi(tile){
    const idx = myHandTiles.findIndex(t => t.suit === tile.suit && t.num === tile.num);
    if(idx < 0) return false; // 手牌に無い（呼び出し側の前提が崩れている異常系）
    const removed = myHandTiles.splice(idx, 1)[0]; // 1枚だけ除いて13枚にする（riichiValidDiscardTypesと同じやり方）

    const waits = getWaits("bottom"); // 13枚に対する待ち（getWaitsはhands[seat]＝myHandTilesを直接見る）

    let ok;
    if(waits.length === 0){
      ok = false; // 待ちが存在しない場合はfalse（異常系）
    } else {
      const tKey = tileKey(tile);
      ok = waits.every(w => {
        const hand14 = [...myHandTiles, w]; // 13枚＋待ち牌＝14枚の和了形
        const decomps = findAllDecompositions(hand14);
        // 標準形（4面子+雀頭）の分解が1つも無い場合はfalse。実在するケース：本ルールは
        // 七対子の「同じ牌4枚を2対子として使う」を認めているため、tileが4枚とも
        // 対子×2として七対子を構成し、標準形には一切分解できない手がありうる
        // （例：5m×4 + 1p1p+3p3p+5p5p+7p7p+9p9p）。この場合tileは独立した暗刻ではなく
        // 2組の対子として使われており、暗槓すると七対子の牌姿が崩れるため禁止が正しい
        if(decomps.length === 0) return false;
        return decomps.every(d => {
          if(d.pairKey === tKey) return false; // 雀頭に使われている＝独立した暗刻ではない
          const tripletCount = d.sets.filter(s => s.type === "triplet" && tileKey(s.tiles[0]) === tKey).length;
          const usedElsewhere = d.sets.some(s => s.type !== "triplet" && s.tiles.some(x => tileKey(x) === tKey));
          return tripletCount === 1 && !usedElsewhere;
        });
      });
    }

    myHandTiles.splice(idx, 0, removed); // 必ず元の14枚に戻す
    return ok;
  }

  function meldsToSets(seat){
    return melds[seat].map(m => {
      if(m.type === "ankan") return { type:"kan", tiles:[...m.handTiles], open:false };
      const type = m.type === "chi" ? "sequence" : (m.type === "kan" ? "kan" : "triplet");
      const tiles = [...m.handTiles, m.calledTile]; // スプレッドでコピー済み。元のm.handTiles/m.calledTileは書き換えない
      if(m.addedTile) tiles.push(m.addedTile);
      // チーは手牌2枚＋鳴いた牌の順で並んでいるため、鳴いた牌が真ん中や下端の数字だと
      // tiles[0]が「その順子の一番小さい牌」にならないことがある。三色同順など
      // s.tiles[0]を順子の起点として使う役判定が軒並み誤判定するため、必ず数字順に揃える
      // （renderMelds()は別経路でmelds[name]を直接参照するため、画面表示には影響しない）
      if(type === "sequence") tiles.sort((a, b) => a.num - b.num);
      return { type, tiles, open:true };
    });
  }

  // 役の判定（簡易版）
  // 和了牌が「両面待ち」で入ったかどうかを判定する（平和の条件のひとつ）
  // 嵌張（例：4・6待ちの5）、辺張（1・2待ちの3、8・9待ちの7）、単騎（雀頭待ち）は両面ではない
  function isRyanmenWait(decomp, winTile, threadSets){
    if(!winTile) return false;
    if(threadSets){
      // 組合龍の筋は順子として扱うため、筋の一部を埋めた場合は常に両面待ち扱いにする
      for(const s of threadSets){
        if(s.tiles.some(t => t.suit === winTile.suit && t.num === winTile.num)) return true;
      }
    }
    if(!decomp) return false;
    for(const s of decomp.sets){
      if(s.type !== "sequence") continue;
      if(s.tiles[0].suit !== winTile.suit) continue;
      const nums = s.tiles.map(t => t.num);
      const idx = nums.indexOf(winTile.num);
      if(idx === -1) continue;
      const a = nums[0];
      if(idx === 1) continue; // 真ん中＝嵌張なのでこの組み合わせは両面にならない
      if(idx === 0 && a + 2 !== 9) return true;  // 例外：8・9待ちの7は辺張
      if(idx === 2 && a !== 1) return true;      // 例外：1・2待ちの3は辺張
    }
    return false;
  }

  // 推不倒（トイプータオ）：上下逆さまにしても模様が同じに見える牌だけで作る役
  // 白（三元牌）、筒子1234589、索子245689 の14種類のみ使用
  const TOIBUDAO_KEYS = new Set([
    "dragon_1",
    "pin_1", "pin_2", "pin_3", "pin_4", "pin_5", "pin_8", "pin_9",
    "sou_2", "sou_4", "sou_5", "sou_6", "sou_8", "sou_9"
  ]);
  function isToibudaoTile(t){ return TOIBUDAO_KEYS.has(tileKey(t)); }

  // 小于五（ショウユウウー）：1〜4の数牌だけで作る役
  // 緑一色：索子2・3・4・6・8と發だけで作る役
  function isGreenTile(t){
    if(t.suit === "dragon" && t.num === 2) return true;
    if(t.suit === "sou" && [2, 3, 4, 6, 8].includes(t.num)) return true;
    return false;
  }

  // 紅孔雀：索子1・5・7・9と中の5種類だけで作る役（通常形・七対子どちらも可）
  const HONG_KONGQUE_KEYS = new Set(["sou_1", "sou_5", "sou_7", "sou_9", "dragon_3"]);
  function isHongKongqueTile(t){ return HONG_KONGQUE_KEYS.has(tileKey(t)); }

  // 花鳥風月雪：筒子5・筒子1・索子1・風牌（任意）・白の5種類だけで作る役（七対子も可）
  function isKachoFugetsuYukiTile(t){
    if(t.suit === "pin" && (t.num === 5 || t.num === 1)) return true;
    if(t.suit === "sou" && t.num === 1) return true;
    if(t.suit === "wind") return true;
    if(t.suit === "dragon" && t.num === 1) return true;
    return false;
  }

  // 百万石：萬子の数字の合計が100以上（役満）
  function manNumberSum(tiles){
    return tiles.filter(t => t.suit === "man").reduce((sum, t) => sum + t.num, 0);
  }

  function isXiaoYuWuTile(t){
    return (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num >= 1 && t.num <= 4;
  }

  // 全小（チェンショウ）：1〜3の数牌だけで作る役
  function isQuanXiaoTile(t){
    return (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num >= 1 && t.num <= 3;
  }

  // 大于五（ダーユウウー）：6〜9の数牌だけで作る役
  function isDaYuWuTile(t){
    return (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num >= 6 && t.num <= 9;
  }

  // 全大（チェンダー）：7〜9の数牌だけで作る役
  function isQuanDaTile(t){
    return (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num >= 7 && t.num <= 9;
  }

  // 全中（チェンチュン）：4〜6の数牌だけで作る役
  function isQuanZhongTile(t){
    return (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num >= 4 && t.num <= 6;
  }

  // 組合龍（ツーハーロン、三色筋一気通貫）：
  // 「1・4・7」「2・5・8」「3・6・9」の3つの筋を、萬子・筒子・索子それぞれ1色ずつに割り当てて使う。
  // 筋は順子として扱うため平和にもなり得るが、必ず面前で作る必要があり（チー不可）、
  // 鳴けるのは残りの1面子部分だけ。
  function permuteIndices(arr){
    if(arr.length <= 1) return [arr];
    const result = [];
    arr.forEach((v, i) => {
      const rest = [...arr.slice(0, i), ...arr.slice(i + 1)];
      permuteIndices(rest).forEach(p => result.push([v, ...p]));
    });
    return result;
  }

  function findZuheLongDecomposition(seat, concealed){
    if(melds[seat].length > 1) return null; // 鳴けるのは残り1面子分だけ
    const threadDefs = [[1, 4, 7], [2, 5, 8], [3, 6, 9]];
    const suits = ["man", "pin", "sou"];
    for(const perm of permuteIndices([0, 1, 2])){
      const counts = countTiles(concealed);
      let ok = true;
      for(let i = 0; i < 3 && ok; i++){
        const suit = suits[i];
        for(const n of threadDefs[perm[i]]){
          const k = suit + "_" + n;
          if((counts[k] || 0) < 1){ ok = false; break; }
          counts[k]--;
        }
      }
      if(!ok) continue;

      const remaining = [];
      for(const k in counts){
        for(let c = 0; c < counts[k]; c++) remaining.push(keyToTile(k));
      }
      const neededSets = 1 - melds[seat].length; // 鳴きが無ければ、あと1面子を門前で作る必要がある
      if(remaining.length !== neededSets * 3 + 2) continue;

      const decomp = findDecomposition(remaining, false);
      if(!decomp || decomp.sets.length !== neededSets) continue;

      const threadSets = suits.map((suit, i) => ({
        type:"sequence",
        tiles: threadDefs[perm[i]].map(n => ({ suit, num:n })),
        open:false,
        isThread:true
      }));
      return { pairKey: decomp.pairKey, extraSets: decomp.sets, threadSets };
    }
    return null;
  }

  // 組合同順（ツーハートンシュン、三色筋同順）：組合龍と同じ考え方だが、
  // 3色すべてに「同じ」筋（1・4・7／2・5・8／3・6・9のいずれか）を使う
  function findZuheTongshunDecomposition(seat, concealed){
    if(melds[seat].length > 1) return null; // 鳴けるのは残り1面子分だけ
    const threadDefs = [[1, 4, 7], [2, 5, 8], [3, 6, 9]];
    const suits = ["man", "pin", "sou"];
    for(const thread of threadDefs){
      const counts = countTiles(concealed);
      let ok = true;
      for(const suit of suits){
        for(const n of thread){
          const k = suit + "_" + n;
          if((counts[k] || 0) < 1){ ok = false; break; }
          counts[k]--;
        }
        if(!ok) break;
      }
      if(!ok) continue;

      const remaining = [];
      for(const k in counts){
        for(let c = 0; c < counts[k]; c++) remaining.push(keyToTile(k));
      }
      const neededSets = 1 - melds[seat].length;
      if(remaining.length !== neededSets * 3 + 2) continue;

      const decomp = findDecomposition(remaining, false);
      if(!decomp || decomp.sets.length !== neededSets) continue;

      const threadSets = suits.map(suit => ({
        type:"sequence",
        tiles: thread.map(n => ({ suit, num:n })),
        open:false,
        isThread:true
      }));
      return { pairKey: decomp.pairKey, extraSets: decomp.sets, threadSets };
    }
    return null;
  }

  function computeYaku(seat, allSets, pairTile, isTsumo, decomp, winTile, threadSets){
    const yaku = [];
    // 暗槓は鳴きを介さないため、それ以外の鳴き（ポン・チー・大明槓・加槓）が無ければ門前扱いのまま
    const closedHand = melds[seat].every(m => m.type === "ankan");
    const allTiles = [pairTile, pairTile, ...allSets.flatMap(s => s.tiles)];

    // リーチ：宣言した本人が和了した時のみ1翻。リーチは門前でしか宣言できないため、門前限定の条件は不要
    // （ダブルリーチは未実装）
    if(riichiDeclared[seat]) yaku.push({ name:"リーチ", han:1 });
    // 一発：CPUはリーチしないため自分（bottom）専用。ippatsuActiveは
    // リーチ宣言牌を切った時にtrue、鳴きが入るか自分の次の打牌が終わるとfalseになる
    if(riichiDeclared[seat] && seat === "bottom" && ippatsuActive) yaku.push({ name:"一発", han:1 });

    if(isTsumo && closedHand) yaku.push({ name:"門前清自摸和", han:1 });

    // 全帯五（チェンタイウー）：全ての面子＋雀頭に、萬子5・筒子5・索子5のいずれかが1枚以上含まれている
    // （門前2翻・鳴き1翻。必ずタンヤオ形になるため、タンヤオとは複合させない）
    const hasFive = t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num === 5;
    const isChantaiwu = hasFive(pairTile) && allSets.every(s => s.tiles.some(hasFive));
    if(isChantaiwu) yaku.push({ name:"全帯五", han: closedHand ? 2 : 1 });

    // 全双刻（チェンシュワンクー）：偶数の牌だけで成立した対々和（対々和と複合、2翻。必ずタンヤオ形になるため、タンヤオとは複合させない）
    const isEven = t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num % 2 === 0;
    const isToitoi = allSets.every(s => s.type === "triplet" || s.type === "kan");
    const isChuanshuangku = isToitoi && isEven(pairTile) && allSets.every(s => isEven(s.tiles[0]));
    if(isChuanshuangku) yaku.push({ name:"全双刻", han:2 });

    // 全中（チェンチュン）：4〜6の数牌だけで作る（門前3翻・鳴き2翻。タンヤオとは複合しない。全帯五とは複合する）
    const isQuanZhong = allTiles.every(isQuanZhongTile);
    if(isQuanZhong) yaku.push({ name:"全中", han: closedHand ? 3 : 2 });

    const isSimple = t => t.num !== 1 && t.num !== 9 && t.suit !== "wind" && t.suit !== "dragon";
    if(!isChantaiwu && !isChuanshuangku && !isQuanZhong && allTiles.every(isSimple)) yaku.push({ name:"断幺九", han:1 });

    allSets.forEach(s => {
      if(s.type === "triplet" || s.type === "kan"){
        const t = s.tiles[0];
        if(t.suit === "dragon") yaku.push({ name:"役牌（三元牌）", han:1 });
        if(t.suit === "wind" && t.num === SEAT_WIND[seat]) yaku.push({ name:"役牌（自風）", han:1 });
        if(t.suit === "wind" && t.num === ROUND_WIND) yaku.push({ name:"役牌（場風）", han:1 });
      }
    });

    if(allSets.every(s => s.type === "triplet" || s.type === "kan")) yaku.push({ name:"対々和", han:2 });

    // 大四喜・小四喜：風牌4種類のうち3つ以上を刻子/槓子として使っている（役満）。三風刻の上位役なので複合しない
    {
      const windNums = new Set();
      allSets.forEach(s => {
        if((s.type === "triplet" || s.type === "kan") && s.tiles[0].suit === "wind") windNums.add(s.tiles[0].num);
      });
      if(windNums.size === 4){
        yaku.push({ name:"大四喜", han:13 });
      } else if(windNums.size === 3 && pairTile.suit === "wind"){
        yaku.push({ name:"小四喜", han:13 });
      } else if(windNums.size >= 3){
        yaku.push({ name:"三風刻", han:2 });
      }
    }

    // 大三元・小三元：三元牌3種類のうち刻子/槓子にした数
    {
      const dragonNums = new Set();
      allSets.forEach(s => {
        if((s.type === "triplet" || s.type === "kan") && s.tiles[0].suit === "dragon") dragonNums.add(s.tiles[0].num);
      });
      if(dragonNums.size === 3){
        yaku.push({ name:"大三元", han:13 });
      } else if(dragonNums.size === 2 && pairTile.suit === "dragon"){
        yaku.push({ name:"小三元", han:2 });
      }
    }

    // 字一色：字牌だけで作る（役満）
    if(allTiles.every(t => t.suit === "wind" || t.suit === "dragon")) yaku.push({ name:"字一色", han:13 });

    // 清老頭：1・9の数牌だけで作る（役満）
    if(allTiles.every(t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && (t.num === 1 || t.num === 9))){
      yaku.push({ name:"清老頭", han:13 });
    }

    // 混老頭：1・9・字牌だけで作る（2翻）
    if(allTiles.every(t => t.num === 1 || t.num === 9 || t.suit === "wind" || t.suit === "dragon")){
      yaku.push({ name:"混老頭", han:2 });
    }

    // 緑一色：索子2・3・4・6・8と發だけで作る（役満）
    if(allTiles.every(isGreenTile)) yaku.push({ name:"緑一色", han:13 });

    // 三色同刻：同じ数字の刻子/槓子が萬子・筒子・索子それぞれにある（3翻）
    {
      const bySuit = { man:new Set(), pin:new Set(), sou:new Set() };
      allSets.forEach(s => {
        if((s.type === "triplet" || s.type === "kan") && bySuit[s.tiles[0].suit]) bySuit[s.tiles[0].suit].add(s.tiles[0].num);
      });
      let hasSanshokuDouko = false;
      for(let n = 1; n <= 9; n++){
        if(bySuit.man.has(n) && bySuit.pin.has(n) && bySuit.sou.has(n)){ hasSanshokuDouko = true; break; }
      }
      if(hasSanshokuDouko) yaku.push({ name:"三色同刻", han:3 });
    }

    // 三色同順：同じ数字の順子が萬子・筒子・索子それぞれにある（門前2翻・鳴き1翻）
    {
      const seqStartsBySuit3 = { man:new Set(), pin:new Set(), sou:new Set() };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        if(seqStartsBySuit3[s.tiles[0].suit]) seqStartsBySuit3[s.tiles[0].suit].add(s.tiles[0].num);
      });
      for(let n = 1; n <= 7; n++){
        if(seqStartsBySuit3.man.has(n) && seqStartsBySuit3.pin.has(n) && seqStartsBySuit3.sou.has(n)){
          yaku.push({ name:"三色同順", han: closedHand ? 2 : 1 });
          break;
        }
      }
    }

    // 三槓子：槓子が3組以上ある（3翻）
    if(allSets.filter(s => s.type === "kan").length >= 3) yaku.push({ name:"三槓子", han:3 });

    // 花鳥風月雪（役満）：筒子5・索子1・風牌（任意）・筒子1を刻子/槓子にし、雀頭を白にする。
    // 花鳥風月の上位役なので複合しない
    {
      const hasTripletOf = (suit, num) => allSets.some(s =>
        (s.type === "triplet" || s.type === "kan") && s.tiles[0].suit === suit && (num === undefined || s.tiles[0].num === num)
      );
      const isKachoFugetsuYuki = hasTripletOf("pin", 5) && hasTripletOf("sou", 1) && hasTripletOf("wind") &&
        hasTripletOf("pin", 1) && pairTile.suit === "dragon" && pairTile.num === 1;
      if(isKachoFugetsuYuki){
        yaku.push({ name:"花鳥風月雪", han:13 });
      } else if(hasTripletOf("pin", 5) && hasTripletOf("sou", 1) && hasTripletOf("wind") && hasTripletOf("pin", 1)){
        yaku.push({ name:"花鳥風月", han:2 });
      }
    }

    // 紅孔雀：索子1・5・7・9と中の5種類だけで作る（役満、鳴きも可）
    if(allTiles.every(isHongKongqueTile)) yaku.push({ name:"紅孔雀", han:13 });

    // 百万石：萬子の数字の合計が100以上（役満）
    if(manNumberSum(allTiles) >= 100) yaku.push({ name:"百万石", han:13 });

    // 一色双龍会（イーソシュワンロンフィー）：1色だけで123の順子2組・789の順子2組・雀頭を作る（役満、鳴きも可）
    let hasYisSeShuangLong = false;
    {
      const suits = ["man", "pin", "sou"];
      for(const suit of suits){
        const seqStarts = allSets.filter(s => s.type === "sequence" && s.tiles[0].suit === suit).map(s => s.tiles[0].num);
        const has123x2 = seqStarts.filter(n => n === 1).length >= 2;
        const has789x2 = seqStarts.filter(n => n === 7).length >= 2;
        if(has123x2 && has789x2 && pairTile.suit === suit){
          yaku.push({ name:"一色双龍会", han:13 });
          hasYisSeShuangLong = true;
          break;
        }
      }
    }

    const suitsUsed = new Set(allTiles.filter(t => t.suit === "man" || t.suit === "pin" || t.suit === "sou").map(t => t.suit));
    const hasHonor = allTiles.some(t => t.suit === "wind" || t.suit === "dragon");
    if(!hasYisSeShuangLong && suitsUsed.size === 1){
      if(hasHonor) yaku.push({ name:"混一色", han: closedHand ? 3 : 2 });
      else yaku.push({ name:"清一色", han: closedHand ? 6 : 5 });
    }

    // 平和：門前・全部順子・雀頭が役牌でない・かつ「両面待ち」で和了した場合のみ成立する
    if(closedHand && allSets.every(s => s.type === "sequence")){
      const pairIsYakuhai = pairTile.suit === "dragon" ||
        (pairTile.suit === "wind" && (pairTile.num === SEAT_WIND[seat] || pairTile.num === ROUND_WIND));
      if(!pairIsYakuhai && isRyanmenWait(decomp, winTile, threadSets)) yaku.push({ name:"平和", han:1 });
    }

    // 一気通貫：同じ色で123・456・789が揃っている（鳴いていると1翻、門前なら2翻）
    {
      const seqStartsBySuit = { man:new Set(), pin:new Set(), sou:new Set() };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit;
        if(seqStartsBySuit[suit]) seqStartsBySuit[suit].add(s.tiles[0].num);
      });
      for(const suit of ["man", "pin", "sou"]){
        if(seqStartsBySuit[suit].has(1) && seqStartsBySuit[suit].has(4) && seqStartsBySuit[suit].has(7)){
          yaku.push({ name:"一気通貫", han: closedHand ? 2 : 1 });
          break;
        }
      }
    }

    // 純全帯么（ジュンチャン）・全帯幺（チャンタ）：全ての面子＋雀頭に幺九牌が1枚以上含まれている
    // 純全帯么は字牌を含まない（1・9のみ）、より厳しい形（鳴いても面前でも3翻）。成立時は全帯幺とは複合しない
    {
      const hasTerminalOnly = t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && (t.num === 1 || t.num === 9);
      const hasTerminalOrHonor = t => t.num === 1 || t.num === 9 || t.suit === "wind" || t.suit === "dragon";
      const isJunchan = hasTerminalOnly(pairTile) && allSets.every(s => s.tiles.some(hasTerminalOnly));
      if(isJunchan){
        yaku.push({ name:"純全帯么", han:3 });
      } else if(hasTerminalOrHonor(pairTile) && allSets.every(s => s.tiles.some(hasTerminalOrHonor))){
        yaku.push({ name:"全帯幺", han:2 });
      }
    }

    // 一色四歩高：同じ色の順子4組全てが、1枚ずつか2枚ずつずれた階段状になっている（門前4翻・鳴き3翻）
    // 一色三歩高の上位役なので、成立した場合は一色三歩高を複合させない
    let hasIsshokuSibuko = false;
    {
      const seqStartsBySuit4 = { man:[], pin:[], sou:[] };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit;
        if(seqStartsBySuit4[suit]) seqStartsBySuit4[suit].push(s.tiles[0].num);
      });
      for(const suit of ["man", "pin", "sou"]){
        const starts = seqStartsBySuit4[suit];
        if(starts.length < 4) continue;
        const sorted = starts.slice().sort((a, b) => a - b);
        const d1 = sorted[1] - sorted[0], d2 = sorted[2] - sorted[1], d3 = sorted[3] - sorted[2];
        if(d1 === d2 && d2 === d3 && (d1 === 1 || d1 === 2)){
          yaku.push({ name:"一色四歩高", han: closedHand ? 4 : 3 });
          hasIsshokuSibuko = true;
          break;
        }
      }
    }

    // 一色三歩高：同じ色の順子3組が、1枚ずつか2枚ずつずれた階段状になっている（門前2翻・鳴き1翻）
    if(!hasIsshokuSibuko){
      const seqStartsBySuit = { man:[], pin:[], sou:[] };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit;
        if(seqStartsBySuit[suit]) seqStartsBySuit[suit].push(s.tiles[0].num);
      });
      outer:
      for(const suit of ["man", "pin", "sou"]){
        const starts = seqStartsBySuit[suit];
        for(let i = 0; i < starts.length; i++){
          for(let j = i + 1; j < starts.length; j++){
            for(let k = j + 1; k < starts.length; k++){
              const trio = [starts[i], starts[j], starts[k]].sort((a, b) => a - b);
              const d1 = trio[1] - trio[0], d2 = trio[2] - trio[1];
              if(d1 === d2 && (d1 === 1 || d1 === 2)){
                yaku.push({ name:"一色三歩高", han: closedHand ? 2 : 1 });
                break outer;
              }
            }
          }
        }
      }
    }

    // 全帯三（チャンタイサン）：全ての面子＋雀頭に、萬子3・筒子3・索子3のいずれかが1枚以上含まれている（門前2翻・鳴き1翻、タンヤオと複合）
    {
      const hasThree = t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num === 3;
      if(hasThree(pairTile) && allSets.every(s => s.tiles.some(hasThree))){
        yaku.push({ name:"全帯三", han: closedHand ? 2 : 1 });
      }
    }

    // 全帯七（チャンタイチー）：全ての面子＋雀頭に、萬子7・筒子7・索子7のいずれかが1枚以上含まれている（門前2翻・鳴き1翻、タンヤオと複合）
    {
      const hasSeven = t => (t.suit === "man" || t.suit === "pin" || t.suit === "sou") && t.num === 7;
      if(hasSeven(pairTile) && allSets.every(s => s.tiles.some(hasSeven))){
        yaku.push({ name:"全帯七", han: closedHand ? 2 : 1 });
      }
    }

    // 三色双龍会（サンソーシュワンロンフィー）：3色のうち1色に123の順子2組、別の1色に789の順子2組、
    // 残りの1色で雀頭を作る（4翻、チーも可）。二盃口とは複合しない
    let hasSanshokuShuangLong = false;
    {
      const seqStartsBySuit = { man:[], pin:[], sou:[] };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        if(seqStartsBySuit[s.tiles[0].suit]) seqStartsBySuit[s.tiles[0].suit].push(s.tiles[0].num);
      });
      const suits = ["man", "pin", "sou"];
      for(const perm of permuteIndices([0, 1, 2])){
        const s123 = suits[perm[0]], s789 = suits[perm[1]], sPair = suits[perm[2]];
        const has123x2 = seqStartsBySuit[s123].filter(n => n === 1).length >= 2;
        const has789x2 = seqStartsBySuit[s789].filter(n => n === 7).length >= 2;
        if(has123x2 && has789x2 && pairTile.suit === sPair){
          yaku.push({ name:"三色双龍会", han:4 });
          hasSanshokuShuangLong = true;
          break;
        }
      }
    }

    // 一色四順：同じ色で全く同じ順子が4組揃っている（役満）。一色三順・一盃口の上位役なので複合しない
    let hasIsshokuSijun = false;
    {
      const seqCountsBySuit4 = {};
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit, start = s.tiles[0].num;
        const k = suit + "_" + start;
        seqCountsBySuit4[k] = (seqCountsBySuit4[k] || 0) + 1;
      });
      if(Object.values(seqCountsBySuit4).some(c => c >= 4)){
        yaku.push({ name:"一色四順", han:13 });
        hasIsshokuSijun = true;
      }
    }

    // 一盃口（門前限定）・二盃口（門前3翻・鳴き1翻）：同じ順子が2組以上あるか
    if(!hasSanshokuShuangLong && !hasIsshokuSijun && !hasYisSeShuangLong){
      const seqCounts = {};
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const k = s.tiles[0].suit + "_" + s.tiles[0].num;
        seqCounts[k] = (seqCounts[k] || 0) + 1;
      });
      const dupPairCount = Object.values(seqCounts).filter(c => c >= 2).length;
      if(dupPairCount >= 2) yaku.push({ name:"二盃口", han: closedHand ? 3 : 1 });
      else if(closedHand && dupPairCount === 1) yaku.push({ name:"一盃口", han:1 });
    }

    // 三色三連刻（萬子・筒子・索子それぞれに刻子/槓子が1組ずつあり、数字が3つ連続している）
    {
      const triplets = allSets.filter(s => s.type === "triplet" || s.type === "kan");
      const bySuit = { man:[], pin:[], sou:[] };
      triplets.forEach(s => {
        const suit = s.tiles[0].suit;
        if(bySuit[suit]) bySuit[suit].push(s.tiles[0].num);
      });
      if(bySuit.man.length === 1 && bySuit.pin.length === 1 && bySuit.sou.length === 1){
        const nums = [bySuit.man[0], bySuit.pin[0], bySuit.sou[0]].sort((a, b) => a - b);
        if(nums[1] === nums[0] + 1 && nums[2] === nums[1] + 1){
          yaku.push({ name:"三色三連刻", han:1 });
        }
      }

      // 四連刻：同じ色だけで数字が4つ連続した刻子/槓子（役満）。三連刻の上位役なので複合しない
      let hasSurenko = false;
      const bySuitSet = { man:new Set(bySuit.man), pin:new Set(bySuit.pin), sou:new Set(bySuit.sou) };
      outerSurenko:
      for(const suit of ["man", "pin", "sou"]){
        for(let n = 1; n <= 6; n++){
          if(bySuitSet[suit].has(n) && bySuitSet[suit].has(n + 1) && bySuitSet[suit].has(n + 2) && bySuitSet[suit].has(n + 3)){
            yaku.push({ name:"四連刻", han:13 });
            hasSurenko = true;
            break outerSurenko;
          }
        }
      }

      // 三連刻：同じ色だけで数字が3つ連続した刻子/槓子（例：111・222・333）が揃っている（2翻）
      if(!hasSurenko){
        outerSanrenko:
        for(const suit of ["man", "pin", "sou"]){
          for(let n = 1; n <= 7; n++){
            if(bySuitSet[suit].has(n) && bySuitSet[suit].has(n + 1) && bySuitSet[suit].has(n + 2)){
              yaku.push({ name:"三連刻", han:2 });
              break outerSanrenko;
            }
          }
        }
      }
    }

    // 三暗刻・四暗刻：門前で自分の手牌の中だけで揃えた刻子（ロンで完成した刻子は含まない）が3つ/4つ
    // 暗槓（鳴きを介さない槓子）も暗刻として数える。大明槓・加槓は open:true のため対象外
    {
      const ankouExcludedOnce = { used:false };
      let ankouCount = decomp ? decomp.sets.reduce((count, s) => {
        if(s.type !== "triplet") return count;
        if(!isTsumo && winTile && s.tiles[0].suit === winTile.suit && s.tiles[0].num === winTile.num && !ankouExcludedOnce.used){
          ankouExcludedOnce.used = true;
          return count;
        }
        return count + 1;
      }, 0) : 0;
      ankouCount += allSets.filter(s => s.type === "kan" && s.open === false).length;
      if(ankouCount >= 4) yaku.push({ name:"四暗刻", han:13 });
      else if(ankouCount === 3) yaku.push({ name:"三暗刻", han:2 });
    }

    // 一色三順：同じ色で全く同じ順子が3組揃っている（例：123・123・123）（2翻）
    if(!hasIsshokuSijun){
      const seqCountsBySuit = {};
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit, start = s.tiles[0].num;
        const k = suit + "_" + start;
        seqCountsBySuit[k] = (seqCountsBySuit[k] || 0) + 1;
      });
      if(Object.values(seqCountsBySuit).some(c => c >= 3)){
        yaku.push({ name:"一色三順", han:2 });
      }
    }

    // 花龍（ファーロン）：萬子・筒子・索子で123/456/789のブロックが1つずつ揃う（鳴いても1翻）
    {
      const seqStartsBySuit = { man:new Set(), pin:new Set(), sou:new Set() };
      allSets.forEach(s => {
        if(s.type !== "sequence") return;
        const suit = s.tiles[0].suit;
        if(seqStartsBySuit[suit]) seqStartsBySuit[suit].add(s.tiles[0].num);
      });
      const suits = ["man", "pin", "sou"];
      const blocks = [1, 4, 7];
      const permute = arr => arr.length <= 1 ? [arr] :
        arr.flatMap((v, i) => permute([...arr.slice(0, i), ...arr.slice(i + 1)]).map(p => [v, ...p]));
      const isKaryuu = permute(blocks).some(perm =>
        seqStartsBySuit[suits[0]].has(perm[0]) &&
        seqStartsBySuit[suits[1]].has(perm[1]) &&
        seqStartsBySuit[suits[2]].has(perm[2])
      );
      if(isKaryuu) yaku.push({ name:"花龍", han:1 });
    }

    // 五門斉（ウーメンチー）：萬子・筒子・索子・風牌・三元牌の5種類全てを使っている（鳴いても1翻）
    if(hasAllFiveSuits(allTiles)) yaku.push({ name:"五門斉", han:1 });

    // 推不倒（トイプータオ）：白・筒子1234589・索子245689だけで作る（門前2翻・鳴き1翻）
    if(allTiles.every(isToibudaoTile)) yaku.push({ name:"推不倒", han: closedHand ? 2 : 1 });

    // 全小（チェンショウ）：1〜3の数牌だけで作る（門前3翻・鳴き2翻）。小于五の上位役なので複合しない
    const isQuanXiao = allTiles.every(isQuanXiaoTile);
    if(isQuanXiao) yaku.push({ name:"全小", han: closedHand ? 3 : 2 });

    // 小于五（ショウユウウー）：1〜4の数牌だけで作る（門前2翻・鳴き1翻）
    if(!isQuanXiao && allTiles.every(isXiaoYuWuTile)) yaku.push({ name:"小于五", han: closedHand ? 2 : 1 });

    // 全大（チェンダー）：7〜9の数牌だけで作る（門前3翻・鳴き2翻）。大于五の上位役なので複合しない
    const isQuanDa = allTiles.every(isQuanDaTile);
    if(isQuanDa) yaku.push({ name:"全大", han: closedHand ? 3 : 2 });

    // 大于五（ダーユウウー）：6〜9の数牌だけで作る（門前2翻・鳴き1翻）
    if(!isQuanDa && allTiles.every(isDaYuWuTile)) yaku.push({ name:"大于五", han: closedHand ? 2 : 1 });

    // 組合龍（ツーハーロン、三色筋一気通貫）：門前2翻・鳴き1翻
    // 組合龍は専用の構造検出（findZuheLongDecomposition）側で判定し、ここでは扱わない

    // 雪月花（せつげっか）：白（雪）・1筒（月）・5筒（花）の刻子/槓子が揃っている（鳴いても1翻、白の役牌と複合）
    {
      const hasTripletOf = (suit, num) => allSets.some(s =>
        (s.type === "triplet" || s.type === "kan") && s.tiles[0].suit === suit && s.tiles[0].num === num
      );
      if(hasTripletOf("dragon", 1) && hasTripletOf("pin", 1) && hasTripletOf("pin", 5)){
        yaku.push({ name:"雪月花", han:1 });
      }
    }

    return yaku;
  }

  function hasAllFiveSuits(tiles){
    const cats = new Set(tiles.map(t => t.suit));
    return cats.has("man") && cats.has("pin") && cats.has("sou") && cats.has("wind") && cats.has("dragon");
  }

  function nextTileForDora(t){
    if(t.suit === "man" || t.suit === "pin" || t.suit === "sou"){
      return { suit:t.suit, num: t.num === 9 ? 1 : t.num + 1 };
    } else if(t.suit === "wind"){
      return { suit:"wind", num: t.num === 4 ? 1 : t.num + 1 };
    }
    return { suit:"dragon", num: t.num === 3 ? 1 : t.num + 1 };
  }

  function countDoraDetail(allTiles){
    const doraTile = nextTileForDora(doraIndicator);
    const indicatorDora = allTiles.filter(t => t.suit === doraTile.suit && t.num === doraTile.num).length;
    return indicatorDora;
  }

  // リーチドラ（通常の裏ドラに相当。開局時から表向きに公開済み）：
  // リーチを宣言して和了した人にだけ適用する
  function countRiichiDoraDetail(allTiles){
    const riichiDoraTile = nextTileForDora(riichiDoraIndicator);
    return allTiles.filter(t => t.suit === riichiDoraTile.suit && t.num === riichiDoraTile.num).length;
  }

  function countAka(allTiles){
    return allTiles.filter(t => t.red).length;
  }

  function addDoraYaku(yaku, allTiles, seat){
    const indicatorDora = countDoraDetail(allTiles);
    if(indicatorDora > 0) yaku.push({ name:"ドラ", han:indicatorDora });
    let total = indicatorDora;
    if(riichiDeclared[seat]){
      const riichiDora = countRiichiDoraDetail(allTiles);
      if(riichiDora > 0) yaku.push({ name:"リーチドラ", han:riichiDora });
      total += riichiDora;
    }
    return total;
  }

  // 符計算はせず、飜数だけで点数を決める簡易方式
  // （settleRon/settleTsumoの倍率（子ロン=4倍・親ロン=6倍）と組み合わせると、
  //   子＝飜数×2,000点、親＝飜数×3,000点になります）
  function calcBasePoints(han){
    return han * 500;
  }

  // 手牌が和了形になっているか判定し、役があれば結果を返す（役なしはnull）
  function attemptWin(seat, extraTile, isTsumo){
    const concealed = hands[seat].slice();
    if(extraTile) concealed.push(extraTile);
    // 和了牌（ロンなら捨て牌、ツモなら直前にツモった牌）。待ちの形（平和の判定）に使う
    const winTile = extraTile || (seat === "bottom" ? lastDrawnTile : lastDrawnCpu[seat]);

    // 国士無双（役満）：1・9の数牌6種類＋字牌7種類、計13種類のうちどれか1種類が2枚、残り12種類が1枚ずつ
    function buildKokushiResult(){
      if(melds[seat].length !== 0 || concealed.length !== 14) return null;
      const kokushiKeys = [
        "man_1", "man_9", "pin_1", "pin_9", "sou_1", "sou_9",
        "wind_1", "wind_2", "wind_3", "wind_4", "dragon_1", "dragon_2", "dragon_3"
      ];
      const counts = countTiles(concealed);
      const keys = Object.keys(counts);
      if(!keys.every(k => kokushiKeys.includes(k))) return null;
      if(keys.length !== 13) return null;
      const values = Object.values(counts);
      if(!(values.filter(c => c === 2).length === 1 && values.every(c => c === 1 || c === 2))) return null;
      const yaku = [{ name:"国士無双", han:13 }];
      const akaCount = countAka(concealed);
      const base = calcBasePoints(13);
      return { seat, yaku, han:13, base, isTsumo, akaCount };
    }

    // 七対子（2翻）：対子が7組（同じ牌を4枚使って2組にするのも可）、かつ門前のみ
    function buildChiitoitsuResult(){
      if(melds[seat].length !== 0 || concealed.length !== 14) return null;
      const counts = countTiles(concealed);
      const values = Object.values(counts);
      const allEven = values.every(c => c % 2 === 0);
      const totalPairs = values.reduce((sum, c) => sum + c / 2, 0);
      if(!allEven || totalPairs !== 7) return null;

      // 連七対（役満）：同じ色の7つの連続した数字が、ちょうど2枚ずつの対子になっている（4枚使いは不可）
      const keys = Object.keys(counts);
      let isRenchitoi = false;
      if(keys.length === 7 && keys.every(k => counts[k] === 2)){
        const tiles7 = keys.map(keyToTile);
        const suit0 = tiles7[0].suit;
        if(tiles7.every(t => t.suit === suit0)){
          const nums = tiles7.map(t => t.num).sort((a, b) => a - b);
          isRenchitoi = nums.every((n, i) => i === 0 || n === nums[i - 1] + 1);
        }
      }

      // 緑一色の七対子・4枚使い（役満）：全て緑の牌で、いずれかの牌を4枚（2組扱い）使っている
      const isGreenFourTileChiitoi = concealed.every(isGreenTile) && keys.some(k => counts[k] === 4);

      // 紅孔雀の七対子（役満、4枚使いも可）：全て索子1・5・7・9と中だけ
      const isHongKongqueChiitoi = concealed.every(isHongKongqueTile);

      // 花鳥風月雪の七対子（役満、4枚使いも可）：全て筒子5・筒子1・索子1・風牌・白だけ
      const isKachoFugetsuYukiChiitoi = concealed.every(isKachoFugetsuYukiTile);

      // 百万石の七対子（役満、4枚使いも可）：萬子の数字の合計が100以上
      const isHyakumangokuChiitoi = manNumberSum(concealed) >= 100;

      let yaku;
      if(isGreenFourTileChiitoi) yaku = [{ name:"緑一色（七対子四枚使い）", han:13 }];
      else if(isHongKongqueChiitoi) yaku = [{ name:"紅孔雀", han:13 }];
      else if(isKachoFugetsuYukiChiitoi) yaku = [{ name:"花鳥風月雪", han:13 }];
      else if(isHyakumangokuChiitoi) yaku = [{ name:"百万石", han:13 }];
      else if(isRenchitoi) yaku = [{ name:"連七対", han:13 }];
      else yaku = [{ name:"七対子", han:2 }];
      // computeYaku()を経由しない役なので、ここでも同様にリーチ・一発をカウントする
      if(riichiDeclared[seat]) yaku.push({ name:"リーチ", han:1 });
      if(riichiDeclared[seat] && seat === "bottom" && ippatsuActive) yaku.push({ name:"一発", han:1 });
      if(isTsumo) yaku.push({ name:"門前清自摸和", han:1 });
      if(hasAllFiveSuits(concealed)) yaku.push({ name:"五門斉", han:1 });
      if(concealed.every(isToibudaoTile)) yaku.push({ name:"推不倒", han:2 });
      if(concealed.every(isXiaoYuWuTile)) yaku.push({ name:"小于五", han:2 });
      if(concealed.every(isDaYuWuTile)) yaku.push({ name:"大于五", han:2 });
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, concealed, seat);
      const akaCount = countAka(concealed);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    // 同じ牌の並びでも「刻子優先」「順子優先」で解釈が分かれることがあるため
    // （例：111222333は三連刻にも一色三順にもなり得る）、両方試して翻数が高い方を採用する
    function buildStandardResult(preferSequence){
      const decomp = findDecomposition(concealed, preferSequence);
      if(!decomp) return null;
      const pairTile = keyToTile(decomp.pairKey);
      const allSets = [...decomp.sets, ...meldsToSets(seat)];
      if(allSets.length !== 4) return null;
      const yaku = computeYaku(seat, allSets, pairTile, isTsumo, decomp, winTile);
      const allTiles = [...concealed, ...meldsToSets(seat).flatMap(s => s.tiles)];
      const akaCount = countAka(allTiles);
      if(yaku.length === 0){
        const indicatorDoraCount = countDoraDetail(allTiles);
        return { seat, yaku: [], han: 0, isTsumo, akaCount, yakunashi: true, indicatorDoraCount };
      }
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, allTiles, seat);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    function buildZuheLongResult(){
      const zDecomp = findZuheLongDecomposition(seat, concealed);
      if(!zDecomp) return null;
      const pairTile = keyToTile(zDecomp.pairKey);
      const allSets = [...zDecomp.threadSets, ...zDecomp.extraSets, ...meldsToSets(seat)];
      if(allSets.length !== 4) return null;
      const pseudoDecomp = { sets: zDecomp.extraSets };
      const yaku = computeYaku(seat, allSets, pairTile, isTsumo, pseudoDecomp, winTile, zDecomp.threadSets);
      yaku.push({ name:"組合龍", han: melds[seat].length === 0 ? 2 : 1 });
      const allTiles = [...concealed, ...meldsToSets(seat).flatMap(s => s.tiles)];
      const akaCount = countAka(allTiles);
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, allTiles, seat);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    function buildZuheTongshunResult(){
      const zDecomp = findZuheTongshunDecomposition(seat, concealed);
      if(!zDecomp) return null;
      const pairTile = keyToTile(zDecomp.pairKey);
      const allSets = [...zDecomp.threadSets, ...zDecomp.extraSets, ...meldsToSets(seat)];
      if(allSets.length !== 4) return null;
      const pseudoDecomp = { sets: zDecomp.extraSets };
      const yaku = computeYaku(seat, allSets, pairTile, isTsumo, pseudoDecomp, winTile, zDecomp.threadSets);
      yaku.push({ name:"組合同順", han: melds[seat].length === 0 ? 2 : 1 });
      const allTiles = [...concealed, ...meldsToSets(seat).flatMap(s => s.tiles)];
      const akaCount = countAka(allTiles);
      let han = yaku.reduce((sum, y) => sum + y.han, 0);
      han += addDoraYaku(yaku, allTiles, seat);
      const base = calcBasePoints(han);
      return { seat, yaku, han, base, isTsumo, akaCount };
    }

    const candidates = [buildKokushiResult(), buildChiitoitsuResult(), buildStandardResult(false), buildStandardResult(true), buildZuheLongResult(), buildZuheTongshunResult()].filter(Boolean);
    if(candidates.length === 0) return null;
    return candidates.reduce((best, r) => (r.han > best.han ? r : best));
  }

  // 待ち一覧：34種類の牌を1枚ずつ仮に加えてみて、和了の形になる（役なし和了も可の本ルールでは
  // attemptWin が非nullを返す）牌の種類だけを集めて返す（{suit,num}の配列）
  function getWaits(seat){
    return ALL_TILE_TYPES.filter(t => attemptWin(seat, t, true) !== null);
  }

  // テンパイ判定（役の有無は問わない、形式テンパイ）：待ちが1種類でもあればテンパイ
  function isTenpai(seat){
    return getWaits(seat).length > 0;
  }

  // フリテン判定：今の待ちのどれか1つでも、過去に自分で捨てていれば（鳴かれて消えていても）フリテン。
  // 同巡内フリテン・リーチ後の永続フリテンも合わせて見る
  function isFuriten(seat){
    if(furitenRiichi[seat] || furitenTemp[seat]) return true;
    const waitKeys = getWaits(seat).map(tileKey); // discardHistoryは文字列キーなので同じ形式に揃える
    return waitKeys.some(k => discardHistory[seat].includes(k));
  }

  // ロン判定はここを必ず通す：フリテン中は和了の形になっていてもロンできない
  function canRon(seat, tile){
    if(isFuriten(seat)) return false;
    return attemptWin(seat, tile, false);
  }

  // 門前（鳴きが無い、または暗槓のみ）かどうか。役判定側(closedHand)と同じ考え方
  function isClosedHand(seat){
    return melds[seat].every(m => m.type === "ankan");
  }

  // リーチ可能な場合に「切っても聴牌を保てる牌」の種類(suit+num)一覧を返す。門前でない／
  // 既にリーチ済みなら空配列。isTenpai(seat)はhands[seat]が13枚である前提の関数なので、
  // ツモ後の14枚から候補牌を1枚ずつ仮に抜いて13枚に戻し、判定が終わったらすぐ元の位置へ戻す
  function riichiValidDiscardTypes(seat){
    if(riichiDeclared[seat]) return [];
    if(!isClosedHand(seat)) return [];
    const hand = hands[seat];
    const seenTypes = new Set(); // 同じ種類(suit+num)の牌を何度も試さないための重複除去（赤ドラかどうかは形に影響しない）
    const valid = [];
    for(let i = 0; i < hand.length; i++){
      const typeKey = hand[i].suit + "_" + hand[i].num;
      if(seenTypes.has(typeKey)) continue;
      seenTypes.add(typeKey);
      const removed = hand.splice(i, 1)[0];
      const tenpai = isTenpai(seat);
      hand.splice(i, 0, removed);
      if(tenpai) valid.push(typeKey);
    }
    return valid;
  }

  // リーチ可能か：門前・聴牌・未リーチの3条件のみ（このアプリのハウスルールでは持ち点・山残りは問わない）
  function canDeclareRiichi(seat){
    return riichiValidDiscardTypes(seat).length > 0;
  }

  // --- 自分のリーチ宣言 ---
  function declareRiichi(seat){
    // riichiValidDiscardTypes()はriichiDeclared[seat]がfalseである前提で判定するので、
    // 必ずriichiDeclaredをtrueにする前に計算する
    riichiValidDiscards[seat] = riichiValidDiscardTypes(seat); // 聴牌を保てる牌だけに手牌のクリックを絞り込むための一覧
    riichiDeclared[seat] = true;
    scores[seat] -= 1000;
    renderScores();
    riichiSticks += 1;
    updateKyotakuDisplay();
    awaitingRiichiDiscard[seat] = true;
    nameplateElByName[seat].classList.add("riichi");
    setTurnIndicator("リーチ！捨てる牌を選んでください");
    updateActionButtons();
    renderMyHand(true); // 打牌可能な牌をリーチ宣言直後の一覧に絞り込んで再描画する
  }

  function settleTsumo(winnerSeat, base){
    const isDealer = winnerSeat === DEALER_SEAT;
    const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
    let total = 0;
    others.forEach(s => {
      const pay = isDealer
        ? Math.ceil(base * 2 / 100) * 100
        : (s === DEALER_SEAT ? Math.ceil(base * 2 / 100) * 100 : Math.ceil(base / 100) * 100);
      scores[s] -= pay;
      total += pay;
    });
    scores[winnerSeat] += total;
  }

  function settleRon(winnerSeat, loserSeat, base){
    const isDealer = winnerSeat === DEALER_SEAT;
    const pay = Math.ceil(base * (isDealer ? 6 : 4) / 100) * 100;
    scores[loserSeat] -= pay;
    scores[winnerSeat] += pay;
  }

  // 役満（13翻以上）は通常の計算式ではなく、親48,000点・子32,000点の固定点数にする
  function settleYakumanTsumo(winnerSeat){
    const isDealer = winnerSeat === DEALER_SEAT;
    const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
    let total = 0;
    others.forEach(s => {
      const pay = isDealer ? 16000 : (s === DEALER_SEAT ? 16000 : 8000);
      scores[s] -= pay;
      total += pay;
    });
    scores[winnerSeat] += total;
  }

  function settleYakumanRon(winnerSeat, loserSeat){
    const isDealer = winnerSeat === DEALER_SEAT;
    const pay = isDealer ? 48000 : 32000;
    scores[loserSeat] -= pay;
    scores[winnerSeat] += pay;
  }

  // 赤牌ボーナス：ドラ扱いにせず、1枚につき2,000点の直接ボーナス（親でも子でも同額）
  // ツモなら3人からそれぞれ2,000点（合計6,000点）、ロンなら相手から2,000点
  function settleAkaBonus(winnerSeat, loserSeat, akaCount, isTsumo){
    if(!akaCount) return 0;
    if(isTsumo){
      const perOpponent = akaCount * 2000;
      const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
      others.forEach(s => { scores[s] -= perOpponent; });
      const total = perOpponent * others.length;
      scores[winnerSeat] += total;
      return total;
    } else {
      const amount = akaCount * 2000;
      scores[loserSeat] -= amount;
      scores[winnerSeat] += amount;
      return amount;
    }
  }

  // 役なし和了の精算（簡易ルール）：子1,000点・親1,500点を基準に、
  // ドラは基準と同じ単位（子1,000点/親1,500点）で1枚ごとに加算。この基礎点+ドラ分は
  // 「合計額」なので、ロンなら1人がそのまま払う。ツモは3人均等ではなく「子1・親2」の比で払う：
  //   子の和了→子payer=合計/4・親payer=合計/2（2人×1/4 + 1人×1/2 = 合計）
  //   親の和了→支払う3人は全員子なので合計/3の均等
  // 単位が子1,000点/親1,500点なのでこの比で割り切れる（子payerは250の倍数、親payerは500の倍数）。
  // 100点単位に揃うとは限らないが端数は出ないため、切り上げ処理は不要。
  // 赤牌だけは親子・ツモロン問わず1枚につき1,000点を、支払う側1人あたりの額として加算する
  function settleYakunashi(winnerSeat, loserSeat, indicatorDoraCount, akaCount, isTsumo){
    const isDealer = winnerSeat === DEALER_SEAT;
    const unitRate = isDealer ? 1500 : 1000;
    const baseAndDora = unitRate * (1 + indicatorDoraCount); // 基礎点+ドラの合計額
    if(isTsumo){
      const others = ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat);
      let total = 0;
      others.forEach(s => {
        const share = isDealer
          ? baseAndDora / 3
          : (s === DEALER_SEAT ? baseAndDora / 2 : baseAndDora / 4);
        const pay = share + akaCount * 1000;
        scores[s] -= pay;
        total += pay;
      });
      scores[winnerSeat] += total;
      return total;
    } else {
      const perShare = baseAndDora + akaCount * 1000;
      scores[loserSeat] -= perShare;
      scores[winnerSeat] += perShare;
      return perShare;
    }
  }

  // ==================== 半荘進行ロジック（局・本場・親交代・終了判定） ====================

  // 本場ボーナス：ロンなら放銃者から、ツモなら他家3人からそれぞれ、本場1につき合計1,500点を
  // 和了者へ加算する（ロン+1,500点/本場、ツモ+500点/本場×3人）。honbaCountはこの局開始時点の本場数
  function applyHonbaBonus(honbaCount, isTsumo, winnerSeat, loserSeat){
    if(honbaCount <= 0) return 0;
    const total = honbaCount * 1500;
    if(isTsumo){
      ["bottom", "top", "left", "right"].filter(s => s !== winnerSeat).forEach(s => {
        scores[s] -= honbaCount * 500;
      });
    } else {
      scores[loserSeat] -= total;
    }
    scores[winnerSeat] += total;
    return total;
  }

  // 流局時のテンパイ料精算：ノーテンの人がテンパイの人それぞれに1,000点ずつ払う

  // ==================== ズンダモン音声アナウンス(VOICEVOX連携) ====================
  // ローカルで起動しているVOICEVOX Engine(既定ポート50021)のREST APIを呼び出して、
  // 局の節目・トビ/コールド終了・最終順位を実際にずんだもんの声で読み上げる。
  // VOICEVOXが起動していない環境ではfetchが失敗するだけなので、必ずcatchで握りつぶし
  // 無音フォールバックにする（音声関連の失敗でゲーム進行を止めないこと最優先）
  const VOICEVOX_BASE = "http://127.0.0.1:50021";
  // 話者(style) IDはVOICEVOXのバージョン・インストール環境で変わりうるため、決め打ちにせず
  // /speakers から「ずんだもん」の「ノーマル」スタイルIDを毎回引く（取得できなければ3を使う。
  // 3は多くのVOICEVOX配布版で「ずんだもん(ノーマル)」に割り当てられている既定値）
  let zundamonStyleIdPromise = null;
  function getZundamonStyleId(){
    if(!zundamonStyleIdPromise){
      zundamonStyleIdPromise = fetch(VOICEVOX_BASE + "/speakers")
        .then(res => res.json())
        .then(speakers => {
          const zunda = speakers.find(s => s.name === "ずんだもん");
          const normal = zunda && zunda.styles.find(st => st.name === "ノーマル");
          return normal ? normal.id : 3;
        })
        .catch(() => 3);
    }
    return zundamonStyleIdPromise;
  }

  // DevToolsを開かなくても状態が分かるよう、通信の様子を画面左下の常設パネルに反映する
  function setVoicevoxDebug(text, isError){
    const el = document.getElementById("voicevoxDebug");
    if(!el) return;
    el.textContent = "ずんだもん音声: " + text;
    el.style.color = isError ? "#ff6b6b" : "#ccc";
  }

  // 発声どうしが重ならないよう、1本の待ち行列に直列化して順番に再生する
  let zundamonQueue = Promise.resolve();
  function speakZundamon(text){
    zundamonQueue = zundamonQueue.catch(() => {}).then(async () => {
      setVoicevoxDebug("「" + text + "」再生準備中…", false);
      const speaker = await getZundamonStyleId();
      const queryRes = await fetch(
        VOICEVOX_BASE + "/audio_query?speaker=" + speaker + "&text=" + encodeURIComponent(text),
        { method: "POST" }
      );
      if(!queryRes.ok) throw new Error("audio_query失敗 status=" + queryRes.status);
      const query = await queryRes.json();
      const synthRes = await fetch(
        VOICEVOX_BASE + "/synthesis?speaker=" + speaker,
        { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(query) }
      );
      if(!synthRes.ok) throw new Error("synthesis失敗 status=" + synthRes.status);
      const blob = await synthRes.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      setVoicevoxDebug("「" + text + "」再生中", false);
      await new Promise(resolve => {
        audio.onended = resolve;
        audio.onerror = resolve;
        audio.play().catch(resolve);
      });
      URL.revokeObjectURL(url);
      setVoicevoxDebug("待機中(直前:「" + text + "」再生完了)", false);
    }).catch(err => {
      // VOICEVOX未起動・CORS拒否などでの失敗はゲーム進行自体は止めず、
      // 画面のパネルに赤字でエラー内容だけ残す（DevTools不要で原因が分かるように）
      setVoicevoxDebug("エラー(" + (err && err.message ? err.message : String(err)) + ") ※VOICEVOXが起動していないか、CORS設定(cors_policy_mode)がallになっていない可能性があります", true);
    });
  }

  // 局の節目のセリフ。honba===0は「この局数に入った最初の手（連荘で戻ってきたのではない）」を
  // 意味するので、これで判定すれば同じ局に連荘で何度いても1回しか鳴らない
  function announceKyokuMilestone(){
    if(honba !== 0) return;
    if(kyokuNumber === 5) speakZundamon("裏入なのだ");
    else if(kyokuNumber === 7) speakZundamon("ラス前なのだ");
    else if(kyokuNumber === 8) speakZundamon("オーラスなのだ");
  }

  // 「12局45分15秒」のように読み上げ用の文言を組み立てる（1時間以上かかった場合だけ時間も含める）
  function formatElapsedForSpeech(ms){
    const totalSeconds = Math.max(0, Math.round(ms / 1000));
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    return (hours > 0 ? hours + "時間" : "") + minutes + "分" + seconds + "秒";
  }

  // 対局終了時のセリフ。終了理由(トビ／コールド)→自分(bottom)の最終順位→対局時間と局数、の順で鳴らす
  function announceMatchEnd(reason, ranked){
    if(reason.type === "bust") speakZundamon("飛び終了なのだ");
    else if(reason.type === "over70000") speakZundamon("コールド終了なのだ");
    const myRank = ranked.indexOf("bottom") + 1;
    const rankText = myRank === 1 ? "トップ" : (myRank === 4 ? "ラス" : (myRank + "着"));
    speakZundamon(rankText + "なのだ");
    const elapsed = formatElapsedForSpeech(Date.now() - matchStartTime);
    speakZundamon(handsPlayedCount + "局" + elapsed + "で終了なのだ");
  }

  // 次局の状態（局数・本場・親）を決める純粋関数。
  // renchan=true：連荘（親はそのまま、本場+1、局数据え置き）
  // renchan=false：親交代（親はNEXT_SEAT、局数+1、本場0にリセット）
  function computeNextMatchState(current, renchan){
    if(renchan){
      return { kyokuNumber: current.kyokuNumber, honba: current.honba + 1, dealerSeat: current.dealerSeat };
    }
    return { kyokuNumber: current.kyokuNumber + 1, honba: 0, dealerSeat: NEXT_SEAT[current.dealerSeat] };
  }

  // 終了判定：トビ（マイナス）＞70,000点超え＞東8局終了、の優先順で理由を返す（無ければnull）。
  // finishedKyokuNumberは今終わった局の番号（連荘か親交代かによらず、次局へ進む前の値）
  function checkMatchEnd(currentScores, finishedKyokuNumber){
    const seats = ["bottom", "top", "left", "right"];
    const bustSeat = seats.find(s => currentScores[s] < 0);
    if(bustSeat) return { type:"bust", seat:bustSeat };
    const overSeat = seats.find(s => currentScores[s] > 70000);
    if(overSeat) return { type:"over70000", seat:overSeat };
    if(finishedKyokuNumber >= 8) return { type:"final" };
    return null;
  }

  function finalReasonText(reason){
    if(reason.type === "bust") return seatLabel[reason.seat] + "の持ち点がマイナスになったため終了（トビ）";
    if(reason.type === "over70000") return seatLabel[reason.seat] + "が70,000点を超えたため終了";
    return "東8局が終了したため終了";
  }

  // 順位点（ウマ）テーブル。40,000点（返し）超えの人数＝浮き人数で使うテーブルを切り替える。
  // 浮き0人（全員沈み）のときは順位点ではなくオカ20,000点のみをトップに加算する
  // （他家からの徴収を伴わない固定ボーナスのため、他の3人は0のまま＝合計は増える）
  const UMA_TABLE_BY_UKI_COUNT = {
    1: [48000, -8000, -16000, -24000],
    2: [24000, 8000, -8000, -24000],
    3: [12000, 8000, 4000, -24000]
  };
  const OKA_ONLY_TABLE = [20000, 0, 0, 0];

  // 最終素点から各家の順位点を計算する。同点の場合は同順位グループとして扱い、
  // そのグループが占める順位ぶんの順位点（オカ含む）を合計してグループ人数で均等に折半する
  function computeUmaBySeat(finalScores){
    const seats = ["bottom", "right", "top", "left"]; // 同点時：あなた→下家→対面→上家の順を優先
    const ranked = seats.slice().sort((a, b) => finalScores[b] - finalScores[a]);
    const ukiCount = seats.filter(s => finalScores[s] > 40000).length;
    const table = ukiCount === 0 ? OKA_ONLY_TABLE : UMA_TABLE_BY_UKI_COUNT[ukiCount];
    const umaBySeat = {};
    let i = 0;
    while(i < ranked.length){
      let j = i;
      while(j + 1 < ranked.length && finalScores[ranked[j + 1]] === finalScores[ranked[i]]) j++;
      const groupSeats = ranked.slice(i, j + 1);
      const groupSum = table.slice(i, j + 1).reduce((a, b) => a + b, 0);
      const split = Math.round(groupSum / groupSeats.length / 100) * 100;
      groupSeats.forEach(s => { umaBySeat[s] = split; });
      i = j + 1;
    }
    return { ranked, umaBySeat };
  }

  // 40,000点（返し）を原点とした±表示にする（例：素点80,500点→＋40,500点）
  function formatOriginDiff(n){
    const sign = n > 0 ? "＋" : (n < 0 ? "－" : "±");
    return sign + Math.abs(n) + "点";
  }

  // 最終順位画面を表示する（持ち点の高い順。同点はあなた→下家→対面→上家の順を優先）。
  // 素点・順位点（ウマ／オカ）・合計の3列を各行に表示する。
  // 素点・合計は35,000持ち・40,000返しのハウスルールに合わせ、40,000点を原点とした±表示にする
  // （合計＝(素点-40,000)+順位点）
  function showFinalStandings(reason){
    const { ranked, umaBySeat } = computeUmaBySeat(scores);
    announceMatchEnd(reason, ranked);
    const rows = ranked.map((s, i) => {
      const uma = umaBySeat[s];
      const rawDiff = scores[s] - 40000;
      const total = rawDiff + uma;
      return `<div class="final-rank-row"><span class="final-rank-num">${i + 1}位</span>` +
        `<span class="final-rank-name">${seatLabel[s]}</span>` +
        `<span class="final-rank-pts">${formatOriginDiff(rawDiff)}</span>` +
        `<span class="final-rank-uma">${formatOriginDiff(uma)}</span>` +
        `<span class="final-rank-total">${formatOriginDiff(total)}</span></div>`;
    }).join("");
    document.getElementById("finalStandings").innerHTML =
      `<div class="final-title">対局終了</div>` +
      `<div class="final-reason">${finalReasonText(reason)}</div>` +
      `<div class="final-rank-row final-rank-header">` +
      `<span></span><span></span><span>素点(40,000基準)</span><span>順位点</span><span>合計</span></div>` +
      rows;
    document.getElementById("finalOverlay").style.display = "flex";
  }

  // 局終了後の共通処理：終了条件を満たしていれば最終順位画面を出し、満たしていなければ
  // 結果パネルに「次局へ」ボタンを追加する（押すと次局の状態をsessionStorageへ保存してリロードする）。
  // winnerSeat：この局の和了者（流局時はundefined）。トビ終了時、飛んだ人は飛ばした人＝winnerSeatに
  // 10,000点を支払ってから順位を確定する（流局によるトビは「誰が飛ばしたか」が一意に定まらないため対象外）
  function proceedOrEndMatch(renchan, winnerSeat){
    const finishedKyoku = kyokuNumber;
    const reason = checkMatchEnd(scores, finishedKyoku);
    if(reason){
      if(reason.type === "bust" && winnerSeat){
        scores[reason.seat] -= 10000;
        scores[winnerSeat] += 10000;
        renderScores();
      }
      clearMatchState();
      showFinalStandings(reason);
      return;
    }
    const next = computeNextMatchState({ kyokuNumber, honba, dealerSeat: DEALER_SEAT }, renchan);
    const box = document.getElementById("resultBox");
    box.insertAdjacentHTML("beforeend", `<button type="button" class="next-kyoku-btn" id="nextKyokuBtn">次局へ</button>`);
    document.getElementById("nextKyokuBtn").onclick = () => {
      saveMatchState({ scores, kyokuNumber: next.kyokuNumber, honba: next.honba, dealerSeat: next.dealerSeat, riichiSticks, startingDealerSeat: STARTING_DEALER_SEAT, matchStartTime, handsPlayedCount });
      location.reload();
    };
  }

  function settleRyuukyoku(tenpaiSeats, notenSeats){
    if(tenpaiSeats.length === 0 || notenSeats.length === 0) return;
    const gainEach = 1000 * notenSeats.length;
    const lossEach = 1000 * tenpaiSeats.length;
    tenpaiSeats.forEach(s => { scores[s] += gainEach; });
    notenSeats.forEach(s => { scores[s] -= lossEach; });
  }

  function showRyuukyokuResult(tenpaiSeats, notenSeats){
    const box = document.getElementById("resultBox");
    box.style.display = "block";
    // 全員テンパイ／全員ノーテンは点数移動が発生しない（settleRyuukyoku側で0扱い）ので、
    // その場合は自然に±0点になる。テンパイ／ノーテンの文言は出さず点数だけを表示する
    const hasMovement = tenpaiSeats.length > 0 && notenSeats.length > 0;
    const gainEach = hasMovement ? 1000 * notenSeats.length : 0;
    const lossEach = hasMovement ? 1000 * tenpaiSeats.length : 0;
    // 席ごとに1行ずつ、あなた→下家→対面→上家の順（＝seats配列の順）で点数増減だけを出す
    const rows = ["bottom", "right", "top", "left"].map(s => {
      const delta = tenpaiSeats.includes(s) ? gainEach : -lossEach;
      const deltaText = delta > 0 ? "＋" + delta + "点" : (delta < 0 ? "－" + (-delta) + "点" : "±0点");
      return `<div class="result-yaku">${seatLabel[s]}　${deltaText}</div>`;
    }).join("");
    box.innerHTML = `<div class="result-title">流局</div>` + rows;
  }

  // 山が尽きた（誰もツモれなくなった）ときの流局処理。
  // 「上がり連荘」ルールのため、流局は親のテンパイ／ノーテンを問わず常に親交代
  // （ノーテン料の精算＝settleRyuukyokuは従来通り。連荘判定にのみ影響しない）
  function handleRyuukyoku(){
    gameEnded = true;
    const seats = ["bottom", "right", "top", "left"]; // あなた・下家・対面・上家の順で表示する
    const tenpaiSeats = seats.filter(isTenpai);
    const notenSeats = seats.filter(s => !tenpaiSeats.includes(s));
    settleRyuukyoku(tenpaiSeats, notenSeats);
    renderScores();
    showRyuukyokuResult(tenpaiSeats, notenSeats);
    setTurnIndicator("");
    hideCallPrompt();
    renderMyHand(false);
    revealAllHands(); // 流局時も4人全員の手牌を公開する
    fitTileSize(); // 公開した牌の実寸に合わせて再計算し、自分の手牌がボタン行と被らないようにする
    proceedOrEndMatch(false); // 上がり連荘：流局は常に親交代
  }

  // totalGain: 精算後に和了者の持ち点が実際に何点増えたか（供託の総取り分も含む）。
  // 「持ち点がいきなり変わるだけで分からない」を解消するため、常にこの実数を表示する
  // paymentsBySeat: finalizeWinで本場ボーナス適用後に控えた、各家の実際の支払額（seat -> 点数）。
  // 本場ボーナスは合算済み。供託は勝者のscoresにしか加算しないため、他家のpaymentsBySeatには影響しない
  // collectedKyotaku: この和了で供託から受け取った額（0なら「リーチ供託」の行を出さない）
  // honbaCount/honbaBonusTotal: 「◯本場」の内訳行を出すための値（0なら行を出さない）。
  // paymentsBySeat/totalGainには既に合算済みなので、この行は内訳の補足表示という位置づけ
  function showResult(seat, result, loserSeat, bonusTotal, totalGain, paymentsBySeat, collectedKyotaku, honbaCount, honbaBonusTotal){
    const box = document.getElementById("resultBox");
    box.style.display = "block";
    const title = result.isTsumo ? (seatLabel[seat] + "のツモ") : (seatLabel[seat] + "のロン（" + seatLabel[loserSeat] + "から）");
    const isTsumo = result.isTsumo;
    const isDealer = seat === DEALER_SEAT;

    // 役名の括弧書き（例:「役牌（三元牌）」の（三元牌）部分）は表示しない
    const stripParen = name => name.replace(/（[^）]*）/g, "");
    // 表示だけの短縮名（役判定側のnameキーは変更しない）
    const DISPLAY_NAME_ALIAS = { "門前清自摸和": "門前清", "リーチドラ": "Rドラ" };
    const displayNameOf = name => DISPLAY_NAME_ALIAS[name] || stripParen(name);

    const row = (name, hanText, pts, cls) =>
      `<div class="result-row${cls ? " " + cls : ""}">` +
      `<span class="col-name">${name}</span>` +
      `<span class="col-han">${hanText}</span>` +
      `<span class="col-pts">${pts}</span>` +
      `</div>`;

    let rowsHtml = "";
    if(result.yakunashi){
      const unitRate = isDealer ? 1500 : 1000;
      const doraCount = result.indicatorDoraCount;
      // settleYakunashiが100点単位への切り上げをやめ「子1・親2」の比の実額計算に変わったため、
      // 役無し・ドラの行は名目額（unitRate・doraCount*unitRate）をそのまま出せばよい
      rowsHtml += row("役無し", "", unitRate);
      if(doraCount > 0){
        rowsHtml += row("ドラ×" + doraCount, "", doraCount * unitRate);
      }
      if(result.akaCount > 0){
        const payers = isTsumo ? 3 : 1; // settleYakunashiは赤1枚につき支払う側1人あたり1,000点
        rowsHtml += row("<span class=\"bonus-red-text\">赤</span>×" + result.akaCount + (isTsumo ? "(自摸)" : ""), "", result.akaCount * 1000 * payers);
      }
    } else {
      // ドラ・リーチドラはハウスルール上、他の役と違って「翻を稼ぐための役」ではなく
      // 定額ボーナスの性格が強いので、表示上も他の役（飜数の少ない順）とは分けて末尾にまとめる
      // （赤牌ボーナスも同じ理由で、常にそのさらに後ろの行に表示する）
      const DORA_YAKU_NAMES = new Set(["ドラ", "リーチドラ"]);
      // 役満は固定額（親48,000点・子32,000点）で、飜×単位の線形計算に乗らない。
      // ドラの飜がhan>=13の判定に加わっただけの場合も含め、役満成立時はドラが実際の点数に
      // 一切寄与しないため、ドラの行自体を出さない（点数欄だけ空欄にすると「本来は点数が
      // あるのに表示できていない」ように誤読されるため、行ごと省く方が実態に合う）
      const isYakuman = result.han >= 13;
      const normalYaku = result.yaku.filter(y => !DORA_YAKU_NAMES.has(y.name)).slice().sort((a, b) => a.han - b.han);
      const doraYaku = isYakuman ? [] : result.yaku.filter(y => DORA_YAKU_NAMES.has(y.name));
      const pointsPerHan = isDealer ? 3000 : 2000; // 1翻あたりの合計額（子2,000点・親3,000点）
      normalYaku.concat(doraYaku).forEach(y => {
        const isDoraRow = DORA_YAKU_NAMES.has(y.name);
        // リーチドラの「Rドラ」部分だけ赤くする。通常のドラ・他の役名は素のまま
        const namePart = y.name === "リーチドラ" ? `<span class="bonus-red-text">${displayNameOf(y.name)}</span>` : displayNameOf(y.name);
        const displayName = isDoraRow ? (namePart + "×" + y.han) : namePart;
        const hanText = isYakuman ? "役満" : (y.han + "飜");
        const pts = isYakuman ? "" : y.han * pointsPerHan;
        rowsHtml += row(displayName, hanText, pts);
      });
      if(bonusTotal > 0){
        rowsHtml += row("<span class=\"bonus-red-text\">赤</span>×" + result.akaCount + (isTsumo ? "(自摸)" : ""), "", bonusTotal);
      }
    }

    if(collectedKyotaku > 0){
      rowsHtml += row("リーチ供託", "", collectedKyotaku);
    }
    if(honbaBonusTotal > 0){
      rowsHtml += row(honbaCount + "本場", "", honbaBonusTotal);
    }

    let totalHtml;
    if(isTsumo){
      const others = ["bottom", "top", "left", "right"].filter(s => s !== seat);
      const amounts = others.map(s => paymentsBySeat[s]);
      const allSame = amounts.every(a => a === amounts[0]);
      const splitText = allSame
        ? amounts[0] + "ALL"
        : paymentsBySeat[others.find(s => s !== DEALER_SEAT)] + "・" + paymentsBySeat[DEALER_SEAT];
      totalHtml = row(splitText, "", totalGain, "total-row");
    } else {
      totalHtml = row("", "", totalGain, "total-row");
    }

    box.innerHTML =
      `<div class="result-title">${title}</div>` +
      rowsHtml +
      totalHtml;
  }

  function finalizeWin(winnerSeat, loserSeat, result){
    gameEnded = true;
    // settle系を呼ぶ前に4人全員のscoresを控えておく（供託加算より前の、和了精算のみの差分を後で取るため）
    const seats = ["bottom", "top", "left", "right"];
    const scoresBefore = {};
    seats.forEach(s => { scoresBefore[s] = scores[s]; });
    let bonusTotal;
    if(result.yakunashi){
      bonusTotal = settleYakunashi(winnerSeat, loserSeat, result.indicatorDoraCount, result.akaCount, result.isTsumo);
    } else if(result.han >= 13){
      if(result.isTsumo) settleYakumanTsumo(winnerSeat);
      else settleYakumanRon(winnerSeat, loserSeat);
      bonusTotal = settleAkaBonus(winnerSeat, loserSeat, result.akaCount, result.isTsumo);
    } else {
      if(result.isTsumo) settleTsumo(winnerSeat, result.base);
      else settleRon(winnerSeat, loserSeat, result.base);
      bonusTotal = settleAkaBonus(winnerSeat, loserSeat, result.akaCount, result.isTsumo);
    }
    let collectedKyotaku = 0; // この和了で実際に受け取った供託額（表示用。riichiSticksをリセットする前に控えておく）
    if(riichiSticks > 0 && riichiDeclared[winnerSeat]){
      collectedKyotaku = riichiSticks * 1000;
      scores[winnerSeat] += riichiSticks * 1000;
      riichiSticks = 0;
      updateKyotakuDisplay();
    }
    // 本場ボーナス：この局の開始時点の本場数（honba）を使う。ロンなら放銃者から、
    // ツモなら他家3人からそれぞれ、本場1につき合計1,500点を和了者へ加算する。
    // honbaBonusTotalは「◯本場」の内訳行に、paymentsBySeat（下）は「◯◯ALL」・ロンの合計行に、
    // それぞれ本場ボーナス込みの金額として使う（内訳行と合計欄の両方に出す＝合算はしても内訳は消さない）
    const honbaBonusTotal = applyHonbaBonus(honba, result.isTsumo, winnerSeat, loserSeat);
    // 各家の実際の支払額（控えておいた値－現在値）を集計する。供託を除く（供託は場からの受け取りで
    // 特定の支払者がいないため）本場ボーナス適用後の値を使うことで、結果パネルの合計欄
    // （ツモの「◯◯ALL」・ロンの合計）に本場ボーナス込みの実額をそのまま表示できる。
    // 比率からの逆算はしない：赤牌ボーナスは親子に関係なく1枚につき各家2,000点の均等払いのため、
    // 通常役の飜による2:1の比が崩れる。実際の支払額を足し上げれば、親の和了は自然に3人同額になる。
    const paymentsBySeat = {};
    seats.forEach(s => { paymentsBySeat[s] = scoresBefore[s] - scores[s]; });
    const totalGain = scores[winnerSeat] - scoresBefore[winnerSeat];
    renderScores();
    showResult(winnerSeat, result, loserSeat, bonusTotal, totalGain, paymentsBySeat, collectedKyotaku, honba, honbaBonusTotal);
    setTurnIndicator("");
    hideCallPrompt();
    renderMyHand(false);
    revealAllHands(); // 和了時も4人全員の手牌を公開する
    fitTileSize(); // 公開した牌の実寸に合わせて再計算し、自分の手牌がボタン行と被らないようにする
    proceedOrEndMatch(winnerSeat === DEALER_SEAT, winnerSeat); // 親の和了＝連荘、それ以外＝親交代
  }

  // 下段の「和了」ボタンはツモとロンを兼ねる。
  // ロン待ち（pendingRon）があればそれを優先。無ければ、今まさに牌を引いた直後
  // （lastDrawnTileがある間）だけツモの成立を判定する。それ以外（鳴いた直後の打牌待ちや
  // 打牌した直後など）は判定を待たずに常に無効化する。
  function updateWinButton(){
    const btn = document.getElementById("winBtn");
    if(gameEnded){
      btn.disabled = true;
      btn.onclick = null;
      return;
    }
    if(pendingRon){
      const ron = pendingRon; // hideCallPrompt()がpendingRonをnullにする前にクロージャで確保しておく
      btn.disabled = false;
      btn.onclick = () => { hideCallPrompt(); finalizeWin("bottom", ron.discarderSeat, ron.result); };
      return;
    }
    if(!lastDrawnTile){
      btn.disabled = true;
      btn.onclick = null;
      return;
    }
    const result = attemptWin("bottom", null, true);
    if(result){
      btn.disabled = false;
      btn.onclick = () => finalizeWin("bottom", "bottom", result);
    } else {
      btn.disabled = true;
      btn.onclick = null;
    }
  }

  // 下段の「スルー」ボタン：他家の捨て牌に対する鳴きプロンプトが開いている間、
  // または自分のツモに対する加槓・暗槓の候補（pendingSelfKan）がある間だけ有効にする
  function updateThroughButton(){
    const btn = document.getElementById("throughBtn");
    if(gameEnded){
      btn.disabled = true;
      btn.onclick = null;
      return;
    }
    if(pendingCallContext){
      const ctx = pendingCallContext; // hideCallPrompt()がクリアする前にクロージャで確保しておく
      const hadRon = !!pendingRon; // ロン可能だった場面でスルーした＝フリテン。同じくクリア前に確保する
      btn.disabled = false;
      btn.onclick = () => {
        hideCallPrompt();
        if(hadRon){
          furitenTemp.bottom = true;
          if(riichiDeclared.bottom) furitenRiichi.bottom = true;
        }
        advanceTurnAfterDiscard(ctx.discarderSeat);
      };
      return;
    }
    if(pendingSelfKan && pendingSelfKan.candidates.length > 0){
      // 加槓・暗槓をせず手牌に保留する＝通常の打牌に戻るだけなので、ターンを進める処理は不要
      btn.disabled = false;
      btn.onclick = () => {
        pendingSelfKan = null;
        selfKanSelecting = false;
        updateActionButtons();
        renderMyHand(true);
      };
      return;
    }
    btn.disabled = true;
    btn.onclick = null;
  }

  // 下段のチー/ポン/カンボタン。
  // ・他家の捨て牌へのチー/ポン/カン（pendingCallOptions）が開いている間はそちらを優先
  // ・自分の番で加槓・暗槓の候補（pendingSelfKan）がある間は、カンボタンだけを有効にする
  //   （チー・ポンは他家の捨て牌に対してしか成立しないため対象外）
  // 選択モード中（activeCallSelection）は、途中で別の種類に切り替えられないよう3つとも無効にする
  // （やめたい時はスルーで選択自体をキャンセルする）
  function updateCallButtons(){
    const chiBtn = document.getElementById("chiBtn");
    const ponBtn = document.getElementById("ponBtn");
    const kanBtn = document.getElementById("kanBtn");
    if(gameEnded){
      [chiBtn, ponBtn, kanBtn].forEach(b => { b.disabled = true; b.onclick = null; });
      return;
    }
    // リーチ後は一切鳴けない（念のための二重ガード。本来pendingCallOptions側で既に選択肢が作られない）
    if(pendingCallOptions && !activeCallSelection && !riichiDeclared.bottom){
      const opts = pendingCallOptions;
      chiBtn.disabled = !(opts.chiShapes && opts.chiShapes.length > 0);
      chiBtn.onclick = chiBtn.disabled ? null : () => startCallSelection("chi");
      ponBtn.disabled = !opts.pon;
      ponBtn.onclick = ponBtn.disabled ? null : () => startCallSelection("pon");
      kanBtn.disabled = !opts.kan;
      kanBtn.onclick = kanBtn.disabled ? null : () => startCallSelection("kan");
      return;
    }
    chiBtn.disabled = true;
    chiBtn.onclick = null;
    ponBtn.disabled = true;
    ponBtn.onclick = null;
    if(pendingCallOptions || activeCallSelection){
      // 他家の捨て牌への応答中（選択モード含む）は自摸カンの余地が無い
      kanBtn.disabled = true;
      kanBtn.onclick = null;
      return;
    }
    if(pendingSelfKan && pendingSelfKan.candidates.length > 0){
      kanBtn.disabled = false;
      kanBtn.onclick = () => handleSelfKanButtonClick();
    } else {
      kanBtn.disabled = true;
      kanBtn.onclick = null;
    }
  }

  // 下段の「リーチ」ボタン：和了ボタンと同じく、今まさに牌を引いた直後（lastDrawnTileがある間）
  // だけ、リーチ可能条件(canDeclareRiichi)を満たす時に有効化する
  function updateRiichiButton(){
    const btn = document.getElementById("riichiBtn");
